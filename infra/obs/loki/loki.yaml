# Loki стенда: один процесс, файлы на диске, хранение 7 суток (c4-deployment.md раздел 5, memory-budget.md: 256 МБ).
# Приём только от Alloy внутри сети obs, без аутентификации: сеть закрыта, порт на хост публикуется только отладочным файлом на 127.0.0.1.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
  log_format: json

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

limits_config:
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_query_series: 500
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  retention_delete_delay: 2h

# Кэши в памяти не нужны: объём журналов стенда мал, а память Loki ограничена
query_range:
  cache_results: false
chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: false

ingester:
  chunk_idle_period: 30m
  max_chunk_age: 2h

analytics:
  reporting_enabled: false
