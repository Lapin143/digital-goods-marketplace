# Панели Grafana как код: файлы JSON из infra/obs/grafana/dashboards подключаются при старте, правка в интерфейсе не сохраняется.
apiVersion: 1

providers:
  - name: dgm
    orgId: 1
    folder: Стенд
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/dgm/grafana/dashboards
