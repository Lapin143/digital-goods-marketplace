registerDuplicateBodyHtml=<p>Someone tried to register at {1} with this e-mail, but an account with it already exists.</p><p>If it was you, <a href="{0}">sign in to the existing account</a>. Forgot your password? Use "Forgot password?" on the sign-in page.</p><p>If it was not you, no action is needed: the account has not been changed.</p>
