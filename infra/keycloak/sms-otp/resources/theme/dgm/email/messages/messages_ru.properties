registerDuplicateBody=Кто-то пытался зарегистрироваться в сервисе {1}, указав этот e-mail, но учётная запись с ним уже есть.\n\nЕсли это были вы, войдите в существующую учётную запись: {0}\nЗабыли пароль? На странице входа выберите «Забыли пароль?».\n\nЕсли это были не вы, ничего делать не нужно: учётная запись не изменена.
registerDuplicateBodyHtml=<p>Кто-то пытался зарегистрироваться в сервисе {1}, указав этот e-mail, но учётная запись с ним уже есть.</p><p>Если это были вы, <a href="{0}">войдите в существующую учётную запись</a>. Забыли пароль? На странице входа выберите «Забыли пароль?».</p><p>Если это были не вы, ничего делать не нужно: учётная запись не изменена.</p>
