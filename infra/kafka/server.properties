# Kafka 4.3 стенда: режим KRaft, один узел (брокер и контроллер в одном процессе), всё по SSL.
# Лимит контейнера 448 МБ, Xmx 256 МБ (docs/09-operations/memory-budget.md). Подключается сценарием entrypoint.sh.

process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:9094
controller.listener.names=CONTROLLER

# INTERNAL: клиенты в сети Docker. HOST: порт 19093 для отладки с хоста, наружу публикуется только файлом
# compose.debug.yaml на 127.0.0.1. CONTROLLER: обмен контроллера внутри контейнера.
listeners=INTERNAL://:9093,HOST://:19093,CONTROLLER://:9094
advertised.listeners=INTERNAL://kafka:9093,HOST://localhost:19093
inter.broker.listener.name=INTERNAL
listener.security.protocol.map=INTERNAL:SSL,HOST:SSL,CONTROLLER:SSL

# TLS и сертификат клиента обязательны на всех слушателях (ADR-022). Ключ и сертификат склеены в entrypoint.sh в один PEM-файл.
ssl.keystore.type=PEM
ssl.keystore.location=/tmp/dgm/keystore.pem
ssl.truststore.type=PEM
ssl.truststore.location=/run/secrets/tls_ca.crt
ssl.client.auth=required
ssl.endpoint.identification.algorithm=https
ssl.enabled.protocols=TLSv1.3,TLSv1.2

# Принципал это CN сертификата клиента, то есть имя сервиса (infra/pki/README.md)
ssl.principal.mapping.rules=RULE:^.*CN=([^,]+).*$/$1/,DEFAULT

# Права доступа по темам: что не разрешено, то запрещено. Суперпользователи: брокер и задание kafka-init.
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:kafka;User:kafka-init

# Темы создаёт только kafka-init (conventions.md, 11.3): опечатка в имени даёт ошибку, а не новую тему
auto.create.topics.enable=false
delete.topic.enable=true

# Один брокер: репликации нет (ADR-003)
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
num.partitions=1
group.initial.rebalance.delay.ms=0

log.dirs=/var/lib/kafka/data
log.retention.check.interval.ms=300000
