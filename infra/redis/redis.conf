# Redis 8.10 стенда. Лимит контейнера 96 МБ, maxmemory 64 МБ (docs/09-operations/memory-budget.md).
# Данные временные (ADR-012): тома нет, сохранение на диск выключено.

# Только TLS (ADR-022). Обычный порт закрыт.
port 0
tls-port 6379
tls-cert-file /run/secrets/tls_redis.crt
tls-key-file /run/secrets/tls_redis.key
tls-ca-cert-file /run/secrets/tls_ca.crt
tls-protocols "TLSv1.2 TLSv1.3"
tls-auth-clients no
tls-replication no
tls-cluster no

# Пользователи ACL по сервисам. Файл собирает infra/redis/entrypoint.sh из секретов.
aclfile /run/dgm/users.acl

# Память: при заполнении Redis отвечает ошибкой, а не удаляет записи (memory-budget, решение 4)
maxmemory 64mb
maxmemory-policy noeviction

# Без сохранения на диск
save ""
appendonly no
dir /data

# Журнал в стандартный вывод
loglevel notice
logfile ""
