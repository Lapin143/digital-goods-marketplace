# Правила входа PostgreSQL. Читаются сверху вниз, срабатывает первое подходящее.
# TYPE      DATABASE  USER  ADDRESS      METHOD

# Сокет внутри контейнера: инициализация и проверка готовности. Попасть на него можно только изнутри контейнера.
local       all       all                trust

# По сети только TLS и пароль scram-sha-256 (ADR-022). Соединение без шифрования отвергается.
hostnossl   all       all   0.0.0.0/0    reject
hostnossl   all       all   ::/0         reject
hostssl     all       all   0.0.0.0/0    scram-sha-256
hostssl     all       all   ::/0         scram-sha-256
