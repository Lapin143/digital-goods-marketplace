# Правила входа PostgreSQL. Читаются сверху вниз, срабатывает первое подходящее.
# TYPE      DATABASE  USER  ADDRESS      METHOD

# Сокет внутри контейнера: инициализация и проверка готовности. Попасть на него можно только изнутри контейнера.
local       all       all                trust

# По сети только TLS и пароль scram-sha-256 (ADR-022). Соединение без шифрования отвергается.
hostnossl   all       all   0.0.0.0/0    reject
hostnossl   all       all   ::/0         reject

# Рабочие роли сервисов (app_*) входят и с паролем, и с клиентским сертификатом платформы (взаимный TLS, ADR-022): без сертификата
# или с сертификатом не от нашего центра соединение отвергается ещё до проверки пароля. Роль начинается со слэша: это регулярное
# выражение (PostgreSQL 16). Проверяется цепочка (verify-ca): имя в сертификате это имя сервиса, а не роли.
hostssl     all       /^app_  0.0.0.0/0  scram-sha-256  clientcert=verify-ca
hostssl     all       /^app_  ::/0       scram-sha-256  clientcert=verify-ca

# Остальные роли (мигратор схемы, администратор, Keycloak) входят по паролю. Мигратор и администратор работают из контейнеров
# Flyway и psql, Keycloak (Quarkus) читает ключ клиента только в формате PKCS#8 DER, а ключи платформы в PEM: перенос на Ф5.
hostssl     all       all   0.0.0.0/0    scram-sha-256
hostssl     all       all   ::/0         scram-sha-256
