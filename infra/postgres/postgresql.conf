# PostgreSQL 16 стенда. Подключается через -c config_file (infra/postgres/entrypoint.sh).
# Числа памяти из docs/09-operations/memory-budget.md: лимит контейнера 512 МБ.

listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'

# Соединения: шесть сервисов по 8, Keycloak 10, резервное копирование 2, администратор 5 (memory-budget, решение 2)
max_connections = 100
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 32MB
effective_cache_size = 256MB
huge_pages = off

# TLS обязателен (ADR-022). Правила входа в pg_hba.conf: без шифрования не пускают
ssl = on
ssl_cert_file = '/run/dgm/server.crt'
ssl_key_file = '/run/dgm/server.key'
ssl_ca_file = '/run/dgm/ca.crt'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = scram-sha-256
hba_file = '/etc/dgm/postgres/pg_hba.conf'

# Журнал в стандартный вывод контейнера (его собирает Alloy)
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_connections = on
log_disconnections = off
log_min_duration_statement = 500ms
log_lock_waits = on
timezone = 'UTC'
log_timezone = 'UTC'

# Журнал транзакций. Архивирование (archive_mode, том pgarchive) включается в Ф6 вместе с backup-job (NFT-4.2)
wal_level = replica
max_wal_size = 512MB
