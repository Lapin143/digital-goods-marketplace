# Настройки Gitleaks (ST-14): стандартные правила плюс исключения проекта.
title = "digital-goods-marketplace"

[extend]
useDefault = true

[allowlist]
description = "Файлы, где образцы секретов запрещены, но допустимы имена переменных и пути; два заведомо ненастоящих мастер-ключа в модульном тесте ротации (старый и новый, это «old-key» и «new-key» с повторами); два вымышленных образца из примеров OpenAPI и тестов заглушки продавца (секрет подписи и хеш API-ключа: последовательности шестнадцатеричных цифр, которые никуда не ведут)"
paths = [
  '''\.env\.example$''',
]
regexes = [
  '''^b2xkLWtleS1vbGQta2V5LW9sZC1rZXktb2xkLWtleQ==$''',
  '''^bmV3LWtleS1uZXcta2V5LW5ldy1rZXktbmV3LWtleQ==$''',
  '''^9f2c4e6a8b0d1f3a5c7e9b1d3f5a7c9e0b2d4f6a8c0e2a4c6e8b0d2f4a6c8e0a$''',
  '''^a3c1e5b7d9f0123456789abcdef0123456789abcdef0123456789abcdef01234$''',
]
