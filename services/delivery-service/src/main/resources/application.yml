# Сервис «delivery». Общие значения (порты 8443 и 8444 с mTLS, журнал JSON, метрики) задаёт каркас: dgm-kit-defaults.properties.
# Адреса и секреты приходят от Compose: переменные DGM_* и каталог /run/secrets.
spring:
  application:
    name: delivery-service

dgm:
  security:
    jwt:
      issuer: ${DGM_JWT_ISSUER:https://localhost:8443/auth/realms/dgm}
      jwks-uri: ${DGM_JWKS_URI:https://keycloak:8443/auth/realms/dgm/protocol/openid-connect/certs}
  db:
    host: ${DGM_PG_HOST:postgres}
    port: ${DGM_PG_PORT:5432}
    database: delivery_db
    migrator-role: migrator_delivery
    modules:
      # Предел соединений роли app_delivery 8: пул 7 и одно соединение публикатора Outbox
      delivery:
        role: app_delivery
        pool-size: 7
  kafka:
    bootstrap: ${DGM_KAFKA_BOOTSTRAP:kafka:9093}
  # Диспетчер выдачи (ADR-011, c4-components-delivery-service.md): проход раз в секунду, пачка 20 выдач, аренда 2 минуты (упавший процесс не теряет выдачу).
  delivery:
    dispatcher:
      interval: PT1S
      initial-delay: PT5S
      lease: PT2M
      batch: 20
    # Опрос статусов писем: раз в 5 минут выдачи «отправлено» старше 5 минут без итогового статуса спрашиваются у провайдера (вторая линия после вебхука, ADR-011)
    poller:
      interval: PT5M
      initial-delay: PT30S
      min-age: PT5M
      batch: 50
    # Контроль 30 минут от оплаты: раз в 30 секунд берутся открытые контроли, срок которых наступил (NFT-2.4)
    watch:
      interval: PT30S
      initial-delay: PT10S
      batch: 50
  # Ключи для письма берутся у inventory-service в момент отправки по mTLS (OP-38, ADR-009): ответ за 2 секунды, один повтор запроса на чтение.
  # Предохранитель по умолчанию каркаса.
  peers:
    inventory-service:
      base-url: ${DGM_INVENTORY_URL:https://inventory-service:8443}
      attempt-timeout: 2s
      retry: 300ms
  # E-mail-провайдер: на стенде заглушка external-stubs (ключ API в секрете delivery_email_key), в проде адрес настоящего провайдера
  email:
    base-url: ${DGM_EMAIL_BASE_URL:https://external-stubs:8443}
  outbox:
    module: delivery
  consumer:
    module: delivery

# Параметры платформы (Р-139): ключи совпадают с platform_parameter, до слушателя config.changed (срез 3) значения читаются отсюда.
delivery:
  retry-schedule: 10s,30s,2m,5m,10m    # паузы после неудачных попыток: шесть попыток за 17 минут 40 секунд без разброса (ADR-011)
  control-minutes: 30                  # контроль доставки от оплаты (E11, NFT-2.4)
