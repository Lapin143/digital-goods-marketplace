# Профиль fast-time: сокращённые сроки для сквозных проверок во времени (test-strategy.md, раздел 11, time-budgets.md, раздел 5, Р-147).
# Включается только в тестовых наборах (DGM_SPRING_PROFILES=testdata,fast-time) и на сервер не попадает (check_compose.py).
# Профиль меняет только настройки: в коде нет чисел и сроков, они идут из этих ключей и из Clock (правило 14 руководства среза 2).
# Интервалы фоновых исполнителей (диспетчер, опрос статусов, контроль) добавляет шаг, который их вводит.
delivery:
  retry-schedule: 1s,3s,12s,30s,60s    # паузы повторов выдачи 1, 3, 12, 30, 60 секунд вместо 10 секунд, 30 секунд, 2, 5, 10 минут
  control-minutes: 3                   # контроль доставки 3 минуты вместо 30 (больше суммы пауз повторов, 106 секунд)
