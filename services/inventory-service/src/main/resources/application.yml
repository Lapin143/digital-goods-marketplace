# Сервис «inventory». Общие значения (порты 8443 и 8444 с mTLS, журнал JSON, метрики) задаёт каркас: dgm-kit-defaults.properties.
# Адреса и секреты приходят от Compose: переменные DGM_* и каталог /run/secrets.
spring:
  application:
    name: inventory-service

dgm:
  security:
    jwt:
      issuer: ${DGM_JWT_ISSUER:https://localhost:8443/auth/realms/dgm}
      jwks-uri: ${DGM_JWKS_URI:https://keycloak:8443/auth/realms/dgm/protocol/openid-connect/certs}
  db:
    host: ${DGM_PG_HOST:postgres}
    port: ${DGM_PG_PORT:5432}
    database: inventory_db
    migrator-role: migrator_inventory
    modules:
      # Предел соединений роли app_inventory 8: пул 7 и одно соединение публикатора Outbox
      inventory:
        role: app_inventory
        pool-size: 7
  kafka:
    bootstrap: ${DGM_KAFKA_BOOTSTRAP:kafka:9093}
  # Redis (ADR-012, ADR-022): очередь сроков резервов reservation:expiry. Пользователь ACL inventory видит только ключи reservation:*,
  # пароль лежит в секрете redis_inventory. Redis не источник истины: недоступный Redis не останавливает сервис и не мешает резервировать,
  # просроченные резервы тогда снимает сверка по базе
  redis:
    host: ${DGM_REDIS_HOST:redis}
    port: ${DGM_REDIS_PORT:6379}
    user: inventory
  outbox:
    module: inventory
  consumer:
    module: inventory
  reservation:
    # Исполнители резервов (ADR-012): таймер раз в секунду берёт наступившие сроки из Redis, сверка раз в минуту ищет по базе резервы,
    # просроченные больше чем на 30 секунд (таймер потерян)
    timer-interval: PT1S
    reconcile-interval: PT1M
    reconcile-grace-seconds: 30

# Срок резерва совпадает с параметром платформы reservation.ttl-seconds (Р-10); до слушателя config.changed (срез 3) значение здесь
reservation:
  ttl-seconds: 900
