# Сервис платформы: идентификация, поддержка, уведомления, аудит. Общие значения (порты 8443 и 8444 с mTLS, журнал JSON, метрики)
# задаёт каркас: dgm-kit-defaults.properties. Адреса и секреты приходят от Compose: переменные DGM_* и каталог /run/secrets.
spring:
  application:
    name: platform-service
  task:
    scheduling:
      # Два потока расписания: сверка с Keycloak (вызовы по сети) не задерживает отправку писем и наоборот
      pool:
        size: 2

dgm:
  config:
    # Параметры платформы лежат в её собственной базе (модуль audit_admin), права на чтение platform.config у сервиса нет:
    # слушатель параметров ему не нужен (Р-168, пункт 7.3 руководства среза 3)
    enabled: false
  security:
    jwt:
      issuer: ${DGM_JWT_ISSUER:https://localhost:8443/auth/realms/dgm}
      jwks-uri: ${DGM_JWKS_URI:https://keycloak:8443/auth/realms/dgm/protocol/openid-connect/certs}
  db:
    host: ${DGM_PG_HOST:postgres}
    port: ${DGM_PG_PORT:5432}
    database: platform_db
    migrator-role: migrator_platform
    modules:
      # У каждого модуля своя роль и свой предел соединений (infra/postgres/roles.json); публикатор Outbox берёт
      # одно соединение роли identity, поэтому её пул на единицу меньше предела
      identity:
        role: app_identity
        pool-size: 1
      support:
        role: app_support
        pool-size: 2
      notification:
        role: app_notification
        pool-size: 2
      audit-admin:
        role: app_audit_admin
        pool-size: 1
      audit-writer:
        role: app_audit_writer
        pool-size: 1
  kafka:
    bootstrap: ${DGM_KAFKA_BOOTSTRAP:kafka:9093}
  # Redis (ADR-022): одноразовые коды, счётчики запросов и замки номеров (ADR-010). Пользователь ACL platform видит только ключи platform:*,
  # пароль лежит в секрете redis_platform. Без Redis выпуск и проверка кодов отвечают 503 и SMS не уходит
  redis:
    host: ${DGM_REDIS_HOST:redis}
    port: ${DGM_REDIS_PORT:6379}
    user: platform
  # Соседи по mTLS (Р-140). order-service: обновление адреса доставки при повторной отправке ключа (OP-72, Р-170). Вызов с ключом идемпотентности,
  # поэтому после сбоя клиент повторяет его сам; полный срок 2 секунды из контракта операции, дальше оператору 503 и повтор с тем же ключом
  peers:
    order-service:
      base-url: ${DGM_ORDER_URL:https://order-service:8443}
      attempt-timeout: 1s
      retry: 200ms
      total-deadline: 2s
  # SMS-провайдер: на стенде заглушка external-stubs (ключ API в секрете platform_sms_key), в проде адрес настоящего провайдера
  sms:
    base-url: ${DGM_SMS_BASE_URL:https://external-stubs:8443}
  # Провайдер почты: на стенде заглушка external-stubs (ключ API в секрете platform_email_key), в проде адрес настоящего провайдера
  email:
    base-url: ${DGM_EMAIL_BASE_URL:https://external-stubs:8443}
  # Правила одноразовых кодов (NFT-3.7), не меняются администратором; лимиты запросов и потолок SMS это параметры платформы (audit_admin)
  otp:
    ttl: PT5M
    attempts: 5
    min-response: PT0.8S
  outbox:
    module: identity
  consumer:
    module: identity
  # Admin REST Keycloak (ADR-025): создание учётных записей, роли, деактивация, сверка. Секрет клиента platform-service читается из /run/secrets
  # (keycloak_client_platform) при каждом получении токена, Keycloak при старте сервису не нужен
  keycloak:
    base-url: ${DGM_KEYCLOAK_BASE_URL:https://keycloak:8443/auth}
  identity:
    # Сверка с Keycloak (identity-reconciler): раз в минуту, первый проход через 20 секунд после старта; запускает её тот экземпляр,
    # который держит блокировку публикатора Outbox. Ключи названы как параметры платформы, значения по умолчанию те же (правило 6 среза 1)
    reconcile-interval: PT1M
    reconcile-initial-delay: PT20S
  notification:
    # Просмотр очереди писем: лестница повторов начинается с секунды (ADR-011), поэтому просматривать нужно чаще. Письма, срок которых
    # настал, берутся по одному с блокировкой строки (FOR UPDATE SKIP LOCKED) и арендой на lease: упавший экземпляр не теряет письмо
    poll-interval: PT0.5S
    lease: PT30S
    batch: 10
    # Паузы после первой, второй и третьей неудачи; после четвёртой письмо считается недоставленным и даёт notification.failed
    retry-delays: PT1S,PT5S,PT25S
    # Время в письмах (вход по SMS, срок повторной заявки) выводится в этом поясе
    zone: Europe/Moscow
    zone-label: МСК
    # Адрес сайта в ссылках писем («Заказ создан»); на стенде тот же, что у страницы оплаты заглушки (Compose: DGM_PUBLIC_ORIGIN)
    site-url: ${DGM_PUBLIC_ORIGIN:https://localhost:8443}
  audit:
    # Секции журнала аудита (AuditPartitionJob): первый проход через полминуты после старта, затем раз в сутки; секции создаются на
    # текущий месяц и три вперёд, два экземпляра сервиса не мешают друг другу (консультативная блокировка в самом запросе)
    partition-initial-delay: PT30S
    partition-interval: PT24H
