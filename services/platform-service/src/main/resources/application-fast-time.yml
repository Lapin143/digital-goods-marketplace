# Профиль fast-time: сокращённые сроки для сквозных проверок во времени (test-strategy.md, раздел 11, time-budgets.md, раздел 5, Р-147).
# Включается только в тестовых наборах (DGM_FAST_TIME=1: make fast-up и задание e2e) и на сервер не попадает (check_compose.py).
# Профиль меняет только настройки: в коде нет чисел и сроков, они идут из этих ключей и из Clock (правило 14 руководства среза 1).
# Единственное сжатие в platform-service: паузы повторов webhook продавцу (шаг 16 руководства Ф5, Р-193). Лестницу повторов пишет сам отправитель
# (WebhookProperties.retryDelays), отправка идёт раз в секунду.
dgm:
  notification:
    webhook:
      retry-delays: PT1S,PT2S,PT3S,PT4S,PT5S   # паузы после первой – пятой неудачи 1, 2, 3, 4, 5 секунд вместо 30 секунд, 2, 10, 30 минут, 2 часов; после шестой неудачи failed (15 секунд всего)
