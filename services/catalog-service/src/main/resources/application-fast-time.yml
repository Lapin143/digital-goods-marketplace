# Профиль fast-time: сокращённые сроки для сквозных проверок во времени (test-strategy.md, раздел 11, time-budgets.md, раздел 5).
# Включается только в тестовых наборах (DGM_SPRING_PROFILES=testdata,fast-time) и на сервер не попадает.
# Пауза после отказа в профиль не входит: параметр платформы не бывает короче 3600 секунд, её проверяют подменой Clock.
moderation:
  review-deadline-seconds: 10            # срок рассмотрения заявки 10 секунд вместо 3 суток

dgm:
  moderation:
    # Задание контроля сроков успевает увидеть просрочку за считанные секунды
    deadline-interval: PT2S
    deadline-initial-delay: PT2S
