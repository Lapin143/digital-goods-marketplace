# Профиль fast-time: сокращённые сроки для сквозных проверок во времени (test-strategy.md, раздел 11, time-budgets.md, раздел 5, Р-147).
# Включается только в тестовых наборах (DGM_SPRING_PROFILES=testdata,fast-time) и на сервер не попадает (check_compose.py).
# Профиль меняет только настройки: в коде нет чисел «900» и «720», сроки идут из этих ключей и из Clock (правило 14 руководства среза 2).
# order-service сверяет INV-07 (сессия короче резерва) при старте и при создании заказа, поэтому знает оба срока, как и их владельцы.
# Интервалы фоновых исполнителей добавляет шаг, который их вводит (шаг 11: сторож заказов).
reservation:
  ttl-seconds: 30          # резерв 30 секунд вместо 15 минут
payment-session:
  ttl-seconds: 24          # платёжная сессия 24 секунды вместо 12 минут (INV-07: короче резерва на 20 %)
dgm:
  order:
    watchdog:
      interval: PT3S           # проход сторожа раз в 3 секунды вместо минуты: потерянное событие видно за секунды
      initial-delay: PT5S
      created-timeout: PT20S   # дольше самого долгого оформления заказа (платёжная сессия до 8 секунд), иначе сторож отменит заказ в работе
      reserve-grace: PT15S     # запас после конца резерва 15 секунд вместо 5 минут: событие reservation.expired успевает прийти само
