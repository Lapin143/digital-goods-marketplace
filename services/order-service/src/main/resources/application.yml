# Сервис заказов. Общие значения (порты 8443 и 8444 с mTLS, журнал JSON, метрики) задаёт каркас: dgm-kit-defaults.properties.
# Адреса и секреты приходят от Compose: переменные DGM_* и каталог /run/secrets.
spring:
  application:
    name: order-service

dgm:
  security:
    jwt:
      issuer: ${DGM_JWT_ISSUER:https://localhost:8443/auth/realms/dgm}
      jwks-uri: ${DGM_JWKS_URI:https://keycloak:8443/auth/realms/dgm/protocol/openid-connect/certs}
  db:
    host: ${DGM_PG_HOST:postgres}
    port: ${DGM_PG_PORT:5432}
    database: order_db
    migrator-role: migrator_order
    modules:
      # Пределы соединений сервиса 8 (memory-budget, раздел 6): роль app_orders 6 (пул 5 и одно соединение публикатора Outbox) и роль чтения
      # истории app_orders_read 2 (ADR-017, Р-163; пул читателя появляется на шаге 11 среза 3)
      orders:
        role: app_orders
        pool-size: 5
  kafka:
    bootstrap: ${DGM_KAFKA_BOOTSTRAP:kafka:9093}
  outbox:
    module: orders
  consumer:
    module: orders
  # Сторож заказов (ADR-004, SM-01/T6 и T12): проход раз в минуту. «Создан» старше 60 секунд потерял продолжение (ответ соседа или падение процесса
  # между шагами саги), «ожидает оплаты» с резервом, истёкшим больше 5 минут назад, потерял событие reservation.expired. Пороги настраиваются,
  # в коде их нет (правило 14); проход берёт не больше batch заказов каждого вида.
  order:
    watchdog:
      interval: PT1M
      initial-delay: PT30S
      created-timeout: PT60S
      reserve-grace: PT5M
      batch: 100
  # Соседи саги покупки (SEQ-01, ADR-004), вызовы по mTLS. Сроки по бюджету запроса createOrder (цель 1 с при 95-м перцентиле, US-5.1):
  # каталог 0,5 с и один повтор, остатки 1 с и один повтор (ключ идемпотентности выведен из шага и заказа), платежи 8 секунд без повторов
  # (шлюз за ними отвечает до 7 секунд, повторы делает сам сервис платежей). Предохранитель по умолчанию каркаса.
  peers:
    catalog-service:
      base-url: ${DGM_CATALOG_URL:https://catalog-service:8443}
      attempt-timeout: 500ms
      retry: 200ms
    inventory-service:
      base-url: ${DGM_INVENTORY_URL:https://inventory-service:8443}
      attempt-timeout: 1s
      retry: 300ms
    payment-service:
      base-url: ${DGM_PAYMENT_URL:https://payment-service:8443}
      attempt-timeout: 8s
      total-deadline: 8s
      retry: ""

# Параметры платформы (Р-139): ключи совпадают с platform_parameter, до слушателя config.changed (срез 3) значения читаются отсюда.
# INV-07: платёжная сессия короче резерва, это проверяется при старте.
orders:
  max-unpaid: 3              # неоплаченных заказов («создан» и «ожидает оплаты») у одного покупателя, FT-5.1
reservation:
  ttl-seconds: 900           # резерв ключей 15 минут
payment-session:
  ttl-seconds: 720           # платёжная сессия 12 минут
commission:
  default-rate-bp: 200       # комиссия платформы 2 %
