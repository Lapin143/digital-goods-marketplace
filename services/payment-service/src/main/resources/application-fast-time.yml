# Профиль fast-time: сокращённые сроки для сквозных проверок во времени (test-strategy.md, раздел 11, time-budgets.md, раздел 5, Р-147).
# Включается только в тестовых наборах (DGM_SPRING_PROFILES=testdata,fast-time) и на сервер не попадает (check_compose.py).
# Профиль меняет только настройки: в коде нет чисел «900» и «720», сроки идут из этих ключей и из Clock (правило 14 руководства среза 2).
# Ключи параметров платформы (payment-session.ttl-seconds, reservation.ttl-seconds) совпадают с ключами platform_parameter.
# Интервалы фоновых исполнителей добавляет шаг, который их вводит (шаг 8: сверка со шлюзом; шаг 9: исполнитель возвратов и сверка возвратов).
reservation:
  ttl-seconds: 30          # нужен для проверки INV-07 при старте: сессия короче резерва
payment-session:
  ttl-seconds: 24          # платёжная сессия 24 секунды вместо 12 минут
  margin-seconds: 5        # запас до конца резерва (INV-07): 6 секунд при сокращённых сроках вместо минуты
payment:
  refund-schedule: 0s,3s,12s,30s,60s   # паузы автовозврата 0, 3, 12, 30, 60 секунд вместо 0, 30 секунд, 2, 5, 10 минут (горизонт меньше контроля выдачи)
dgm:
  config:
    # Закреплённые ключи: слушатель platform.config их не применяет (Р-175). Платформа переиздаёт значения по умолчанию (резерв 900 секунд)
    # при каждом запуске, и без закрепления они заменили бы сокращённые сроки профиля. Остальные ключи слушатель применяет как обычно
    pinned-keys:
      - reservation.ttl-seconds
      - payment-session.ttl-seconds
  payment:
    reconcile:
      young-interval: PT15S    # сверка молодых платежей раз в 15 секунд вместо 5 минут: потерянный вебхук виден за секунды
      old-interval: PT1M       # платежи старше двух часов в сквозных проверках не появляются, интервал только для полноты
      unmatched-interval: PT2S # несопоставленные уведомления раз в 2 секунды вместо 10
      initial-delay: PT5S
      unmatched-initial-delay: PT3S
    refund:
      interval: PT1S           # исполнитель возвратов раз в секунду вместо 5: паузы автовозврата 0, 3, 12, 30, 60 секунд видны в сквозной проверке
      initial-delay: PT3S
      processing-age: PT10S    # принятый шлюзом возврат сверяется через 10 секунд вместо 5 минут
      reconcile-interval: PT10S
      reconcile-initial-delay: PT8S
