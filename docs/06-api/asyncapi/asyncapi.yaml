asyncapi: 3.0.0
info:
  title: 'Digital Goods Marketplace: события Kafka'
  version: 1.0.0
  description: |-
    Контракт событий платформы: темы, сообщения, схемы, издатели, потребители и правила обработки. Контракт пишется до кода (contract-first), живёт в репозитории и проверяется скриптом `check_asyncapi.py`.

    Общие правила (конверт, ключи, версии, повторы, DLQ) записаны в `docs/05-architecture/conventions.md`, разделы 11 и 12. События R1 стабильны, события R2 помечены `x-status: draft` и уточняются перед релизом.

    Схемы данных закрыты (`additionalProperties: false`): издатель не добавляет поле, не внеся его сюда. Потребитель при чтении схему строго не применяет и игнорирует неизвестные поля.
  tags:
  - name: R1
    description: События релиза R1
  - name: R2
    description: События релиза R2, черновик
defaultContentType: application/json
servers:
  kafka:
    host: kafka:9093
    protocol: kafka-secure
    description: Один брокер в режиме KRaft, сеть `data`, TLS и права доступа по темам (ADR-003, ADR-022). Темы
      создаёт задание `kafka-init`
