            $ref: '#/components/schemas/ProductCreatedData'
    ProductUpdatedData:
      type: object
      additionalProperties: false
      required:
      - productId
      - sellerId
      - issuanceMethod
      - status
      - version
      - changedFields
      properties:
        productId:
