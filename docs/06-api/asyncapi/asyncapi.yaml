operations:
  publishSellerApproved:
    action: send
    channel:
      $ref: '#/channels/catalogEvents'
    messages:
    - $ref: '#/channels/catalogEvents/messages/sellerApproved'
    summary: 'Опубликовать: профиль продавца одобрен'
    tags:
    - name: R1
    x-publisher:
      service: catalog-service
      components:
      - seller-profile-service
      outbox: true
  receiveSellerApprovedByPlatformServiceSellerRoleHandler:
    action: receive
    channel:
      $ref: '#/channels/catalogEvents'
    messages:
    - $ref: '#/channels/catalogEvents/messages/sellerApproved'
    summary: Назначить пользователю роль `seller` в Keycloak, включить требование 2FA, записать `user.role-assigned`
    tags:
    - name: R1
    x-consumer:
      service: platform-service
      handler: seller-role-handler
      effect: Назначить пользователю роль `seller` в Keycloak, включить требование 2FA, записать `user.role-assigned`
      release: R1
      idempotency:
        level2: processed_event
        key: (consumer = 'seller-role-handler', event_id)
        businessGuard: Назначение той же роли повторно безопасно (операция Keycloak идемпотентна), флаг `keycloak_synced`
          в учётной записи показывает, дошло ли изменение
      errorHandling:
        retries: блокирующие, паузы 1, 5, 25 секунд
        deadLetterTopic: catalog.events.dlq
        onPermanentFailure: В DLQ сразу, без повторов
      consumerGroup: platform-service
      offsetCommit: после фиксации транзакции базы
  receiveSellerApprovedByPlatformServiceNotificationHandler:
    action: receive
    channel:
      $ref: '#/channels/catalogEvents'
    messages:
    - $ref: '#/channels/catalogEvents/messages/sellerApproved'
    summary: Письмо «Заявка одобрена» продавцу (FT-2.2)
    tags:
    - name: R1
    x-consumer:
      service: platform-service
      handler: notification-handler
      effect: Письмо «Заявка одобрена» продавцу (FT-2.2)
      release: R1
      idempotency:
        level2: processed_event
        key: (consumer = 'notification-handler', event_id)
        businessGuard: 'Уникальный индекс `(event_id, template)` в таблице уведомлений: письмо по одному событию
          уходит один раз'
      errorHandling:
        retries: блокирующие, паузы 1, 5, 25 секунд
        deadLetterTopic: catalog.events.dlq
        onPermanentFailure: В DLQ сразу, без повторов
      consumerGroup: platform-service
      offsetCommit: после фиксации транзакции базы
  publishSellerRejected:
    action: send
    channel:
      $ref: '#/channels/catalogEvents'
