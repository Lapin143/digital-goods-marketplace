  schemas:
    EventEnvelope:
      type: object
      description: 'Конверт события (conventions.md, раздел 11.2): атрибуты CloudEvents 1.0 в структурном режиме
        JSON. Атрибуты собирает публикатор Outbox, `data` пишет прикладной код.'
      required:
      - specversion
      - id
      - source
      - type
      - time
      - subject
      - datacontenttype
      - schemaversion
      - aggregatetype
      - traceparent
      - correlationid
      - data
      properties:
        specversion:
          type: string
          const: '1.0'
          description: Версия спецификации CloudEvents
        id:
          type: string
          format: uuid
          description: Идентификатор события (UUID 7), назначается при записи в Outbox. Ключ дедупликации потребителя
        source:
          type: string
          enum:
          - catalog-service
          - inventory-service
          - order-service
          - payment-service
          - delivery-service
          - platform-service
          - finance-service
          description: Сервис-издатель
        type:
          type: string
          pattern: ^[a-z]+(-[a-z]+)*\.[a-z]+(-[a-z]+)*$
          description: Тип события в прошедшем времени, например `order.paid`
        time:
          $ref: '#/components/schemas/Timestamp'
        subject:
          type: string
          minLength: 1
          maxLength: 128
          description: 'Ключ упорядочения: идентификатор агрегата, для цепочки покупки идентификатор заказа. Равен
            ключу записи Kafka'
        datacontenttype:
          type: string
          const: application/json
          description: Формат поля `data`
        schemaversion:
          type: integer
          minimum: 1
          description: Старшая версия схемы `data` (conventions.md, раздел 11.4)
        aggregatetype:
          type: string
          pattern: ^[A-Z][A-Za-z]+$
          description: 'Тип агрегата: `Order`, `Payment`'
        traceparent:
          type: string
          pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
          description: W3C Trace Context запроса, в котором возникло событие
        correlationid:
          type: string
          format: uuid
          description: Сквозной идентификатор (X-Correlation-Id, NFT-6.0)
        data:
          type: object
          description: Полезная нагрузка, схема зависит от типа события
    Timestamp:
      type: string
      format: date-time
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
      description: Момент времени, RFC 3339 в UTC с миллисекундами и суффиксом `Z` (conventions.md, раздел 5)
    Money:
      type: object
      additionalProperties: false
      required:
      - amount
      - currency
      description: 'Сумма: целое число копеек и код валюты (conventions.md, раздел 4)'
      properties:
        amount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Сумма в копейках
        currency:
          type: string
          enum:
          - RUB
          description: Код валюты ISO 4217, в R1 только `RUB`
    DeliveryAddress:
      type: object
      additionalProperties: false
      required:
      - channel
      - address
      description: Снимок адреса доставки. Персональные данные, передаются только в `order.paid` и `order.address-updated`
      properties:
        channel:
          type: string
          enum:
          - email
          description: Канал выдачи, в R1 только e-mail
        address:
          type: string
          format: email
          maxLength: 254
          description: Адрес получателя, нормализованный (нижний регистр, без пробелов)
    AuditChange:
      type: object
      additionalProperties: false
      required:
      - field
      - personal
      - before
      - after
      description: Изменение одного поля. Для персональных полей `before` и `after` это HMAC-хеш (ADR-014)
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 64
          description: Имя поля
        personal:
          type: boolean
          description: '`true`, если поле персональное и значения переданы хешем'
        before:
          type:
          - string
          - number
          - boolean
          - 'null'
          description: Значение до изменения, `null` при создании
        after:
          type:
          - string
          - number
          - boolean
          - 'null'
          description: Значение после изменения
    DeadLetterHeaders:
      type: object
      description: Заголовки записи в теме `.dlq` (conventions.md, раздел 12.3)
      required:
      - dlq-original-topic
      - dlq-original-partition
      - dlq-original-offset
      - dlq-consumer
      - dlq-error-class
      - dlq-attempts
      - dlq-failed-at
      properties:
        dlq-original-topic:
          type: string
          description: Исходная тема
        dlq-original-partition:
          type: string
          description: Партиция исходной записи, число в строке
        dlq-original-offset:
          type: string
          description: Смещение исходной записи, число в строке
        dlq-consumer:
          type: string
          description: Имя потребителя, отказавшегося от сообщения
        dlq-error-class:
          type: string
          description: Класс ошибки
        dlq-error-message:
          type: string
          description: Текст ошибки без персональных данных
        dlq-attempts:
          type: string
          description: Число попыток, число в строке
        dlq-failed-at:
          type: string
          description: Момент отказа, RFC 3339
    SellerApprovedData:
      type: object
      additionalProperties: false
      required:
      - sellerId
      - userId
      - sellerType
      - moderatorId
      properties:
        sellerId:
          type: string
          format: uuid
          description: Идентификатор продавца (профиля продавца)
        userId:
          type: string
          format: uuid
          description: Владелец профиля. Ему назначается роль «Продавец»
        sellerType:
          type: string
          enum:
          - sole_proprietor
          - self_employed
          - legal_entity
          description: Тип профиля продавца
        moderatorId:
          type: string
          format: uuid
          description: Идентификатор модератора, принявшего решение
    SellerApprovedEnvelope:
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: seller.approved
          source:
            const: catalog-service
          aggregatetype:
            const: SellerProfile
          schemaversion:
            const: 1
          data:
            $ref: '#/components/schemas/SellerApprovedData'
    SellerRejectedData:
      type: object
      additionalProperties: false
      required:
      - sellerId
      - userId
      - moderatorId
      - reason
      - nextApplicationAt
      properties:
        sellerId:
          type: string
          format: uuid
          description: Идентификатор продавца (профиля продавца)
        userId:
          type: string
          format: uuid
          description: Владелец профиля, получатель письма
        moderatorId:
          type: string
          format: uuid
          description: Идентификатор модератора, принявшего решение
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Причина отказа, текст модератора. Показывается продавцу в письме, в журналы приложения не
            пишется
        nextApplicationAt:
          $ref: '#/components/schemas/Timestamp'
          description: 'Момент, с которого возможна повторная заявка: время отказа плюс пауза 24 часа'
    SellerRejectedEnvelope:
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: seller.rejected
          source:
            const: catalog-service
          aggregatetype:
            const: SellerProfile
          schemaversion:
            const: 1
          data:
            $ref: '#/components/schemas/SellerRejectedData'
    SellerReturnedData:
      type: object
      additionalProperties: false
      required:
      - sellerId
      - userId
      - moderatorId
      - comment
      properties:
        sellerId:
          type: string
          format: uuid
          description: Идентификатор продавца (профиля продавца)
        userId:
          type: string
          format: uuid
          description: Владелец профиля, получатель письма
        moderatorId:
          type: string
          format: uuid
          description: Идентификатор модератора, принявшего решение
        comment:
          type: string
          minLength: 1
          maxLength: 1000
          description: 'Комментарий модератора: что исправить'
    SellerReturnedEnvelope:
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: seller.returned
          source:
            const: catalog-service
          aggregatetype:
            const: SellerProfile
          schemaversion:
            const: 1
          data:
            $ref: '#/components/schemas/SellerReturnedData'
    ProductCreatedData:
      type: object
      additionalProperties: false
      required:
      - productId
      - sellerId
      - productType
      - issuanceMethod
      - status
      - version
      properties:
        productId:
          type: string
          format: uuid
          description: Идентификатор товара
        sellerId:
          type: string
          format: uuid
          description: Идентификатор продавца (профиля продавца)
        productType:
          type: string
          enum:
          - game_key
          - software_license
          - gift_card
          - subscription
          description: Тип товара
        issuanceMethod:
          type: string
          enum:
          - key_pool
          - seller_api
          description: 'Способ выдачи: пул ключей или API продавца (R2)'
        status:
          type: string
          enum:
          - draft
          - on_moderation
          - published
          - rejected
          - blocked
          - archived
          description: Статус товара после изменения, при создании `draft`
        version:
          type: integer
          minimum: 1
          description: Номер версии товара, растёт при каждом изменении. Потребитель применяет только более новую
            версию
    ProductCreatedEnvelope:
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: product.created
          source:
            const: catalog-service
          aggregatetype:
            const: Product
