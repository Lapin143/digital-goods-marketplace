          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /api/v1/staff/products/{productId}/block:
    post:
      operationId: blockProduct
      summary: Заблокировать опубликованный товар
      description: |-
        Переводит товар из `published` в `blocked` (T8), товар исчезает с витрины. Причина обязательна. Блокировку по решению модератора кнопкой не снимают: путь назад идёт через правку и новую модерацию (T11). Заказы, оформленные раньше, доводятся до выдачи.

        Матрица прав: OP-24. Истории: US-3.5.
      tags:
      - Модерация товаров
      x-matrix-id: OP-24
      x-stories:
      - US-3.5
      x-allowed-roles:
      - moderator
      x-conditions:
      - U4
      x-sms-session: denied
      security:
      - bearerJwt:
        - staff.moderation
      parameters:
      - name: productId
        in: path
        required: true
        description: Идентификатор товара
        schema:
          $ref: components.yaml#/components/schemas/Id
        example: 0199e0a0-0000-7000-8000-000000000201
      - $ref: components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
            example:
              reason: Жалоба правообладателя
      responses:
        '200':
          description: Товар заблокирован
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
            Idempotency-Replayed:
              $ref: components.yaml#/components/headers/IdempotencyReplayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProduct'
              example:
                productId: 0199e0a0-0000-7000-8000-000000000201
                sellerId: 0199e0a0-0000-7000-8000-000000000101
                title: 'Лунная тропа: ключ Steam'
                description: Приключенческая игра, ключ активации Steam
                productType: game_key
                platform: Steam
                activationRegions:
                - RU
                - KZ
                price:
                  amount: 149900
                  currency: RUB
                issuanceMethod: key_pool
                status: blocked
                rejectionReason: null
                blockReason: Жалоба правообладателя
                submittedAt: null
                reviewDeadlineAt: null
                version: 4
                createdAt: '2026-10-03T11:00:00.456Z'
                updatedAt: '2026-10-03T12:00:00.123Z'
        '400':
          $ref: components.yaml#/components/responses/E400BadRequestIdempotencyKeyRequired
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403ForbiddenSecondFactorRequired
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '409':
          $ref: components.yaml#/components/responses/E409StateConflictRequestInProgress
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailedIdempotencyKeyReuse
        '429':
          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /api/v1/products:
    get:
      operationId: listStorefrontProducts
      summary: 'Каталог: список, поиск и фильтры'
      description: |-
        Опубликованные товары. Поиск `q` ищет часть названия без учёта регистра (полнотекстовый индекс PostgreSQL), фильтры комбинируются по «и». Диапазон цены `priceFrom` и `priceTo` в копейках включает обе границы, нижняя больше верхней даёт 422 (US-3.11, сценарий 4). Порядок: новые публикации выше. Ответ кэшируется на 30 секунд, поддерживается условный запрос по `If-None-Match`. Цель 500 мс при 95-м перцентиле (NFT-1.1).

        Матрица прав: OP-28. Истории: US-3.9, US-3.10, US-3.11.
      tags:
      - Витрина
      x-matrix-id: OP-28
      x-stories:
      - US-3.9
      - US-3.10
      - US-3.11
      x-allowed-roles:
      - guest
      - buyer
      - seller
      - moderator
      - support-operator
      - admin
      x-conditions: []
      x-sms-session: allowed
      security: []
      parameters:
      - name: q
        in: query
        required: false
        description: Часть названия
        schema:
          type: string
          minLength: 1
          maxLength: 100
        example: тропа
      - name: productType
        in: query
        required: false
        description: Тип товара, несколько значений через запятую
        schema:
          type: string
          pattern: ^[a-z_]+(,[a-z_]+)*$
        example: game_key
      - name: platform
        in: query
        required: false
        description: Платформа
        schema:
          type: string
          maxLength: 64
        example: Steam
      - name: region
        in: query
        required: false
        description: 'Регион активации (код страны): товары с этим регионом и без ограничений'
        schema:
          $ref: components.yaml#/components/schemas/Country
        example: RU
      - name: priceFrom
        in: query
        required: false
        description: Нижняя граница цены в копейках, включительно
        schema:
          type: integer
          minimum: 0
      - name: priceTo
        in: query
        required: false
        description: Верхняя граница цены в копейках, включительно
        schema:
          type: integer
          minimum: 0
      - $ref: components.yaml#/components/parameters/Limit
      - $ref: components.yaml#/components/parameters/Cursor
      responses:
        '200':
          description: Страница каталога
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlPublic
            ETag:
              $ref: components.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontPage'
              example:
                items:
                - productId: 0199e0a0-0000-7000-8000-000000000201
                  title: 'Лунная тропа: ключ Steam'
                  productType: game_key
                  platform: Steam
                  price:
                    amount: 149900
                    currency: RUB
                  inStock: true
                page:
                  limit: 20
                  nextCursor: null
        '304':
          description: Ресурс не изменился с момента ETag из If-None-Match
          headers:
            ETag:
              $ref: components.yaml#/components/headers/ETag
        '400':
          $ref: components.yaml#/components/responses/E400BadRequest
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailed
        '429':
          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /api/v1/products/{productId}:
    get:
      operationId: getStorefrontProduct
      summary: Карточка товара
      description: |-
        Карточка опубликованного товара: название, описание, тип, платформа, регион, цена и наличие. Товар в другом статусе даёт 404 «Товар не найден». При нулевом остатке карточка показывается, `maxOrderQuantity` равен нулю и покупка недоступна. Цель 300 мс при 95-м перцентиле (US-3.9).

        Матрица прав: OP-28. Истории: US-3.9.
      tags:
      - Витрина
      x-matrix-id: OP-28
      x-stories:
      - US-3.9
      x-allowed-roles:
      - guest
      - buyer
      - seller
      - moderator
      - support-operator
      - admin
      x-conditions: []
      x-sms-session: allowed
      security: []
      parameters:
      - name: productId
        in: path
        required: true
        description: Идентификатор товара
        schema:
          $ref: components.yaml#/components/schemas/Id
        example: 0199e0a0-0000-7000-8000-000000000201
      responses:
        '200':
          description: Карточка
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlPublic
            ETag:
              $ref: components.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontProduct'
              example:
                productId: 0199e0a0-0000-7000-8000-000000000201
                sellerId: 0199e0a0-0000-7000-8000-000000000101
                title: 'Лунная тропа: ключ Steam'
                description: Приключенческая игра, ключ активации Steam
                productType: game_key
                platform: Steam
                activationRegions:
                - RU
                - KZ
                price:
                  amount: 149900
                  currency: RUB
                inStock: true
                maxOrderQuantity: 10
        '304':
          description: Ресурс не изменился с момента ETag из If-None-Match
          headers:
            ETag:
              $ref: components.yaml#/components/headers/ETag
        '400':
          $ref: components.yaml#/components/responses/E400BadRequest
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '429':
          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /internal/v1/products/{productId}:
    get:
      operationId: getProductCard
      summary: Карточка товара для заказа (внутренний)
      description: |-
        Возвращает статус, цену, продавца и способ выдачи. Вызывает только `order-service` при оформлении заказа, ответ за 500 мс (SEQ-01, шаги 4 и 5). Товар не найден даёт 404, решение о доступности (опубликован, не заблокирован) принимает вызывающий по полю `status`.

        Матрица прав: OP-50. Истории: US-5.1.
      tags:
      - Внутренние вызовы
      x-matrix-id: OP-50
      x-stories:
      - US-5.1
      x-allowed-roles:
      - system
      x-conditions: []
      x-allowed-callers:
      - order-service
      x-internal: true
      security:
      - mutualTls: []
      servers:
      - url: https://catalog-service:8443
        description: Внутренний адрес сервиса, mTLS, не через шлюз
      parameters:
      - name: productId
        in: path
        required: true
        description: Идентификатор товара
        schema:
          $ref: components.yaml#/components/schemas/Id
        example: 0199e0a0-0000-7000-8000-000000000201
      responses:
        '200':
          description: Карточка товара
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCard'
              example:
                productId: 0199e0a0-0000-7000-8000-000000000201
                sellerId: 0199e0a0-0000-7000-8000-000000000101
                title: 'Лунная тропа: ключ Steam'
                status: published
                price:
                  amount: 149900
                  currency: RUB
                issuanceMethod: key_pool
                productType: game_key
        '400':
          $ref: components.yaml#/components/responses/E400BadRequest
        '403':
          $ref: components.yaml#/components/responses/E403Forbidden
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
components:
  schemas:
    PayoutDetails:
      type: object
      description: Банковские реквизиты для выплат. Копируются снимком в заявку на вывод (R2). Персональные данные
        продавца, в журналы не пишутся
      properties:
        recipientName:
          type: string
          description: Получатель платежа
          minLength: 1
          maxLength: 200
        bankName:
          type: string
          description: Наименование банка
          minLength: 1
          maxLength: 200
        bik:
          type: string
          description: БИК банка, 9 цифр
          pattern: ^[0-9]{9}$
        accountNumber:
          type: string
          description: Расчётный счёт, 20 цифр
          pattern: ^[0-9]{20}$
    SellerApplicationForm:
      type: object
      description: 'Анкета продавца. При сохранении черновика поля необязательны, при отправке заявки обязательны
        все четыре и хотя бы один документ. `PUT` заменяет анкету целиком: пропущенное поле очищается'
      properties:
        sellerType:
          $ref: components.yaml#/components/schemas/SellerType
        name:
          type: string
          description: Наименование продавца
          minLength: 1
          maxLength: 200
        payoutDetails:
          $ref: '#/components/schemas/PayoutDetails'
        assortmentDescription:
          type: string
          description: Что продавец собирается продавать
          minLength: 1
          maxLength: 2000
      additionalProperties: false
    SellerDocument:
      type: object
      description: Документ заявки. Сам файл лежит в закрытом бакете объектного хранилища в РФ, открывается по короткоживущей
        ссылке
      properties:
        documentId:
          $ref: components.yaml#/components/schemas/Id
        fileName:
          type: string
          description: Имя файла при загрузке
          maxLength: 255
        contentType:
          type: string
          description: Тип файла
          enum:
          - application/pdf
          - image/jpeg
          - image/png
        sizeBytes:
          type: integer
          description: Размер в байтах
          minimum: 1
        uploadedAt:
          $ref: components.yaml#/components/schemas/Timestamp
      required:
      - documentId
      - fileName
      - contentType
      - sizeBytes
      - uploadedAt
    DocumentLink:
      type: object
      description: Короткоживущая ссылка (5 минут). Ссылку получает только заявитель и модератор
      properties:
        url:
          type: string
          description: Подписанная ссылка на документ в хранилище, подпись считается без вызова хранилища
          format: uri
        expiresAt:
          $ref: components.yaml#/components/schemas/Timestamp
      required:
      - url
      - expiresAt
    SellerApplication:
      type: object
      description: 'Заявка на статус продавца: профиль продавца с анкетой и итогом проверки (SM-05). Идентификатор
        заявки равен идентификатору профиля `sellerId`. `nextApplicationAt` показывает, когда после отказа можно
        подать новую заявку, `reviewDeadlineAt` это срок рассмотрения 3 суток'
      properties:
        sellerId:
          $ref: components.yaml#/components/schemas/Id
        status:
          $ref: components.yaml#/components/schemas/SellerProfileStatus
        sellerType:
          $ref: components.yaml#/components/schemas/SellerType
        name:
          type: string
          description: Наименование продавца
        payoutDetails:
          $ref: '#/components/schemas/PayoutDetails'
        assortmentDescription:
          type: string
          description: Описание ассортимента
        documents:
          type: array
          description: Документы заявки, не больше 10
          items:
            $ref: '#/components/schemas/SellerDocument'
          maxItems: 10
        decisionReason:
          oneOf:
          - type: string
            description: Причина отказа или комментарий доработки, видна заявителю
          - type: 'null'
        rejectedAt:
          oneOf:
          - $ref: components.yaml#/components/schemas/Timestamp
          - type: 'null'
        nextApplicationAt:
          oneOf:
          - $ref: components.yaml#/components/schemas/Timestamp
          - type: 'null'
        submittedAt:
          oneOf:
          - $ref: components.yaml#/components/schemas/Timestamp
          - type: 'null'
        reviewDeadlineAt:
          oneOf:
          - $ref: components.yaml#/components/schemas/Timestamp
          - type: 'null'
        createdAt:
          $ref: components.yaml#/components/schemas/Timestamp
        updatedAt:
          $ref: components.yaml#/components/schemas/Timestamp
      required:
      - sellerId
      - status
      - documents
      - decisionReason
      - rejectedAt
      - nextApplicationAt
      - submittedAt
      - reviewDeadlineAt
      - createdAt
      - updatedAt
    ReviewDocument:
      allOf:
      - $ref: '#/components/schemas/SellerDocument'
      - type: object
        properties:
          link:
            $ref: '#/components/schemas/DocumentLink'
        required:
        - link
      description: Документ заявки со ссылкой для модератора
    SellerApplicationCard:
      type: object
      description: 'Карточка заявки для модератора: анкета и ссылки на документы. Ссылки живут 5 минут'
      properties:
        sellerId:
          $ref: components.yaml#/components/schemas/Id
        userId:
          $ref: components.yaml#/components/schemas/Id
        status:
          $ref: components.yaml#/components/schemas/SellerProfileStatus
        sellerType:
          $ref: components.yaml#/components/schemas/SellerType
        name:
          type: string
          description: Наименование продавца
        payoutDetails:
          $ref: '#/components/schemas/PayoutDetails'
        assortmentDescription:
          type: string
          description: Описание ассортимента
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ReviewDocument'
        submittedAt:
          $ref: components.yaml#/components/schemas/Timestamp
        reviewDeadlineAt:
          $ref: components.yaml#/components/schemas/Timestamp
      required:
      - sellerId
      - userId
      - status
      - sellerType
      - name
      - payoutDetails
      - assortmentDescription
      - documents
      - submittedAt
      - reviewDeadlineAt
    SellerApplicationQueueItem:
      type: object
      description: Строка очереди заявок
      properties:
        sellerId:
          $ref: components.yaml#/components/schemas/Id
        name:
          type: string
          description: Наименование продавца
        sellerType:
          $ref: components.yaml#/components/schemas/SellerType
        documentsCount:
          type: integer
          description: Число документов
          minimum: 0
        submittedAt:
          $ref: components.yaml#/components/schemas/Timestamp
        reviewDeadlineAt:
          $ref: components.yaml#/components/schemas/Timestamp
        overdue:
          type: boolean
          description: '`true`, если срок рассмотрения 3 суток истёк'
      required:
      - sellerId
      - name
      - sellerType
      - documentsCount
      - submittedAt
      - reviewDeadlineAt
      - overdue
    SellerApplicationQueuePage:
      type: object
      description: Страница очереди заявок, старые выше
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SellerApplicationQueueItem'
        page:
          $ref: components.yaml#/components/schemas/PageInfo
      required:
      - items
      - page
    ReasonRequest:
      type: object
      description: Решение с причиной
      properties:
        reason:
          type: string
          description: Причина решения, обязательна. Видна продавцу и попадает в письмо
          minLength: 1
          maxLength: 1000
      required:
      - reason
      additionalProperties: false
    CommentRequest:
      type: object
      description: Возврат на доработку с комментарием
      properties:
        comment:
          type: string
          description: Комментарий для доработки, обязателен. Виден заявителю и попадает в письмо
          minLength: 1
          maxLength: 1000
      required:
      - comment
      additionalProperties: false
    ProductInput:
      type: object
      description: Поля товара при создании и правке. Все поля обязательны. Цена больше нуля. В R1 способ выдачи
        только `key_pool`
      properties:
        title:
          type: string
          description: Название
          minLength: 1
          maxLength: 200
        description:
          type: string
          description: Описание
          minLength: 1
          maxLength: 5000
        productType:
          $ref: components.yaml#/components/schemas/ProductType
        platform:
          type: string
          description: Платформа или сервис активации, например `Steam`
          minLength: 1
          maxLength: 64
        activationRegions:
          type: array
          description: Регионы активации. Пустой массив означает «без ограничений»
          items:
            $ref: components.yaml#/components/schemas/Country
          maxItems: 250
          uniqueItems: true
        price:
          $ref: components.yaml#/components/schemas/Money
        issuanceMethod:
          $ref: components.yaml#/components/schemas/IssuanceMethod
      required:
      - title
      - description
      - productType
      - platform
      - activationRegions
      - price
      - issuanceMethod
      additionalProperties: false
    SellerProduct:
      type: object
      description: 'Товар в кабинете продавца и в карточке модератора. Остаток товара не хранится в каталоге: его
        показывает сервис остатков'
      properties:
        productId:
          $ref: components.yaml#/components/schemas/Id
        sellerId:
          $ref: components.yaml#/components/schemas/Id
        title:
          type: string
          description: Название
        description:
          type: string
          description: Описание
        productType:
          $ref: components.yaml#/components/schemas/ProductType
        platform:
          type: string
          description: Платформа
        activationRegions:
          type: array
          items:
            $ref: components.yaml#/components/schemas/Country
        price:
          $ref: components.yaml#/components/schemas/Money
        issuanceMethod:
          $ref: components.yaml#/components/schemas/IssuanceMethod
        status:
          $ref: components.yaml#/components/schemas/ProductStatus
        rejectionReason:
          oneOf:
          - type: string
            description: Причина отклонения, заполняется решением модератора
          - type: 'null'
        blockReason:
          oneOf:
          - type: string
            description: Причина блокировки
          - type: 'null'
        submittedAt:
          oneOf:
          - $ref: components.yaml#/components/schemas/Timestamp
          - type: 'null'
        reviewDeadlineAt:
          oneOf:
          - $ref: components.yaml#/components/schemas/Timestamp
          - type: 'null'
        version:
          type: integer
          description: Номер версии, совпадает с ETag
          minimum: 1
        createdAt:
          $ref: components.yaml#/components/schemas/Timestamp
        updatedAt:
          $ref: components.yaml#/components/schemas/Timestamp
      required:
      - productId
      - sellerId
      - title
      - description
      - productType
      - platform
      - activationRegions
      - price
      - issuanceMethod
      - status
      - rejectionReason
      - blockReason
      - submittedAt
      - reviewDeadlineAt
      - version
      - createdAt
      - updatedAt
    SellerProductPage:
      type: object
      description: Страница товаров продавца, новые выше
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SellerProduct'
        page:
          $ref: components.yaml#/components/schemas/PageInfo
      required:
      - items
      - page
    ModerationQueueItem:
      type: object
      description: Строка очереди товаров на модерации
      properties:
        productId:
          $ref: components.yaml#/components/schemas/Id
        sellerId:
          $ref: components.yaml#/components/schemas/Id
        title:
          type: string
          description: Название
        productType:
          $ref: components.yaml#/components/schemas/ProductType
        price:
          $ref: components.yaml#/components/schemas/Money
        submittedAt:
          $ref: components.yaml#/components/schemas/Timestamp
        reviewDeadlineAt:
          $ref: components.yaml#/components/schemas/Timestamp
        overdue:
          type: boolean
          description: '`true`, если срок проверки 3 суток истёк'
      required:
      - productId
      - sellerId
      - title
      - productType
      - price
      - submittedAt
      - reviewDeadlineAt
      - overdue
    ModerationQueuePage:
      type: object
      description: Страница очереди товаров, старые выше
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModerationQueueItem'
        page:
          $ref: components.yaml#/components/schemas/PageInfo
      required:
      - items
      - page
    StorefrontItem:
      type: object
      description: Товар в выдаче каталога
      properties:
        productId:
          $ref: components.yaml#/components/schemas/Id
        title:
          type: string
          description: Название
        productType:
          $ref: components.yaml#/components/schemas/ProductType
        platform:
          type: string
          description: Платформа
        price:
          $ref: components.yaml#/components/schemas/Money
        inStock:
          type: boolean
          description: Есть ли свободные ключи, значение из копии витрины и может отставать на доли секунды
      required:
      - productId
      - title
      - productType
      - platform
      - price
      - inStock
    StorefrontPage:
      type: object
      description: Страница каталога
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StorefrontItem'
        page:
          $ref: components.yaml#/components/schemas/PageInfo
      required:
      - items
      - page
    StorefrontProduct:
      type: object
      description: Карточка опубликованного товара для витрины
      properties:
        productId:
          $ref: components.yaml#/components/schemas/Id
        sellerId:
          $ref: components.yaml#/components/schemas/Id
        title:
          type: string
          description: Название
        description:
          type: string
          description: Описание
        productType:
          $ref: components.yaml#/components/schemas/ProductType
        platform:
          type: string
          description: Платформа
        activationRegions:
          type: array
          items:
            $ref: components.yaml#/components/schemas/Country
        price:
          $ref: components.yaml#/components/schemas/Money
        inStock:
          type: boolean
          description: Есть ли свободные ключи
        maxOrderQuantity:
          type: integer
          description: 'Сколько штук можно заказать сейчас: от 0 до 10, ноль означает «нет в наличии» (INV-09, INV-10)'
          minimum: 0
          maximum: 10
      required:
      - productId
      - sellerId
      - title
      - description
      - productType
      - platform
      - activationRegions
      - price
      - inStock
      - maxOrderQuantity
    ProductCard:
      type: object
      description: 'Карточка товара для сервиса заказов: статус, цена, продавец, способ выдачи. Продавец «заблокирован»
        учитывается в статусе товара (R2)'
      properties:
        productId:
          $ref: components.yaml#/components/schemas/Id
        sellerId:
          $ref: components.yaml#/components/schemas/Id
        title:
          type: string
          description: Название, сервис заказов хранит его снимком
        status:
          $ref: components.yaml#/components/schemas/ProductStatus
        price:
          $ref: components.yaml#/components/schemas/Money
        issuanceMethod:
          $ref: components.yaml#/components/schemas/IssuanceMethod
        productType:
          $ref: components.yaml#/components/schemas/ProductType
      required:
      - productId
      - sellerId
      - title
      - status
      - price
      - issuanceMethod
      - productType
