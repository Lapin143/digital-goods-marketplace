openapi: 3.1.0
info:
  title: 'Digital Goods Marketplace: сервис каталога'
  version: 1.0.0
  description: |-
    REST API сервиса каталога (модули `seller_onboarding` и `catalog`). Заявка на статус продавца и её проверка, товары продавца и их модерация, публичная витрина и поиск, внутренний вызов «карточка товара» для сервиса заказов.

    Контракт описывает релиз R1. Общие правила (идентификаторы, деньги, время, ошибки, страницы, идемпотентность) записаны в `docs/05-architecture/conventions.md`, права каждой операции в `docs/05-architecture/roles-permissions.md`. Пути под `/api/v1` проходят через `api-gateway`, пути под `/internal/v1` вызываются другими сервисами напрямую по mTLS.
  license:
    name: Учебный проект, лицензия не задана
    identifier: NOASSERTION
servers:
- url: https://api.marketplace.example
  description: Публичный адрес `api-gateway`. На демо-стенде адрес задаёт конфигурация развёртывания
tags:
- name: Заявка продавца
  description: Анкета, документы и отправка заявки покупателем (область `seller.apply`)
- name: Модерация заявок
  description: Очередь и решения модератора по заявкам продавцов (область `staff.moderation`, 2FA)
- name: Товары продавца
  description: 'Кабинет продавца: создание, правка, отправка на модерацию, архив (область `seller.catalog`, 2FA)'
- name: Модерация товаров
  description: Очередь и решения модератора по товарам (область `staff.moderation`, 2FA)
- name: Витрина
  description: Публичный каталог, карточка товара, поиск и фильтры без токена
- name: Внутренние вызовы
  description: Вызовы между сервисами по mTLS, через шлюз не маршрутизируются
security: []
paths:
  /api/v1/seller-applications:
    post:
      operationId: createSellerApplication
      summary: 'Начать заявку: создать черновик анкеты'
      description: |-
        Создаёт профиль продавца в статусе `draft` (SM-05, переход T1). Заявитель может сохранить анкету частично: в очередь модератора черновик не попадает. У пользователя один профиль (INV-39): если профиль уже есть, ответ 409 с текущим статусом, анкету правят через `PUT /api/v1/seller-applications/current`.

        Матрица прав: OP-10. Истории: US-2.1.
      tags:
      - Заявка продавца
      x-matrix-id: OP-10
      x-stories:
      - US-2.1
      x-allowed-roles:
      - buyer
      x-conditions:
      - U15
      x-sms-session: denied
      security:
      - bearerJwt:
        - seller.apply
      parameters:
      - $ref: components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerApplicationForm'
            example:
              sellerType: self_employed
              name: Студия «Лунный свет»
              payoutDetails:
                recipientName: Иванов Иван Иванович
                bankName: Банк «Пример»
                bik: '044525000'
                accountNumber: '40817810000000000001'
              assortmentDescription: Ключи к инди-играм для Steam
      responses:
        '201':
          description: Черновик создан
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
            ETag:
              $ref: components.yaml#/components/headers/ETag
            Location:
              $ref: components.yaml#/components/headers/Location
            Idempotency-Replayed:
              $ref: components.yaml#/components/headers/IdempotencyReplayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerApplication'
              example:
                sellerId: 0199e0a0-0000-7000-8000-000000000101
                status: draft
                sellerType: self_employed
                name: Студия «Лунный свет»
                payoutDetails:
                  recipientName: Иванов Иван Иванович
                  bankName: Банк «Пример»
                  bik: '044525000'
                  accountNumber: '40817810000000000001'
                assortmentDescription: Ключи к инди-играм для Steam
                documents:
                - documentId: 0199e0a0-0000-7000-8000-000000000901
                  fileName: certificate.pdf
                  contentType: application/pdf
                  sizeBytes: 482113
                  uploadedAt: '2026-10-03T11:00:00.456Z'
                decisionReason: null
                rejectedAt: null
                nextApplicationAt: null
                submittedAt: null
                reviewDeadlineAt: null
                createdAt: '2026-10-03T11:00:00.456Z'
                updatedAt: '2026-10-03T11:00:00.456Z'
        '400':
          $ref: components.yaml#/components/responses/E400BadRequestIdempotencyKeyRequired
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403ForbiddenFullLoginRequired
        '409':
          $ref: components.yaml#/components/responses/E409StateConflictRequestInProgress
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailedIdempotencyKeyReuse
        '429':
          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /api/v1/seller-applications/current:
    get:
      operationId: getCurrentSellerApplication
      summary: Показать свою заявку
      description: |-
        Возвращает заявку текущего пользователя: анкету, документы, статус, причину отказа или комментарий доработки (FT-2.4). После отказа поле `nextApplicationAt` показывает, когда можно подать новую заявку. Если профиля нет, ответ 404.

        Матрица прав: OP-10. Истории: US-2.1.
      tags:
      - Заявка продавца
      x-matrix-id: OP-10
      x-stories:
      - US-2.1
      x-allowed-roles:
      - buyer
      x-conditions:
      - U15
      x-sms-session: denied
      security:
      - bearerJwt:
        - seller.apply
      responses:
        '200':
          description: Заявка
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
            ETag:
              $ref: components.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerApplication'
              example:
                sellerId: 0199e0a0-0000-7000-8000-000000000101
                status: draft
                sellerType: self_employed
                name: Студия «Лунный свет»
                payoutDetails:
                  recipientName: Иванов Иван Иванович
                  bankName: Банк «Пример»
                  bik: '044525000'
                  accountNumber: '40817810000000000001'
                assortmentDescription: Ключи к инди-играм для Steam
                documents:
                - documentId: 0199e0a0-0000-7000-8000-000000000901
                  fileName: certificate.pdf
                  contentType: application/pdf
                  sizeBytes: 482113
                  uploadedAt: '2026-10-03T11:00:00.456Z'
                decisionReason: null
                rejectedAt: null
                nextApplicationAt: null
                submittedAt: null
                reviewDeadlineAt: null
                createdAt: '2026-10-03T11:00:00.456Z'
                updatedAt: '2026-10-03T11:00:00.456Z'
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403ForbiddenFullLoginRequired
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '429':
          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
    put:
      operationId: replaceSellerApplicationDraft
      summary: Сохранить анкету целиком
      description: |-
        Заменяет анкету целиком (`PUT`, идемпотентна), нужен `If-Match`. Доступна для профиля в статусах `draft`, `returned` и `rejected`. Для `rejected` это переход T6: профиль возвращается в `draft`, причина отказа остаётся видна, подача новой заявки станет возможна после паузы (проверяется при отправке, US-2.5). В статусах `on_review` и `approved` изменить анкету нельзя.

        Матрица прав: OP-10 и OP-14. Истории: US-2.1, US-2.5.
      tags:
      - Заявка продавца
      x-matrix-id: OP-10
      x-matrix-also:
      - OP-14
      x-stories:
      - US-2.1
      - US-2.5
      x-allowed-roles:
      - buyer
      x-conditions:
      - U14
      - U15
      x-sms-session: denied
      security:
      - bearerJwt:
        - seller.apply
      parameters:
      - $ref: components.yaml#/components/parameters/IfMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerApplicationForm'
            example:
              sellerType: self_employed
              name: Студия «Лунный свет»
              payoutDetails:
                recipientName: Иванов Иван Иванович
                bankName: Банк «Пример»
                bik: '044525000'
                accountNumber: '40817810000000000001'
              assortmentDescription: Ключи к инди-играм для Steam
      responses:
        '200':
          description: Анкета сохранена
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
            ETag:
              $ref: components.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerApplication'
              example:
                sellerId: 0199e0a0-0000-7000-8000-000000000101
                status: draft
                sellerType: self_employed
                name: Студия «Лунный свет»
                payoutDetails:
                  recipientName: Иванов Иван Иванович
                  bankName: Банк «Пример»
                  bik: '044525000'
                  accountNumber: '40817810000000000001'
                assortmentDescription: Ключи к инди-играм для Steam
                documents:
                - documentId: 0199e0a0-0000-7000-8000-000000000901
                  fileName: certificate.pdf
                  contentType: application/pdf
                  sizeBytes: 482113
                  uploadedAt: '2026-10-03T11:00:00.456Z'
                decisionReason: null
                rejectedAt: null
                nextApplicationAt: null
                submittedAt: null
                reviewDeadlineAt: null
                createdAt: '2026-10-03T11:00:00.456Z'
                updatedAt: '2026-10-03T11:00:00.456Z'
        '400':
          $ref: components.yaml#/components/responses/E400BadRequest
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403ForbiddenFullLoginRequired
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '409':
          $ref: components.yaml#/components/responses/E409StateConflict
        '412':
          $ref: components.yaml#/components/responses/E412VersionConflict
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailed
        '428':
          $ref: components.yaml#/components/responses/E428PreconditionRequired
        '429':
          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /api/v1/seller-applications/current/documents:
    post:
      operationId: uploadSellerDocument
      summary: Загрузить документ
      description: |-
        Загружает файл в закрытый бакет объектного хранилища в РФ (форма `multipart/form-data`, часть `file`). Допустимы PDF, JPEG и PNG до 2 МБ (предел тела на шлюзе). Не больше 10 документов в заявке. Документ добавляется только к заявке в статусах `draft`, `returned`, `rejected`.

        Матрица прав: OP-10. Истории: US-2.1.
      tags:
      - Заявка продавца
      x-matrix-id: OP-10
      x-stories:
      - US-2.1
      x-allowed-roles:
      - buyer
      x-conditions:
      - U15
      x-sms-session: denied
      security:
      - bearerJwt:
        - seller.apply
      parameters:
      - $ref: components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: Файл документа
                  format: binary
              required:
              - file
              additionalProperties: false
            example:
              file: (двоичное содержимое файла)
      responses:
        '201':
          description: Документ сохранён
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
            Location:
              $ref: components.yaml#/components/headers/Location
            Idempotency-Replayed:
              $ref: components.yaml#/components/headers/IdempotencyReplayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerDocument'
              example:
                documentId: 0199e0a0-0000-7000-8000-000000000901
                fileName: certificate.pdf
                contentType: application/pdf
                sizeBytes: 482113
                uploadedAt: '2026-10-03T11:00:00.456Z'
        '400':
          $ref: components.yaml#/components/responses/E400BadRequestIdempotencyKeyRequired
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403ForbiddenFullLoginRequired
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '409':
          $ref: components.yaml#/components/responses/E409StateConflictRequestInProgress
        '413':
          $ref: components.yaml#/components/responses/E413PayloadTooLarge
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailedIdempotencyKeyReuse
        '429':
          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /api/v1/seller-applications/current/documents/{documentId}:
    delete:
      operationId: deleteSellerDocument
      summary: Удалить документ из заявки
      description: |-
        Удаляет документ из заявки в статусах `draft`, `returned`, `rejected`. Повтор после успеха даёт 404.

        Матрица прав: OP-10. Истории: US-2.1.
      tags:
      - Заявка продавца
      x-matrix-id: OP-10
      x-stories:
      - US-2.1
      x-allowed-roles:
      - buyer
      x-conditions:
      - U15
      x-sms-session: denied
      security:
      - bearerJwt:
        - seller.apply
      parameters:
      - name: documentId
        in: path
        required: true
        description: Идентификатор документа заявки
        schema:
          $ref: components.yaml#/components/schemas/Id
        example: 0199e0a0-0000-7000-8000-000000000901
      responses:
        '204':
          description: Документ удалён
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
        '400':
          $ref: components.yaml#/components/responses/E400BadRequest
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403ForbiddenFullLoginRequired
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '409':
          $ref: components.yaml#/components/responses/E409StateConflict
        '429':
          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /api/v1/seller-applications/current/documents/{documentId}/link:
    get:
      operationId: getSellerDocumentLink
      summary: Получить ссылку на свой документ
      description: |-
        Выдаёт короткоживущую подписанную ссылку (5 минут) на документ своей заявки. Ссылка открывается через маршрут `/files/**` шлюза.

        Матрица прав: OP-10. Истории: US-2.1.
      tags:
      - Заявка продавца
      x-matrix-id: OP-10
      x-stories:
      - US-2.1
      x-allowed-roles:
      - buyer
      x-conditions:
      - U15
      x-sms-session: denied
      security:
      - bearerJwt:
        - seller.apply
      parameters:
      - name: documentId
        in: path
        required: true
        description: Идентификатор документа заявки
        schema:
          $ref: components.yaml#/components/schemas/Id
        example: 0199e0a0-0000-7000-8000-000000000901
      responses:
        '200':
          description: Ссылка
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentLink'
              example:
                url: https://api.marketplace.example/files/seller-documents/0199e0a0-0000-7000-8000-000000000901?X-Signature=abc123
                expiresAt: '2026-10-03T12:15:00.123Z'
        '400':
          $ref: components.yaml#/components/responses/E400BadRequest
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403ForbiddenFullLoginRequired
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '429':
          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /api/v1/seller-applications/current/submit:
    post:
      operationId: submitSellerApplication
      summary: Отправить заявку на проверку
      description: |-
        Переводит профиль в `on_review` (SM-05, T2 и T7), заявка попадает в очередь модератора, срок рассмотрения 3 суток отсчитывается заново. Проверяется полнота анкеты и наличие документа: незаполненные поля возвращаются в `errors` с кодом `required`. После отказа заявку принимают не раньше чем через 24 часа (параметр `seller.reapplication-pause-seconds`, U14), иначе 409 `application-pause-active` с `retryAfterAt`. Пока заявка на проверке, вторая не принимается (U15, INV-39).

        Матрица прав: OP-10 и OP-14. Истории: US-2.1, US-2.5.
      tags:
      - Заявка продавца
      x-matrix-id: OP-10
      x-matrix-also:
      - OP-14
      x-stories:
      - US-2.1
      - US-2.5
      x-allowed-roles:
      - buyer
      x-conditions:
      - U14
      - U15
      x-sms-session: denied
      security:
      - bearerJwt:
        - seller.apply
      parameters:
      - $ref: components.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Заявка принята к проверке
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
            Idempotency-Replayed:
              $ref: components.yaml#/components/headers/IdempotencyReplayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerApplication'
              example:
                sellerId: 0199e0a0-0000-7000-8000-000000000101
                status: on_review
                sellerType: self_employed
                name: Студия «Лунный свет»
                payoutDetails:
                  recipientName: Иванов Иван Иванович
                  bankName: Банк «Пример»
                  bik: '044525000'
                  accountNumber: '40817810000000000001'
                assortmentDescription: Ключи к инди-играм для Steam
                documents:
                - documentId: 0199e0a0-0000-7000-8000-000000000901
                  fileName: certificate.pdf
                  contentType: application/pdf
                  sizeBytes: 482113
                  uploadedAt: '2026-10-03T11:00:00.456Z'
                decisionReason: null
                rejectedAt: null
                nextApplicationAt: null
                submittedAt: '2026-10-03T12:00:00.123Z'
                reviewDeadlineAt: '2026-10-06T12:00:00.123Z'
                createdAt: '2026-10-03T11:00:00.456Z'
                updatedAt: '2026-10-03T12:00:00.123Z'
        '400':
          $ref: components.yaml#/components/responses/E400IdempotencyKeyRequired
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403ForbiddenFullLoginRequired
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '409':
          $ref: components.yaml#/components/responses/E409StateConflictRequestInProgressApplicationPauseActive
        '422':
          $ref: components.yaml#/components/responses/E422IdempotencyKeyReuse
        '429':
          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /api/v1/staff/seller-applications:
    get:
      operationId: listSellerApplicationQueue
      summary: Очередь заявок на проверке
      description: |-
        Заявки в статусе `on_review`, старые выше. Просроченные (больше 3 суток) помечены признаком `overdue`; оповещение администратору даёт правило мониторинга, автоматического решения нет.

        Матрица прав: OP-11. Истории: US-2.2.
      tags:
      - Модерация заявок
      x-matrix-id: OP-11
      x-stories:
      - US-2.2
      x-allowed-roles:
      - moderator
      x-conditions: []
      x-sms-session: denied
      security:
      - bearerJwt:
        - staff.moderation
      parameters:
      - $ref: components.yaml#/components/parameters/Limit
      - $ref: components.yaml#/components/parameters/Cursor
      responses:
        '200':
          description: Страница очереди
          headers:
