openapi: 3.1.0
info:
  title: 'Digital Goods Marketplace: сервис выдачи'
  version: 1.0.0
  description: |-
    REST API сервиса выдачи. Выдача запускается событием `order.paid` и пользовательских маршрутов не имеет: покупатель видит статус выдачи в карточке заказа, оператор повторяет отправку через обращение (platform-service). Единственный вход по HTTP это вебхук e-mail-провайдера со статусами писем с ключами.

    Значения ключей в этом API не передаются: сервис запрашивает их у `inventory-service` по mTLS, вкладывает в письмо и отдаёт провайдеру, не сохраняя (NFT-3.2, ADR-009).

    Для товаров с выдачей по API сервис шлёт подписанный запрос в систему продавца и принимает ответ отдельным вызовом по API-ключу (R2, Р-190). Ключ продавца сразу уходит в `inventory-service`, в базе выдачи его нет.
  license:
    name: Учебный проект, лицензия не задана
    identifier: NOASSERTION
servers:
- url: https://api.marketplace.example
  description: Публичный адрес `api-gateway`. На демо-стенде адрес задаёт конфигурация развёртывания
tags:
- name: Вебхук провайдера
  description: Статусы писем с ключом от e-mail-провайдера без токена, подпись проверяет сервис
- name: Ответ продавца
  description: Ответ системы продавца на запрос выдачи ключа, только по API-ключу (R2, ADR-028)
security: []
paths:
  /api/v1/webhooks/email-provider-keys:
    post:
      operationId: receiveKeyEmailStatus
      summary: Принять статус письма с ключом
      description: |-
        Публичный вход через `api-gateway`, без токена, тело до 64 КБ. Подпись HMAC-SHA-256 от `X-Webhook-Timestamp.тело` секретом `delivery_webhook_secret`, метка времени не старше 5 минут. Статус `delivered` переводит выдачу в `delivered` (SM-06, T5), отказ в `failed` (T6) с повторами и передачей в поддержку (ADR-011). Повтор и неизвестное письмо получают 200 без тела. Статусы писем, не содержащих ключей, принимает `platform-service` (`/api/v1/webhooks/email-provider`).

        Матрица прав: OP-60. Истории: US-6.3.
      tags:
      - Вебхук провайдера
      x-matrix-id: OP-60
      x-stories:
      - US-6.3
      x-allowed-roles:
      - system
      x-conditions: []
      x-webhook-secret: delivery_webhook_secret
      security:
      - webhookSignature: []
      parameters:
      - name: X-Webhook-Timestamp
        in: header
        required: true
        description: Метка времени отправки, RFC 3339 UTC. Входит в подписанную строку, не старше 5 минут
        schema:
          type: string
          format: date-time
        example: '2026-10-03T12:00:00.123Z'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailStatusNotification'
            example:
              messageId: msg_91c3d7
              status: delivered
              occurredAt: '2026-10-03T12:00:00.123Z'
      responses:
        '200':
          description: Принято, в том числе повтор и неизвестное письмо. Тела нет
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
        '400':
          $ref: components.yaml#/components/responses/E400BadRequest
        '401':
          $ref: components.yaml#/components/responses/E401SignatureInvalidWebhookExpired
        '413':
          $ref: components.yaml#/components/responses/E413PayloadTooLarge
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '429':
          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /api/v1/seller-api/delivery-requests/{requestId}/answer:
    post:
      operationId: respondSellerDelivery
      summary: Ответить на запрос выдачи ключа
      description: |-
        Система продавца присылает ключи (или отказ) по запросу, который платформа отправила на подключённый адрес (US-6.7, US-11.3). Только по API-ключу: ключ продавца должен совпасть с продавцом запроса, иначе 404 как для чужого ресурса (U24). Ответ принимается, пока не истекло окно (по умолчанию 10 минут): ответ, начатый до конца окна, имеет право закончиться, начатый после получает 409 `request-expired`. Платформа проверяет число ключей, шифрует их в `inventory-service` и продолжает выдачу письмом. Если хранилище ключей не ответило, ключи не потеряны: ответ 503, продавец повторяет вызов. Идемпотентность по `requestId` вместо `Idempotency-Key`: те же ключи дают 200 без второго ключа, другие ключи 409 `request-already-answered`. Число ключей не равно числу единиц, дубликат в пуле товара или лишнее поле: 422. Ответ с `error` переводит выдачу в сбой по причине продавца.

        Матрица прав: OP-101. Истории: US-11.3, US-6.7.
      tags:
      - Ответ продавца
      x-release: R2
      x-matrix-id: OP-101
      x-stories:
      - US-11.3
      - US-6.7
      x-allowed-roles:
      - seller
      x-conditions:
      - U24
      x-sms-session: denied
      x-seller-api: true
      x-no-idempotency: 'Идемпотентность по requestId: повтор того же ответа возвращает тот же итог, другой ответ
        409'
      security:
      - sellerApiKey: []
      parameters:
      - name: requestId
        in: path
        required: true
        description: Идентификатор запроса выдачи из тела запроса платформы
        schema:
          $ref: components.yaml#/components/schemas/Id
        example: 0199e0a0-0000-7000-8000-000000000a01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerAnswerRequest'
            example:
              keys:
              - SELLR-KEY00-00001
              - SELLR-KEY00-00002
      responses:
        '200':
          description: Ответ принят (в том числе повтор того же ответа)
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerAnswerResult'
              example:
                requestId: 0199e0a0-0000-7000-8000-000000000a01
                status: answered
                stored: 2
        '400':
          $ref: components.yaml#/components/responses/E400BadRequest
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403Forbidden
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '409':
          $ref: components.yaml#/components/responses/E409RequestInProgressRequestExpiredRequestAlreadyAnswered
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailed
        '429':
          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
        '503':
          $ref: components.yaml#/components/responses/E503DependencyUnavailable
components:
  schemas:
    EmailStatusNotification:
      type: object
      description: Статус письма с ключом. Дедупликация по паре «идентификатор письма, статус» (ADR-011), статус
        применяется один раз
      properties:
        messageId:
          type: string
          description: Идентификатор письма у провайдера, непрозрачная строка
          minLength: 1
          maxLength: 128
        status:
          type: string
          description: 'Статус письма: принято, доставлено, отказ. Перечисление открытое'
          enum:
          - accepted
          - delivered
          - failed
        occurredAt:
          $ref: components.yaml#/components/schemas/Timestamp
        reason:
          type: string
          description: Причина отказа, для `failed`
          enum:
          - address_rejected
          - other
      required:
      - messageId
      - status
      - occurredAt
      additionalProperties: false
    SellerAnswerRequest:
      type: object
      additionalProperties: false
      description: 'Ответ продавца на запрос выдачи (Р-190): либо `keys` (ровно столько ключей, сколько единиц в
        заказе), либо `error`. Лишние поля дают 422. Значения ключей нигде не логируются (INV-20)'
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 1024
          description: Значения ключей, по одному на единицу товара в заказе
        error:
          type: object
          additionalProperties: false
          required:
          - code
          description: Продавец сообщает, что выдать не может. Заказ отменяется, деньги возвращаются
          properties:
            code:
              type: string
              enum:
              - out_of_stock
              - cannot_issue
              - other
              description: Причина отказа. Перечисление открытое
            message:
              type: string
              maxLength: 500
              description: Пояснение для оператора поддержки, в журнал не пишется
      oneOf:
      - required:
        - keys
      - required:
        - error
    SellerAnswerResult:
      type: object
      description: Итог приёма ответа. Повтор того же ответа возвращает тот же итог (идемпотентность по `requestId`)
      properties:
        requestId:
          $ref: components.yaml#/components/schemas/Id
        status:
          type: string
          enum:
          - answered
          - failed
          description: '`answered`: ключи приняты, выдача продолжится письмом; `failed`: продавец отказал, заказ
            будет отменён'
        stored:
          oneOf:
          - type: integer
            minimum: 1
            maximum: 10
            description: Сколько ключей принято
          - type: 'null'
      required:
      - requestId
      - status
      - stored
