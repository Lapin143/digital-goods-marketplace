openapi: 3.1.0
info:
  title: 'Digital Goods Marketplace: сервис остатков и ключей'
  version: 1.0.0
  description: |-
    REST API сервиса остатков и ключей. Продавец загружает пулы ключей и смотрит остаток; сервис заказов резервирует и подтверждает резерв; сервис выдачи получает значения ключей заказа.

    Значения ключей нигде не возвращаются продавцу, модератору, оператору и не попадают в журналы и события (INV-20, NFT-3.2). Единственная операция, отдающая значения, это внутренний вызов выдачи. Тела запросов загрузки ключей и ответ со значениями не логируются (conventions.md, раздел 13).
  license:
    name: Учебный проект, лицензия не задана
    identifier: NOASSERTION
servers:
- url: https://api.marketplace.example
  description: Публичный адрес `api-gateway`. На демо-стенде адрес задаёт конфигурация развёртывания
tags:
- name: Пулы ключей
  description: Загрузка ключей и остаток товара (область `seller.catalog`, 2FA)
- name: Внутренние вызовы
  description: Резерв и значения ключей для других сервисов по mTLS
security: []
paths:
  /api/v1/seller/products/{productId}/key-batches:
    post:
      operationId: uploadKeyBatch
      summary: Загрузить ключи списком
      description: |-
        Добавляет ключи в пул товара. Каждый новый ключ шифруется (AES-256-GCM) и сохраняется в статусе `free`, дубликаты по паре «товар, HMAC значения» отклоняются, остальные принимаются (US-4.2). Такое же значение в пуле другого товара дубликатом не считается. Товар должен принадлежать одобренному продавцу (U3) и находиться в статусе `draft`, `on_moderation`, `published` или `rejected` со способом выдачи `key_pool` (U4), иначе 409. Если после загрузки в пуле было бы больше 100000 ключей, список отклоняется целиком (409 `pool-limit-exceeded`). Удалять свободные ключи продавец не может. В списке не больше 10000 ключей, ключ не длиннее 1024 символов. Загрузки идут под лимитом «6 загрузок в час» на продавца, общим для кабинета и API (Р-188, ADR-021), и под общим лимитом группы.

        Матрица прав: OP-36. Истории: US-4.2.

        У товара с выдачей по API пула нет: загрузка отвечает 409 `issuance-method-mismatch` (U22, Р-184). Доступна и по API-ключу (`X-Api-Key`, Р-185, US-11.2).
      tags:
      - Пулы ключей
      x-matrix-id: OP-36
      x-stories:
      - US-4.2
      x-allowed-roles:
      - seller
      x-conditions:
      - U3
      - U4
      - U22
      x-seller-api: true
      x-sms-session: denied
      security:
      - bearerJwt:
        - seller.catalog
      - sellerApiKey: []
      parameters:
      - name: productId
        in: path
        required: true
        description: Идентификатор своего товара
        schema:
          $ref: components.yaml#/components/schemas/Id
        example: 0199e0a0-0000-7000-8000-000000000201
      - $ref: components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyBatchRequest'
            example:
              keys:
              - XXXXX-XXXXX-00001
              - XXXXX-XXXXX-00002
              - XXXXX-XXXXX-00002
              - XXXXX-XXXXX-00003
              - ''
              - XXXXX-XXXXX-00004
      responses:
        '200':
          description: Итог загрузки
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
            Idempotency-Replayed:
              $ref: components.yaml#/components/headers/IdempotencyReplayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyUploadReport'
              example:
                accepted: 3
                rejectedTotal: 2
                rejected:
                - line: 2
                  reason: duplicate_in_upload
                - line: 5
                  reason: empty
                available: 103
                poolLimit: 100000
        '400':
          $ref: components.yaml#/components/responses/E400BadRequestIdempotencyKeyRequired
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403ForbiddenSecondFactorRequired
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '409':
          $ref: components.yaml#/components/responses/E409StateConflictRequestInProgressPoolLimitExceededIssuanceMethodMismatch
        '413':
          $ref: components.yaml#/components/responses/E413PayloadTooLarge
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailedIdempotencyKeyReuse
        '429':
          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /api/v1/seller/products/{productId}/key-files:
    post:
      operationId: uploadKeyFile
      summary: Загрузить ключи файлом CSV
      description: |-
        Принимает тело `text/csv`: один ключ в строке, кодировка UTF-8, пустые строки считаются некорректными. Правила те же, что у загрузки списком, итог содержит номера отклонённых строк (US-4.3). Пустая строка или строка длиннее 1 КБ отклоняется, остальные принимаются. Тело не больше 2 МБ и 10000 строк, файл читается потоком и нигде не сохраняется, значения не попадают в журналы (ADR-009).

        Матрица прав: OP-37. Истории: US-4.3.

        У товара с выдачей по API пула нет: загрузка отвечает 409 `issuance-method-mismatch` (U22, Р-184). Доступна и по API-ключу (`X-Api-Key`, Р-185, US-11.2).
      tags:
      - Пулы ключей
      x-matrix-id: OP-37
      x-stories:
      - US-4.3
      x-allowed-roles:
      - seller
      x-conditions:
      - U3
      - U4
      - U22
      x-seller-api: true
      x-sms-session: denied
      security:
      - bearerJwt:
        - seller.catalog
      - sellerApiKey: []
      parameters:
      - name: productId
        in: path
        required: true
        description: Идентификатор своего товара
        schema:
          $ref: components.yaml#/components/schemas/Id
        example: 0199e0a0-0000-7000-8000-000000000201
      - $ref: components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              description: Ключи по одному в строке
              format: binary
            example: |
              XXXXX-XXXXX-00001
              XXXXX-XXXXX-00002
              XXXXX-XXXXX-00003
      responses:
        '200':
          description: Итог загрузки
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
            Idempotency-Replayed:
              $ref: components.yaml#/components/headers/IdempotencyReplayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyUploadReport'
              example:
                accepted: 3
                rejectedTotal: 0
                rejected: []
                available: 3
                poolLimit: 100000
        '400':
          $ref: components.yaml#/components/responses/E400BadRequestIdempotencyKeyRequired
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403ForbiddenSecondFactorRequired
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '409':
          $ref: components.yaml#/components/responses/E409StateConflictRequestInProgressPoolLimitExceededIssuanceMethodMismatch
        '413':
          $ref: components.yaml#/components/responses/E413PayloadTooLarge
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailedIdempotencyKeyReuse
        '429':
          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /api/v1/seller/products/{productId}/stock:
    get:
      operationId: getProductStock
      summary: Остаток своего товара
      description: |-
        Свободные, зарезервированные и выданные ключи. Остаток товара с пулом равен числу свободных ключей (US-4.5). Для товара с выдачей по API ответ содержит количество продавца за вычетом резервов, `issuanceMethod = seller_api` и `version` (US-4.7, Р-183). Значений ключей в ответе нет.

        Матрица прав: OP-39. Истории: US-4.5.

        Доступна и по API-ключу (`X-Api-Key`, Р-185, US-11.2).
      tags:
      - Пулы ключей
      x-matrix-id: OP-39
      x-stories:
      - US-4.5
      x-allowed-roles:
      - seller
      x-conditions:
      - U3
      x-seller-api: true
      x-sms-session: denied
      security:
      - bearerJwt:
        - seller.catalog
      - sellerApiKey: []
      parameters:
      - name: productId
        in: path
        required: true
        description: Идентификатор своего товара
        schema:
          $ref: components.yaml#/components/schemas/Id
        example: 0199e0a0-0000-7000-8000-000000000201
      responses:
        '200':
          description: Остаток
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockInfo'
              example:
                productId: 0199e0a0-0000-7000-8000-000000000201
                available: 87
                reserved: 3
                issued: 10
                poolSize: 100
                poolLimit: 100000
                updatedAt: '2026-10-03T12:00:00.123Z'
        '400':
          $ref: components.yaml#/components/responses/E400BadRequest
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403ForbiddenSecondFactorRequired
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '429':
          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /internal/v1/reservations:
    post:
      operationId: reserveKeys
      summary: Зарезервировать ключи (внутренний)
      description: |-
        Закрепляет за заказом нужное число свободных ключей одной транзакцией: выбор строк `FOR UPDATE SKIP LOCKED`, привязка к заказу, создание резерва, перевод ключей в `reserved` (INV-01, INV-05). Если свободных ключей меньше, ответ 409 `insufficient-stock` с `available`, ничего не резервируется. У заказа не больше одного активного резерва (INV-06): повторный вызов с тем же `Idempotency-Key` возвращает тот же резерв, вызов с новым ключом при активном резерве даёт 409 `state-conflict`. Товара с таким идентификатором в реестре нет: 404, ничего не создаётся. Срок резерва задаёт параметр платформы. Тайм-аут вызывающего 2 секунды.

        Матрица прав: OP-51. Истории: US-5.2.
      tags:
      - Внутренние вызовы
      x-matrix-id: OP-51
      x-stories:
      - US-5.2
      x-allowed-roles:
      - system
      x-conditions: []
      x-allowed-callers:
      - order-service
      x-internal: true
      security:
      - mutualTls: []
      servers:
      - url: https://inventory-service:8443
        description: Внутренний адрес сервиса, mTLS, не через шлюз
      parameters:
      - $ref: components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveRequest'
            example:
              orderId: 0199e0a0-0000-7000-8000-000000000301
              productId: 0199e0a0-0000-7000-8000-000000000201
              quantity: 2
      responses:
        '201':
          description: Резерв создан
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
            Location:
              $ref: components.yaml#/components/headers/Location
            Idempotency-Replayed:
              $ref: components.yaml#/components/headers/IdempotencyReplayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
              example:
                reservationId: 0199e0a0-0000-7000-8000-000000000701
                orderId: 0199e0a0-0000-7000-8000-000000000301
                productId: 0199e0a0-0000-7000-8000-000000000201
                quantity: 2
                status: active
                expiresAt: '2026-10-03T12:15:00.123Z'
        '400':
          $ref: components.yaml#/components/responses/E400BadRequestIdempotencyKeyRequired
        '403':
          $ref: components.yaml#/components/responses/E403Forbidden
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '409':
          $ref: components.yaml#/components/responses/E409StateConflictRequestInProgressInsufficientStock
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailedIdempotencyKeyReuse
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /internal/v1/reservations/confirm:
    post:
      operationId: confirmReservation
      summary: Подтвердить резерв после оплаты (внутренний)
      description: |-
        Одна атомарная операция по заказу (ADR-013, SEQ-02, SM-08/T2). Резерв заказа `active`: переводится в `used`, ключи из `reserved` в `issued` (SM-03/T4), ключи закреплены за заказом окончательно. Резерв заказа уже снят (`released`, срок истёк или заказ отменён): при тех же `productId` и `quantity` в той же транзакции берутся свободные ключи `FOR UPDATE SKIP LOCKED`, создаётся новый резерв сразу в `used`, ответ с `reReserved = true` (поздняя оплата). Свободных ключей меньше заказанного: 409 `insufficient-stock` с `available`, ничего не создаётся и не меняется (INV-05), заказ идёт к возврату. Резерва этого заказа нет совсем (ни активного, ни снятого): 404. Повтор после успеха возвращает тот же резерв без изменений. Вызов синхронный, чтобы между «оплачен» и «ключи закреплены» не было окна, в котором резерв истечёт или ключи займёт другой заказ. Отдельной операции «зарезервировать заново» нет.

        Матрица прав: OP-54. Истории: US-5.5.
      tags:
      - Внутренние вызовы
      x-matrix-id: OP-54
      x-stories:
      - US-5.5
      x-allowed-roles:
      - system
      x-conditions: []
      x-allowed-callers:
      - order-service
      x-internal: true
      security:
      - mutualTls: []
      servers:
      - url: https://inventory-service:8443
        description: Внутренний адрес сервиса, mTLS, не через шлюз
      parameters:
      - $ref: components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveRequest'
            example:
              orderId: 0199e0a0-0000-7000-8000-000000000301
              productId: 0199e0a0-0000-7000-8000-000000000201
              quantity: 2
      responses:
        '200':
          description: Резерв подтверждён (при поздней оплате создан заново, `reReserved = true`)
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
            Idempotency-Replayed:
              $ref: components.yaml#/components/headers/IdempotencyReplayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
              example:
                reservationId: 0199e0a0-0000-7000-8000-000000000701
                orderId: 0199e0a0-0000-7000-8000-000000000301
                productId: 0199e0a0-0000-7000-8000-000000000201
                quantity: 2
                status: used
                expiresAt: '2026-10-03T12:15:00.123Z'
                reReserved: false
        '400':
          $ref: components.yaml#/components/responses/E400BadRequestIdempotencyKeyRequired
        '403':
          $ref: components.yaml#/components/responses/E403Forbidden
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '409':
          $ref: components.yaml#/components/responses/E409StateConflictRequestInProgressInsufficientStock
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailedIdempotencyKeyReuse
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /internal/v1/keys:
    get:
      operationId: getKeyValues
      summary: Значения ключей заказа (внутренний)
      description: |-
        Отдаёт расшифрованные значения ключей заказа для письма. Вызывает только `delivery-service`, остальным (включая `order-service` и `platform-service`) отказ на уровне сертификата (U17, ADR-009). Ключи заказа должны быть в статусе `issued`, то есть платёж подтверждён (SM-03/T4), иначе 409. Ответ с `Cache-Control: no-store`, тело не пишется в журналы.

        Матрица прав: OP-38. Истории: US-4.4.
      tags:
      - Внутренние вызовы
      x-matrix-id: OP-38
      x-stories:
      - US-4.4
      x-allowed-roles:
      - system
      x-conditions:
      - U17
      x-allowed-callers:
      - delivery-service
      x-internal: true
      security:
      - mutualTls: []
      servers:
      - url: https://inventory-service:8443
        description: Внутренний адрес сервиса, mTLS, не через шлюз
      parameters:
      - name: orderId
        in: query
        required: true
        description: Идентификатор заказа
        schema:
          $ref: components.yaml#/components/schemas/Id
        example: 0199e0a0-0000-7000-8000-000000000301
      responses:
        '200':
          description: Значения ключей
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyValues'
              example:
                orderId: 0199e0a0-0000-7000-8000-000000000301
                keys:
                - keyId: 0199e0a0-0000-7000-8000-000000000801
                  value: XXXXX-XXXXX-00001
                - keyId: 0199e0a0-0000-7000-8000-000000000802
                  value: XXXXX-XXXXX-00002
        '400':
          $ref: components.yaml#/components/responses/E400BadRequest
        '403':
          $ref: components.yaml#/components/responses/E403Forbidden
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '409':
          $ref: components.yaml#/components/responses/E409StateConflict
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailed
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /api/v1/seller/products/{productId}/api-stock:
    put:
      operationId: setApiStock
      summary: Задать остаток товара с выдачей по API
      description: |-
        Продавец сообщает, сколько единиц товара он готов выдать сейчас (FT-4.3, US-4.7): значение заменяет остаток целиком. Версия записи защищает от потерянной правки (ADR-008): пока продавец смотрел форму, заказы уменьшили остаток, поэтому `If-Match` со старой версией даёт 412 `version-conflict`, без заголовка 428. Значение от 0 до 1 000 000, иначе 422. Платформа резервирует и возвращает остаток атомарным условным `UPDATE` (`quantity >= :n`), поэтому он не уходит в минус (INV-09). У товара с пулом ключей остаток по API не ведётся: 409 `issuance-method-mismatch` (U22, Р-184). Доступна и по API-ключу (Р-185). Публикует `stock.changed`.

        Матрица прав: OP-98. Истории: US-4.7.
      tags:
      - Пулы ключей
      x-release: R2
      x-matrix-id: OP-98
      x-stories:
      - US-4.7
      x-allowed-roles:
      - seller
      x-conditions:
      - U3
      - U22
      x-sms-session: denied
      x-seller-api: true
      security:
      - bearerJwt:
        - seller.catalog
      - sellerApiKey: []
      parameters:
      - name: productId
        in: path
        required: true
        description: Идентификатор своего товара с выдачей по API
        schema:
          $ref: components.yaml#/components/schemas/Id
        example: 0199e0a0-0000-7000-8000-000000000202
      - $ref: components.yaml#/components/parameters/IfMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiStockRequest'
            example:
              quantity: 25
      responses:
        '200':
          description: Остаток сохранён
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
            ETag:
              $ref: components.yaml#/components/headers/ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiStock'
              example:
                productId: 0199e0a0-0000-7000-8000-000000000202
                quantity: 25
                version: 4
                updatedAt: '2026-11-02T12:00:00.123Z'
        '400':
          $ref: components.yaml#/components/responses/E400BadRequest
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403ForbiddenSecondFactorRequired
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '409':
          $ref: components.yaml#/components/responses/E409IssuanceMethodMismatch
        '412':
          $ref: components.yaml#/components/responses/E412VersionConflict
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailed
        '428':
          $ref: components.yaml#/components/responses/E428PreconditionRequired
        '429':
          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /internal/v1/seller-keys:
    post:
      operationId: storeSellerKeys
      summary: Принять ключи продавца для заказа (внутренний)
      description: |-
        Вызывает `delivery-service` сразу после ответа продавца (Р-190, ADR-028). Ключи шифруются как обычные (DEK, HMAC значения, INV-03), привязываются к заказу и к его резерву и проходят статусы `free`, `reserved`, `issued` (SM-03) одной транзакцией. Резерв к этому моменту уже `used`: оплату подтвердило `confirmReservation`, ключей он не привязывал (Р-183). Число ключей равно числу единиц в заказе, иначе 422; заказ без резерва по API: 404; резерв не `used` (снят после отмены заказа или не подтверждён): 409 (U23); значение, уже выданное по этому товару, отклоняется как дубликат (INV-03). Повтор с тем же `Idempotency-Key` и теми же ключами возвращает тот же итог. Значения нигде не логируются и в ответ не возвращаются (INV-20).

        Матрица прав: OP-99. Истории: US-6.7, US-11.3.
      tags:
      - Внутренние вызовы
      x-release: R2
      x-matrix-id: OP-99
      x-stories:
      - US-6.7
      - US-11.3
      x-allowed-roles:
      - system
      x-conditions:
      - U23
      x-allowed-callers:
      - delivery-service
      x-internal: true
      security:
      - mutualTls: []
      servers:
      - url: https://inventory-service:8443
        description: Внутренний адрес сервиса, mTLS, не через шлюз
      parameters:
      - $ref: components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerKeysRequest'
            example:
              orderId: 0199e0a0-0000-7000-8000-000000000301
              requestId: 0199e0a0-0000-7000-8000-000000000a01
              keys:
              - SELLR-KEY00-00001
              - SELLR-KEY00-00002
      responses:
        '200':
          description: Ключи приняты
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
            Idempotency-Replayed:
              $ref: components.yaml#/components/headers/IdempotencyReplayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerKeysStored'
              example:
                orderId: 0199e0a0-0000-7000-8000-000000000301
                stored: 2
        '400':
          $ref: components.yaml#/components/responses/E400BadRequestIdempotencyKeyRequired
        '403':
          $ref: components.yaml#/components/responses/E403Forbidden
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '409':
          $ref: components.yaml#/components/responses/E409StateConflictRequestInProgress
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailedIdempotencyKeyReuse
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
components:
  schemas:
    RejectedLine:
      type: object
      description: Отклонённая строка. Только номер и причина
      properties:
        line:
          type: integer
          description: Номер строки или позиции в списке, с единицы
          minimum: 1
        reason:
          type: string
          description: Почему строка отклонена. Значение ключа в ответ не попадает
          enum:
          - empty
          - too_long
          - duplicate_in_upload
          - duplicate_in_pool
      required:
      - line
      - reason
    KeyUploadReport:
      type: object
      description: 'Итог загрузки: принятые и отклонённые ключи. Повторная загрузка того же списка принимает 0 ключей:
        все значения уже в пуле (HMAC по паре «товар, значение»)'
      properties:
        accepted:
          type: integer
          description: Сколько ключей принято и сохранено в статусе «свободен»
          minimum: 0
        rejectedTotal:
          type: integer
          description: Сколько строк отклонено
          minimum: 0
        rejected:
          type: array
          description: Первые 1000 отклонённых строк
          items:
            $ref: '#/components/schemas/RejectedLine'
          maxItems: 1000
        available:
          type: integer
          description: 'Остаток товара после загрузки: свободные ключи'
          minimum: 0
        poolLimit:
          type: integer
          description: Предел пула одного товара
          minimum: 1
      required:
      - accepted
      - rejectedTotal
      - rejected
      - available
      - poolLimit
    KeyBatchRequest:
      type: object
      description: 'Ручная загрузка. Размер тела не больше 2 МБ (предел шлюза), ключей не больше 10000 в запросе:
        больший пул загружают несколькими запросами'
      properties:
        keys:
          type: array
          description: Ключи по одному в элементе
          items:
            type: string
            description: Значение ключа, от 1 до 1024 символов
            maxLength: 1024
          minItems: 1
          maxItems: 10000
      required:
      - keys
      additionalProperties: false
    StockInfo:
      type: object
      description: 'Остаток товара: у товара с пулом ключей по статусам ключей (SM-03), у товара с выдачей по API
        остаток, который задаёт продавец и уменьшают заказы (Р-183). Выданный ключ в остаток не возвращается'
      properties:
        productId:
          $ref: components.yaml#/components/schemas/Id
        available:
          type: integer
          description: Свободные ключи, это и есть остаток товара
          minimum: 0
        reserved:
          type: integer
          description: Ключи в резерве под неоплаченные заказы
          minimum: 0
        issued:
          type: integer
          description: Выданные ключи
          minimum: 0
        poolSize:
          type: integer
          description: 'Всего ключей в пуле: свободные, в резерве и выданные (аннулированных в R1 нет). Только у
            товара с пулом ключей'
          minimum: 0
        poolLimit:
          type: integer
          description: Предел пула одного товара. Только у товара с пулом ключей
          minimum: 1
        updatedAt:
          $ref: components.yaml#/components/schemas/Timestamp
        issuanceMethod:
          allOf:
          - $ref: components.yaml#/components/schemas/IssuanceMethod
          description: 'Способ выдачи товара. Для `seller_api` пула нет: `available` это остаток по API (доступно
            к заказу), `reserved` число единиц в активных резервах, `poolSize` и `poolLimit` не передаются, есть
            `version` (R2, Р-183, Р-184)'
        version:
          type: integer
          minimum: 0
          description: Версия остатка по API для `If-Match` в `setApiStock`; только у товара `seller_api`
      required:
      - productId
      - available
      - reserved
      - issued
      - updatedAt
    ReserveRequest:
      type: object
      description: 'Резерв всего заказанного количества: частичного резерва нет (INV-05)'
      properties:
        orderId:
          $ref: components.yaml#/components/schemas/Id
        productId:
          $ref: components.yaml#/components/schemas/Id
        quantity:
          type: integer
          description: Сколько ключей, от 1 до 10
          minimum: 1
          maximum: 10
      required:
      - orderId
      - productId
      - quantity
      additionalProperties: false
    Reservation:
      type: object
      description: Резерв ключей за заказом. Срок резерва берётся из параметра `reservation.ttl-seconds` (по умолчанию
        15 минут)
      properties:
        reservationId:
          $ref: components.yaml#/components/schemas/Id
        orderId:
          $ref: components.yaml#/components/schemas/Id
        productId:
          $ref: components.yaml#/components/schemas/Id
        quantity:
          type: integer
          description: Сколько ключей закреплено
          minimum: 1
          maximum: 10
        status:
          type: string
          description: Статус резерва по SM-08
          enum:
          - active
          - used
          - released
        expiresAt:
          $ref: components.yaml#/components/schemas/Timestamp
        reReserved:
          type: boolean
          description: Только в ответе `confirmReservation`. `true`, если резерв был снят и при поздней оплате создан
            заново сразу в статусе `used` (SEQ-02); `false`, если подтверждён прежний активный резерв
      required:
      - reservationId
      - orderId
      - productId
      - quantity
      - status
      - expiresAt
    KeyValues:
      type: object
      description: 'Значения ключей заказа для письма. Ответ с заголовком `Cache-Control: no-store`, тело не логируется'
      properties:
        orderId:
          $ref: components.yaml#/components/schemas/Id
        keys:
          type: array
          description: Ключи заказа
          items:
            type: object
            properties:
              keyId:
                $ref: components.yaml#/components/schemas/Id
              value:
                type: string
                description: 'Значение ключа в открытом виде. Секрет: не логировать, не сохранять, вложить в письмо
                  и забыть'
                minLength: 1
                maxLength: 1024
            required:
            - keyId
            - value
          minItems: 1
          maxItems: 10
      required:
      - orderId
      - keys
    ApiStockRequest:
      type: object
      additionalProperties: false
      required:
      - quantity
      description: 'Новый остаток товара с выдачей по API (FT-4.3, US-4.7): заменяет текущее значение, а не прибавляется
        к нему'
      properties:
        quantity:
          type: integer
          minimum: 0
          maximum: 1000000
          description: Сколько единиц продавец готов выдать сейчас. Единицы в заказах уже вычтены из остатка, поэтому
            правка по устаревшей версии отклоняется (412)
    ApiStock:
      type: object
      description: 'Остаток товара по API после правки: доступное количество и версия записи (Р-183)'
      properties:
        productId:
          $ref: components.yaml#/components/schemas/Id
        quantity:
          type: integer
          minimum: 0
          description: Остаток, доступный к заказу
        version:
          type: integer
          minimum: 0
          description: Версия записи, совпадает с `ETag`
        updatedAt:
          $ref: components.yaml#/components/schemas/Timestamp
      required:
      - productId
      - quantity
      - version
      - updatedAt
    SellerKeysRequest:
      type: object
      additionalProperties: false
      required:
      - orderId
      - requestId
      - keys
      description: Ключи, присланные продавцом в ответ на запрос выдачи (Р-190). Значения нигде не логируются (INV-20)
      properties:
        orderId:
          $ref: components.yaml#/components/schemas/Id
        requestId:
          $ref: components.yaml#/components/schemas/Id
        keys:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 1024
          description: Ровно столько ключей, сколько единиц товара в заказе
    SellerKeysStored:
      type: object
      description: Итог приёма ключей продавца. Значений нет
      properties:
        orderId:
          $ref: components.yaml#/components/schemas/Id
        stored:
          type: integer
          minimum: 1
          maximum: 10
          description: Сколько ключей принято
      required:
      - orderId
      - stored
