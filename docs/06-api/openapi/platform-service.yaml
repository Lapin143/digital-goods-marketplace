      operationId: verifyOtpCode
      summary: Проверить код входа по SMS (внутренний)
      description: |-
        Проверяет код и гасит его атомарно. Успех возвращает `userId`. Неверный код и код для неизвестного номера дают одинаковый 422 `otp-invalid`, устаревший 422 `otp-expired`, после пятой неудачи 429 `otp-locked`. Три погашенных из-за попыток кода подряд за час закрывают вход по SMS для номера на час.

        Матрица прав: OP-07. Истории: US-1.7.
      tags:
      - Коды для Keycloak
      x-matrix-id: OP-07
      x-stories:
      - US-1.7
      x-allowed-roles:
      - system
      x-conditions: []
      x-allowed-callers:
      - keycloak
      x-internal: true
      security:
      - mutualTls: []
      servers:
      - url: https://platform-service:8443
        description: Внутренний адрес сервиса, mTLS, не через шлюз
      parameters:
      - $ref: components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
            example:
              purpose: sms_login
              phone: '+79001234567'
              code: '123456'
      responses:
        '200':
          description: Код верен
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
            Idempotency-Replayed:
              $ref: components.yaml#/components/headers/IdempotencyReplayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerified'
              example:
                userId: 7e1c3a95-2d4f-4b68-9a0c-8b6d4f2a1e53
        '400':
          $ref: components.yaml#/components/responses/E400BadRequestIdempotencyKeyRequired
        '403':
          $ref: components.yaml#/components/responses/E403Forbidden
        '409':
          $ref: components.yaml#/components/responses/E409RequestInProgress
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailedIdempotencyKeyReuseOtpInvalidOtpExpired
        '429':
          $ref: components.yaml#/components/responses/E429OtpLocked
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /api/v1/webhooks/email-provider:
    post:
      operationId: receiveMailStatus
      summary: Принять статус письма (кроме писем с ключом)
      description: |-
        Публичный вход через `api-gateway`, без токена, тело до 64 КБ. Подпись секретом `platform_webhook_secret`, метка времени не старше 5 минут, повторный статус ничего не меняет. Отказ доставки письма публикует `notification.failed` после исчерпания повторов. Статусы писем с ключами принимает `delivery-service`.

        Матрица прав: OP-84. Истории: US-8.5.
      tags:
      - Вебхуки провайдеров
      x-matrix-id: OP-84
      x-stories:
      - US-8.5
      x-allowed-roles:
      - system
      x-conditions: []
      security:
      - webhookSignature: []
      parameters:
      - name: X-Webhook-Timestamp
        in: header
        required: true
        description: Метка времени отправки, RFC 3339 UTC. Входит в подписанную строку, не старше 5 минут
        schema:
          type: string
          format: date-time
        example: '2026-10-03T12:00:00.123Z'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailProviderNotification'
            example:
              messageId: msg_44a1b9
              status: delivered
              occurredAt: '2026-10-03T12:00:00.123Z'
      responses:
        '200':
          description: Принято, в том числе повтор. Тела нет
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
        '400':
          $ref: components.yaml#/components/responses/E400BadRequest
        '401':
          $ref: components.yaml#/components/responses/E401SignatureInvalidWebhookExpired
        '413':
          $ref: components.yaml#/components/responses/E413PayloadTooLarge
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /api/v1/webhooks/sms-provider:
    post:
      operationId: receiveSmsStatus
      summary: Принять статус SMS
      description: |-
        Публичный вход через `api-gateway`, без токена, тело до 64 КБ. Подпись секретом `platform_webhook_secret`, метка времени не старше 5 минут. Статус нужен для метрики доставляемости SMS и оповещения о сбое провайдера, на коды он не влияет.

        Матрица прав: OP-06. Истории: US-1.6.
      tags:
      - Вебхуки провайдеров
      x-matrix-id: OP-06
      x-stories:
      - US-1.6
      x-allowed-roles:
      - system
      x-conditions: []
      security:
      - webhookSignature: []
      parameters:
      - name: X-Webhook-Timestamp
        in: header
        required: true
        description: Метка времени отправки, RFC 3339 UTC. Входит в подписанную строку, не старше 5 минут
        schema:
          type: string
          format: date-time
        example: '2026-10-03T12:00:00.123Z'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsProviderNotification'
            example:
              messageId: sms_1c9e02
              status: delivered
              occurredAt: '2026-10-03T12:00:00.123Z'
      responses:
        '200':
          description: Принято, в том числе повтор. Тела нет
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
        '400':
          $ref: components.yaml#/components/responses/E400BadRequest
        '401':
          $ref: components.yaml#/components/responses/E401SignatureInvalidWebhookExpired
        '413':
          $ref: components.yaml#/components/responses/E413PayloadTooLarge
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
components:
  schemas:
    PhoneConfirmation:
      type: object
      description: Запрос подтверждения телефона. Код 6 цифр живёт 5 минут, попыток ввода 5, новый запрос гасит
        прежний код (ADR-010)
      properties:
        confirmationId:
          $ref: components.yaml#/components/schemas/Id
        phoneMasked:
          type: string
          description: Номер с маской, например `+7900***4567`
        expiresAt:
          $ref: components.yaml#/components/schemas/Timestamp
        attemptsLeft:
          type: integer
          description: Сколько попыток ввода осталось
          minimum: 0
          maximum: 5
        resendAvailableAt:
          oneOf:
          - $ref: components.yaml#/components/schemas/Timestamp
          - type: 'null'
      required:
      - confirmationId
      - phoneMasked
      - expiresAt
      - attemptsLeft
      - resendAvailableAt
    CreatePhoneConfirmationRequest:
      type: object
      description: Номер для подтверждения. Уникальность проверяется до отправки SMS (INV-34)
      properties:
        phone:
          type: string
          description: Номер телефона в формате E.164, в R1 только +7
          pattern: ^\+7[0-9]{10}$
      required:
      - phone
      additionalProperties: false
    VerifyCodeRequest:
      type: object
      description: Введённый код
      properties:
        code:
          type: string
          description: Одноразовый код из 6 цифр
          pattern: ^[0-9]{6}$
      required:
      - code
      additionalProperties: false
    PhoneConfirmed:
      type: object
      description: Телефон привязан и подтверждён. Признак `phone_verified` появится в токене после его обновления
        (refresh), оформление заказа продолжается с тем же товаром и количеством
      properties:
        phoneConfirmed:
          type: boolean
          description: Телефон подтверждён
        phoneMasked:
          type: string
          description: Номер с маской
      required:
      - phoneConfirmed
      - phoneMasked
    EmailChangeState:
      type: object
      description: Состояние смены e-mail по обращению. Оператор видит только результат каждой проверки, коды не
        видит и от покупателя не принимает (FT-7.5, INV-23)
      properties:
        status:
          type: string
          description: Этап смены e-mail
          enum:
          - awaiting_phone_code
          - awaiting_email_code
          - completed
          - failed
        phoneCheck:
          type: string
          description: Проверка кода из SMS
          enum:
          - pending
          - passed
          - failed
        newEmailCheck:
          type: string
          description: Проверка кода из письма на новый адрес
          enum:
          - not_started
          - pending
          - passed
          - failed
        newEmailMasked:
          type: string
          description: Новый адрес с маской, например `n***@mail.example`
        startedAt:
          $ref: components.yaml#/components/schemas/Timestamp
        updatedAt:
          $ref: components.yaml#/components/schemas/Timestamp
      required:
      - status
      - phoneCheck
      - newEmailCheck
      - newEmailMasked
      - startedAt
      - updatedAt
    SupportTicket:
      type: object
      description: Обращение покупателя по заказу (SM-07). Значений ключей нет
      properties:
        ticketId:
          $ref: components.yaml#/components/schemas/Id
        orderId:
          $ref: components.yaml#/components/schemas/Id
        source:
          type: string
          description: Источник обращения
          enum:
          - buyer
          - system
        reason:
          type: string
          description: Причина. Перечисление открытое
          enum:
          - key_not_received
          - not_delivered
          - attempts_exhausted
          - delivery_overdue
        status:
          $ref: components.yaml#/components/schemas/TicketStatus
        createdAt:
          $ref: components.yaml#/components/schemas/Timestamp
        resolvedAt:
          oneOf:
          - $ref: components.yaml#/components/schemas/Timestamp
          - type: 'null'
        resolution:
          oneOf:
          - type: object
            description: Итог обращения
            properties:
              resolvedBy:
                type: string
                description: Кто решил обращение
                enum:
                - operator
                - system
              action:
                oneOf:
                - type: string
                  description: Какое действие выполнено, `null` если решено системой по факту доставки
                  enum:
                  - resend
                  - email_change
                - type: 'null'
            required:
            - resolvedBy
            - action
          - type: 'null'
        emailChange:
          oneOf:
          - $ref: '#/components/schemas/EmailChangeState'
          - type: 'null'
      required:
      - ticketId
      - orderId
      - source
      - reason
      - status
      - createdAt
      - resolvedAt
      - resolution
      - emailChange
    SupportTicketPage:
      type: object
      description: Страница обращений покупателя, новые выше
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SupportTicket'
        page:
          $ref: components.yaml#/components/schemas/PageInfo
      required:
      - items
      - page
    StaffSupportTicket:
      type: object
      description: 'Обращение в очереди оператора: статус заказа и выдачи из модели чтения, оператор, состояние
        смены e-mail. Значения ключей и коды подтверждения оператору не показываются'
      properties:
        ticketId:
          $ref: components.yaml#/components/schemas/Id
        orderId:
          $ref: components.yaml#/components/schemas/Id
        buyerId:
          $ref: components.yaml#/components/schemas/Id
        source:
          type: string
          description: Источник обращения
          enum:
          - buyer
          - system
        reason:
          type: string
          description: Причина. Перечисление открытое
          enum:
          - key_not_received
          - not_delivered
          - attempts_exhausted
          - delivery_overdue
        status:
          $ref: components.yaml#/components/schemas/TicketStatus
        operatorId:
          oneOf:
          - $ref: components.yaml#/components/schemas/Id
          - type: 'null'
        orderStatus:
          $ref: components.yaml#/components/schemas/OrderStatus
        issuedAt:
          oneOf:
          - $ref: components.yaml#/components/schemas/Timestamp
          - type: 'null'
        deliveryStatus:
          oneOf:
          - $ref: components.yaml#/components/schemas/DeliveryStatus
          - type: 'null'
        createdAt:
          $ref: components.yaml#/components/schemas/Timestamp
        takenAt:
          oneOf:
          - $ref: components.yaml#/components/schemas/Timestamp
          - type: 'null'
        resolvedAt:
          oneOf:
          - $ref: components.yaml#/components/schemas/Timestamp
          - type: 'null'
        emailChange:
          oneOf:
          - $ref: '#/components/schemas/EmailChangeState'
          - type: 'null'
      required:
      - ticketId
      - orderId
      - buyerId
      - source
      - reason
      - status
      - operatorId
      - orderStatus
      - issuedAt
      - deliveryStatus
      - createdAt
      - takenAt
      - resolvedAt
      - emailChange
    StaffSupportTicketPage:
      type: object
      description: Очередь обращений, старые выше
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffSupportTicket'
        page:
          $ref: components.yaml#/components/schemas/PageInfo
      required:
      - items
      - page
    CreateSupportTicketRequest:
      type: object
      description: Обращение «Не получил ключ»
      properties:
        orderId:
          $ref: components.yaml#/components/schemas/Id
        reason:
          type: string
          description: Причина, для покупателя только «не получил ключ»
          enum:
          - key_not_received
      required:
      - orderId
      - reason
      additionalProperties: false
    ResendAccepted:
      type: object
      description: Заказ получил новый адрес, повторная выдача создаётся асинхронно (событие `order.address-updated`).
        Статус выдачи виден в обращении
      properties:
        ticketId:
          $ref: components.yaml#/components/schemas/Id
        orderId:
          $ref: components.yaml#/components/schemas/Id
        status:
          type: string
          description: Повторная отправка принята к выполнению
          enum:
          - accepted
      required:
      - ticketId
      - orderId
      - status
    StartEmailChangeRequest:
      type: object
      description: Новый адрес, который назвал покупатель оператору
      properties:
        newEmail:
          $ref: components.yaml#/components/schemas/Email
      required:
      - newEmail
      additionalProperties: false
    VerifyEmailChangeCodeRequest:
      type: object
      description: 'Ввод кода в форме обращения. Порядок этапов задаёт сервис: сначала `phone`, затем `new_email`'
      properties:
        step:
          type: string
          description: 'Какой код вводится: из SMS на телефон учётной записи или из письма на новый адрес'
          enum:
          - phone
          - new_email
        code:
          type: string
          description: Одноразовый код из 6 цифр
          pattern: ^[0-9]{6}$
      required:
      - step
      - code
      additionalProperties: false
    RequestEmailChangeCodeRequest:
      type: object
      description: Запрос нового кода в пределах лимита
      properties:
        step:
          type: string
          description: Для какого этапа запрашивается новый код
          enum:
          - phone
          - new_email
      required:
      - step
      additionalProperties: false
    StaffUser:
      type: object
      description: Учётная запись в кабинете администратора. Номер телефона не показывается
      properties:
        userId:
          $ref: components.yaml#/components/schemas/Id
        email:
          type: string
          description: E-mail учётной записи. Для анонимизированной записи обезличенное значение
          maxLength: 254
        name:
          oneOf:
          - type: string
            description: Отображаемое имя
            maxLength: 200
          - type: 'null'
        role:
          $ref: components.yaml#/components/schemas/Role
        status:
          type: string
          description: Статус учётной записи
          enum:
          - active
          - deactivated
        phoneConfirmed:
          type: boolean
          description: Телефон подтверждён
        anonymized:
          type: boolean
          description: Персональные данные анонимизированы
        createdAt:
          $ref: components.yaml#/components/schemas/Timestamp
        deactivatedAt:
          oneOf:
          - $ref: components.yaml#/components/schemas/Timestamp
          - type: 'null'
      required:
      - userId
      - email
      - name
      - role
      - status
      - phoneConfirmed
      - anonymized
      - createdAt
      - deactivatedAt
    StaffUserPage:
      type: object
      description: Страница учётных записей, новые выше
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffUser'
        page:
          $ref: components.yaml#/components/schemas/PageInfo
      required:
      - items
      - page
    ChangeRoleRequest:
      type: object
      description: 'Новая роль. Роль `seller` вручную не назначается (U8): значение принимается только для того,
        чтобы вернуть 409 `role-managed-by-system`'
      properties:
        role:
          $ref: components.yaml#/components/schemas/Role
      required:
      - role
      additionalProperties: false
    PlatformParameter:
      type: object
      description: Параметр платформы R1. Новые значения получают новые заказы и действия, созданные ранее сохраняют
        прежние сроки (US-8.3)
      properties:
        key:
          type: string
          description: Ключ параметра, совпадает с ключом записи Kafka `platform.config`
          pattern: ^[a-z][a-z0-9.-]*$
          maxLength: 128
        description:
          type: string
          description: Назначение параметра
        unit:
          type: string
          description: Единица измерения значения
          enum:
          - seconds
          - count
          - basis_points
          - kopecks
          - text
          - flag
        value:
          type: integer
          description: Текущее значение
          minimum: 1
        defaultValue:
          type: integer
          description: Значение по умолчанию
          minimum: 1
        minValue:
          type: integer
          description: Нижняя граница допустимого значения
          minimum: 1
        maxValue:
          type: integer
          description: Верхняя граница допустимого значения
          minimum: 1
        version:
          type: integer
          description: Номер версии параметра, совпадает с ETag. Начальное значение это версия 1
          minimum: 1
        updatedAt:
          $ref: components.yaml#/components/schemas/Timestamp
        updatedBy:
          oneOf:
          - $ref: components.yaml#/components/schemas/Id
          - type: 'null'
      required:
      - key
      - description
      - unit
      - value
      - defaultValue
      - minValue
      - maxValue
      - version
      - updatedAt
      - updatedBy
    PlatformParameterList:
      type: object
      description: Все параметры R1, список короткий и без страниц
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlatformParameter'
      required:
      - items
    SetParameterRequest:
      type: object
      description: Новое значение параметра
      properties:
        value:
          type: integer
          description: 'Новое значение: положительное целое в границах параметра'
          minimum: 1
      required:
      - value
      additionalProperties: false
    AuditRecord:
      type: object
      description: 'Запись журнала аудита. Только добавляется (INV-42): персональных данных в открытом виде нет,
        только идентификаторы, имена полей и HMAC-хеши'
      properties:
        recordId:
          $ref: components.yaml#/components/schemas/Id
        occurredAt:
          $ref: components.yaml#/components/schemas/Timestamp
        actorId:
          $ref: components.yaml#/components/schemas/Id
        actorRole:
          type: string
          description: Роль исполнителя
          enum:
          - buyer
          - seller
          - moderator
          - support-operator
          - admin
          - system
        action:
          type: string
          description: Что сделано, например `parameter.changed`
          maxLength: 128
        objectType:
          type: string
          description: Тип объекта
          maxLength: 64
        objectId:
          type: string
          description: Идентификатор объекта
          maxLength: 128
        changes:
          type: array
          description: Изменённые поля
          items:
            type: object
            description: Изменение одного поля (ADR-014)
            properties:
              field:
                type: string
                description: Имя поля
                minLength: 1
                maxLength: 64
              personal:
                type: boolean
                description: '`true`, если поле персональное и значения переданы HMAC-хешем'
              before:
                oneOf:
                - type: string
                  description: Значение до изменения или хеш
                - type: 'null'
              after:
                oneOf:
                - type: string
                  description: Значение после изменения или хеш
                - type: 'null'
            required:
            - field
            - personal
            - before
            - after
        actorIp:
          type: string
          description: 'IP исполнителя: у сотрудника как есть, у пользователя HMAC-хеш'
          maxLength: 128
        actorIpHashed:
          type: boolean
          description: '`true`, если IP передан хешем'
        correlationId:
          $ref: components.yaml#/components/schemas/CorrelationId
      required:
      - recordId
      - occurredAt
      - actorId
      - actorRole
      - action
      - objectType
      - objectId
      - changes
      - actorIp
      - actorIpHashed
      - correlationId
    AuditRecordPage:
      type: object
      description: Страница записей, новые выше
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecord'
        page:
          $ref: components.yaml#/components/schemas/PageInfo
      required:
      - items
      - page
    IssueOtpRequest:
      type: object
      description: Запрос кода входа по SMS
      properties:
        purpose:
          type: string
          description: Назначение кода. Код для одного назначения к другому не подходит
          enum:
          - sms_login
        phone:
          type: string
          description: Номер телефона E.164, в R1 только +7
          pattern: ^\+7[0-9]{10}$
        clientIp:
          type: string
          description: IP клиента для лимита 10 запросов в час
          maxLength: 45
      required:
      - purpose
      - phone
      additionalProperties: false
    OtpIssueAccepted:
      type: object
      description: 'Нейтральный ответ: «если номер привязан, код отправлен». Для неизвестного номера и номера не
        покупателя SMS не отправляется, запрос учитывается в лимитах, время ответа выравнивается (ADR-010)'
      properties:
        accepted:
          type: boolean
          description: 'Всегда `true`: ответ одинаков для известного и неизвестного номера (U12)'
      required:
      - accepted
    VerifyOtpRequest:
      type: object
      description: Проверка кода входа по SMS
      properties:
        purpose:
          type: string
          description: Назначение кода
          enum:
          - sms_login
        phone:
          type: string
          description: Номер телефона E.164
          pattern: ^\+7[0-9]{10}$
        code:
          type: string
          description: Одноразовый код из 6 цифр
          pattern: ^[0-9]{6}$
      required:
      - purpose
      - phone
      - code
      additionalProperties: false
    OtpVerified:
      type: object
      description: Идентификатор учётной записи покупателя, по которому Keycloak выпускает токен сессии по SMS (`amr`
        равен `sms`, области только `orders.read` и `support.write`, 15 минут)
      properties:
        userId:
          $ref: components.yaml#/components/schemas/Id
      required:
      - userId
    MailProviderNotification:
      type: object
      description: Статус письма от e-mail-провайдера (письма без ключей)
      properties:
        messageId:
          type: string
          description: Идентификатор письма у провайдера
          minLength: 1
          maxLength: 128
        status:
          type: string
          description: Статус письма. Перечисление открытое
          enum:
          - accepted
          - delivered
          - failed
        occurredAt:
          $ref: components.yaml#/components/schemas/Timestamp
        reason:
          type: string
          description: Причина отказа, для `failed`
          enum:
          - address_rejected
          - other
      required:
      - messageId
      - status
      - occurredAt
      additionalProperties: false
    SmsProviderNotification:
      type: object
      description: Статус SMS от SMS-провайдера
      properties:
        messageId:
          type: string
          description: Идентификатор SMS у провайдера
          minLength: 1
          maxLength: 128
        status:
          type: string
          description: Статус SMS. Перечисление открытое
          enum:
          - delivered
          - failed
        occurredAt:
          $ref: components.yaml#/components/schemas/Timestamp
      required:
      - messageId
      - status
      - occurredAt
      additionalProperties: false
