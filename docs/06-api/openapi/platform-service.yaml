openapi: 3.1.0
info:
  title: 'Digital Goods Marketplace: служебный сервис'
  version: 1.0.0
  description: |-
    REST API служебного сервиса (модули `identity`, `support`, `notification`, `audit_admin`). Подтверждение телефона и коды для Keycloak, обращения покупателей и очередь оператора, смена e-mail по обращению, управление ролями и учётными записями, параметры платформы, чтение журнала аудита, вебхуки провайдеров писем и SMS.

    Вход, пароли, второй фактор и токены обслуживает Keycloak, а не этот сервис (ADR-010). Сервис отвечает за коды подтверждения (хранятся в Redis хешем), их попытки и лимиты, этапы смены e-mail и номера.
  license:
    name: Учебный проект, лицензия не задана
    identifier: NOASSERTION
servers:
- url: https://api.marketplace.example
  description: Публичный адрес `api-gateway`. На демо-стенде адрес задаёт конфигурация развёртывания
tags:
- name: Телефон
  description: Подтверждение телефона покупателя кодом из SMS (область `account.manage`, нет у сессий по SMS)
- name: Обращения покупателя
  description: Обращение «Не получил ключ» и ввод кодов смены e-mail (область `support.write`)
- name: Обращения оператора
  description: Очередь, взятие в работу, повторная отправка, смена e-mail (область `staff.support`, 2FA)
- name: Пользователи
  description: Роли, деактивация и анонимизация учётных записей (область `staff.admin`, 2FA)
- name: Параметры
  description: Параметры платформы без выпуска новой версии (область `staff.admin`, 2FA)
- name: Журнал аудита
  description: Чтение журнала аудита (область `staff.audit`, 2FA)
- name: Коды для Keycloak
  description: Внутренние вызовы расширения `sms-otp` по mTLS
- name: Вебхуки провайдеров
  description: Статусы писем и SMS от провайдеров без токена, подпись проверяет сервис
security: []
paths:
  /api/v1/phone-confirmations:
    post:
      operationId: createPhoneConfirmation
      summary: Запросить код подтверждения телефона
      description: |-
        Проверяет номер на уникальность и отправляет SMS с кодом. Номер уже привязан к другой учётной записи: SMS не уходит, ответ 409 `phone-not-allowed` без указания причины (FT-1.5, US-1.6). Лимиты запросов кода: 3 за 10 минут и 10 за сутки на учётную запись и на номер (параметры платформы), иначе 429 `otp-request-limited` с `Retry-After`. Если Redis недоступен, отправка запрещена (503). Нужна полная сессия: сессия по SMS эту область не получает.

        Матрица прав: OP-06. Истории: US-1.6.
      tags:
      - Телефон
      x-matrix-id: OP-06
      x-stories:
      - US-1.6
      x-allowed-roles:
      - buyer
      x-conditions: []
      x-sms-session: denied
      security:
      - bearerJwt:
        - account.manage
      parameters:
      - $ref: components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePhoneConfirmationRequest'
            example:
              phone: '+79001234567'
      responses:
        '201':
          description: Код отправлен
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
            Location:
              $ref: components.yaml#/components/headers/Location
            Idempotency-Replayed:
              $ref: components.yaml#/components/headers/IdempotencyReplayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneConfirmation'
              example:
                confirmationId: 0199e0a0-0000-7000-8000-000000000a01
                phoneMasked: +7900***4567
                expiresAt: '2026-10-03T12:15:00.123Z'
                attemptsLeft: 5
                resendAvailableAt: '2026-10-03T12:00:00.123Z'
        '400':
          $ref: components.yaml#/components/responses/E400BadRequestIdempotencyKeyRequired
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403ForbiddenFullLoginRequired
        '409':
          $ref: components.yaml#/components/responses/E409StateConflictRequestInProgressPhoneNotAllowed
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailedIdempotencyKeyReuse
        '429':
          $ref: components.yaml#/components/responses/E429RateLimitedOtpRequestLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
        '503':
          $ref: components.yaml#/components/responses/E503DependencyUnavailable
        '504':
          $ref: components.yaml#/components/responses/E504GatewayTimeout
  /api/v1/phone-confirmations/{confirmationId}/verify:
    post:
      operationId: verifyPhoneConfirmation
      summary: Ввести код подтверждения телефона
      description: |-
        Проверяет код и гасит его атомарно (скрипт Lua). Неверный код даёт 422 `otp-invalid` с `attemptsLeft`, устаревший 422 `otp-expired`, после пятой неудачи 429 `otp-locked`. Успех записывает номер и признак подтверждения, уникальный индекс гасит гонку двух учётных записей (409 `phone-not-allowed`). Публикуется `user.phone-confirmed`.

        Матрица прав: OP-06. Истории: US-1.6.
      tags:
      - Телефон
      x-matrix-id: OP-06
      x-stories:
      - US-1.6
      x-allowed-roles:
      - buyer
      x-conditions: []
      x-sms-session: denied
      security:
      - bearerJwt:
        - account.manage
      parameters:
      - name: confirmationId
        in: path
        required: true
        description: Идентификатор запроса подтверждения
        schema:
          $ref: components.yaml#/components/schemas/Id
        example: 0199e0a0-0000-7000-8000-000000000a01
      - $ref: components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Телефон подтверждён
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
            Idempotency-Replayed:
              $ref: components.yaml#/components/headers/IdempotencyReplayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneConfirmed'
              example:
                phoneConfirmed: true
                phoneMasked: +7900***4567
        '400':
          $ref: components.yaml#/components/responses/E400BadRequestIdempotencyKeyRequired
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403ForbiddenFullLoginRequired
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '409':
          $ref: components.yaml#/components/responses/E409RequestInProgressPhoneNotAllowed
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailedIdempotencyKeyReuseOtpInvalidOtpExpired
        '429':
          $ref: components.yaml#/components/responses/E429RateLimitedOtpLocked
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /api/v1/support-tickets:
    post:
      operationId: createSupportTicket
      summary: Создать обращение «Не получил ключ»
      description: |-
        Создаёт обращение в статусе `created` с источником `buyer` (SM-07, T1), оно встаёт в очередь поддержки. Условия: заказ принадлежит покупателю (U1, иначе 404), заказ в статусе `issued` (иначе 409 `state-conflict`), с первичной выдачи прошло не больше 72 часов (параметр `support.window-seconds`, U5, иначе 409 `ticket-window-closed`; повторная отправка окно не продлевает), по заказу нет открытого обращения (INV-21, иначе 409 `ticket-already-open`). Доступна и сессии по SMS: так покупатель, потерявший доступ к e-mail, обращается в поддержку (US-1.7).

        Матрица прав: OP-70. Истории: US-7.1.
      tags:
      - Обращения покупателя
      x-matrix-id: OP-70
      x-stories:
      - US-7.1
      x-allowed-roles:
      - buyer
      - system
      x-conditions:
      - U1
      - U5
      - U18
      x-sms-session: allowed
      security:
      - bearerJwt:
        - support.write
      parameters:
      - $ref: components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupportTicketRequest'
            example:
              orderId: 0199e0a0-0000-7000-8000-000000000301
              reason: key_not_received
      responses:
        '201':
          description: Обращение принято
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
            Location:
              $ref: components.yaml#/components/headers/Location
            Idempotency-Replayed:
              $ref: components.yaml#/components/headers/IdempotencyReplayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
              example:
                ticketId: 0199e0a0-0000-7000-8000-000000000501
                orderId: 0199e0a0-0000-7000-8000-000000000301
                source: buyer
                reason: key_not_received
                status: created
                createdAt: '2026-10-03T12:00:00.123Z'
                resolvedAt: null
                resolution: null
                emailChange: null
        '400':
          $ref: components.yaml#/components/responses/E400BadRequestIdempotencyKeyRequired
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403Forbidden
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '409':
          $ref: components.yaml#/components/responses/E409StateConflictRequestInProgressTicketWindowClosedTicketAlreadyOpen
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailedIdempotencyKeyReuse
        '429':
          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
    get:
      operationId: listSupportTickets
      summary: Свои обращения
      description: |-
        Обращения текущего покупателя, новые выше. Фильтр `orderId` показывает обращение по заказу, `status` принимает несколько значений через запятую.

        Матрица прав: OP-70. Истории: US-7.1.
      tags:
      - Обращения покупателя
      x-matrix-id: OP-70
      x-stories:
      - US-7.1
      x-allowed-roles:
      - buyer
      - system
      x-conditions:
      - U1
      - U5
      - U18
      x-sms-session: allowed
      security:
      - bearerJwt:
        - support.write
      parameters:
      - name: orderId
        in: query
        required: false
        description: Заказ
        schema:
          $ref: components.yaml#/components/schemas/Id
        example: 0199e0a0-0000-7000-8000-000000000301
      - name: status
        in: query
        required: false
        description: Статусы через запятую
        schema:
          type: string
          pattern: ^[a-z_]+(,[a-z_]+)*$
        example: created,in_progress
      - $ref: components.yaml#/components/parameters/Limit
      - $ref: components.yaml#/components/parameters/Cursor
      responses:
        '200':
          description: Страница обращений
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketPage'
              example:
                items:
                - ticketId: 0199e0a0-0000-7000-8000-000000000501
                  orderId: 0199e0a0-0000-7000-8000-000000000301
                  source: buyer
                  reason: key_not_received
                  status: created
                  createdAt: '2026-10-03T12:00:00.123Z'
                  resolvedAt: null
                  resolution: null
                  emailChange: null
                page:
                  limit: 20
                  nextCursor: null
        '400':
          $ref: components.yaml#/components/responses/E400BadRequest
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403Forbidden
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailed
        '429':
          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /api/v1/support-tickets/{ticketId}:
    get:
      operationId: getSupportTicket
      summary: Статус своего обращения
      description: |-
        Обращение со статусом и состоянием смены e-mail. Чужое обращение даёт 404 (U1).

        Матрица прав: OP-70. Истории: US-7.1.
      tags:
      - Обращения покупателя
      x-matrix-id: OP-70
      x-stories:
      - US-7.1
      x-allowed-roles:
      - buyer
      - system
      x-conditions:
      - U1
      - U5
      - U18
      x-sms-session: allowed
      security:
      - bearerJwt:
        - support.write
      parameters:
      - name: ticketId
        in: path
        required: true
        description: Идентификатор обращения
        schema:
          $ref: components.yaml#/components/schemas/Id
        example: 0199e0a0-0000-7000-8000-000000000501
      responses:
        '200':
          description: Обращение
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
              example:
                ticketId: 0199e0a0-0000-7000-8000-000000000501
                orderId: 0199e0a0-0000-7000-8000-000000000301
                source: buyer
                reason: key_not_received
                status: created
                createdAt: '2026-10-03T12:00:00.123Z'
                resolvedAt: null
                resolution: null
                emailChange: null
        '400':
          $ref: components.yaml#/components/responses/E400BadRequest
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403Forbidden
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '429':
          $ref: components.yaml#/components/responses/E429RateLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
  /api/v1/support-tickets/{ticketId}/email-change/codes:
    post:
      operationId: requestEmailChangeCode
      summary: Запросить новый код смены e-mail
      description: |-
        Покупатель просит повторно отправить код на этапе смены e-mail: `phone` повторяет SMS на подтверждённый телефон, `new_email` повторяет письмо на новый адрес. Лимиты 3 за 10 минут и 10 за сутки, иначе 429 `otp-request-limited` (US-7.4, сценарий 3). Новый код гасит прежний.

        Матрица прав: OP-74. Истории: US-7.4.
      tags:
      - Обращения покупателя
      x-matrix-id: OP-74
      x-stories:
      - US-7.4
      x-allowed-roles:
      - buyer
      x-conditions:
      - U1
      x-sms-session: allowed
      security:
      - bearerJwt:
        - support.write
      parameters:
      - name: ticketId
        in: path
        required: true
        description: Идентификатор обращения
        schema:
          $ref: components.yaml#/components/schemas/Id
        example: 0199e0a0-0000-7000-8000-000000000501
      - $ref: components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestEmailChangeCodeRequest'
            example:
              step: phone
      responses:
        '200':
          description: Код отправлен
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
            Idempotency-Replayed:
              $ref: components.yaml#/components/headers/IdempotencyReplayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeState'
              example:
                status: awaiting_phone_code
                phoneCheck: pending
                newEmailCheck: not_started
                newEmailMasked: n***@mail.example
                startedAt: '2026-10-03T12:00:00.123Z'
                updatedAt: '2026-10-03T12:00:00.123Z'
        '400':
          $ref: components.yaml#/components/responses/E400BadRequestIdempotencyKeyRequired
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403Forbidden
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '409':
          $ref: components.yaml#/components/responses/E409StateConflictRequestInProgress
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailedIdempotencyKeyReuse
        '429':
          $ref: components.yaml#/components/responses/E429RateLimitedOtpRequestLimited
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
        '503':
          $ref: components.yaml#/components/responses/E503DependencyUnavailable
        '504':
          $ref: components.yaml#/components/responses/E504GatewayTimeout
  /api/v1/support-tickets/{ticketId}/email-change/verifications:
    post:
      operationId: verifyEmailChangeCode
      summary: Ввести код смены e-mail
      description: |-
        Покупатель сам вводит коды: сначала из SMS (`phone`), затем из письма на новый адрес (`new_email`). После второго успеха e-mail учётной записи меняется в Keycloak (Admin REST), публикуется `user.email-changed`, письма о смене уходят на новый и на прежний адрес, ключ отправляется повторно (US-7.4). Неверный код: 422 `otp-invalid` с `attemptsLeft`, устаревший 422 `otp-expired`, после пятой неудачи 429 `otp-locked`: e-mail не меняется, обращение остаётся в работе. Порядок этапов нарушен или смена не начата: 409. Нужен только `support.write`, поэтому доступно из сессии по SMS.

        Матрица прав: OP-74. Истории: US-7.4.
      tags:
      - Обращения покупателя
      x-matrix-id: OP-74
      x-stories:
      - US-7.4
      x-allowed-roles:
      - buyer
      x-conditions:
      - U1
      x-sms-session: allowed
      security:
      - bearerJwt:
        - support.write
      parameters:
      - name: ticketId
        in: path
        required: true
        description: Идентификатор обращения
        schema:
          $ref: components.yaml#/components/schemas/Id
        example: 0199e0a0-0000-7000-8000-000000000501
      - $ref: components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailChangeCodeRequest'
            example:
              step: phone
              code: '123456'
      responses:
        '200':
          description: Результат проверки
          headers:
            X-Correlation-Id:
              $ref: components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: components.yaml#/components/headers/CacheControlNoStore
            Idempotency-Replayed:
              $ref: components.yaml#/components/headers/IdempotencyReplayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeState'
              example:
                status: awaiting_email_code
                phoneCheck: passed
                newEmailCheck: pending
                newEmailMasked: n***@mail.example
                startedAt: '2026-10-03T11:00:00.456Z'
                updatedAt: '2026-10-03T12:00:00.123Z'
        '400':
          $ref: components.yaml#/components/responses/E400BadRequestIdempotencyKeyRequired
        '401':
          $ref: components.yaml#/components/responses/E401Unauthenticated
        '403':
          $ref: components.yaml#/components/responses/E403Forbidden
        '404':
          $ref: components.yaml#/components/responses/E404NotFound
        '409':
          $ref: components.yaml#/components/responses/E409StateConflictRequestInProgressEmailNotAllowed
        '415':
          $ref: components.yaml#/components/responses/E415UnsupportedMediaType
        '422':
          $ref: components.yaml#/components/responses/E422ValidationFailedIdempotencyKeyReuseOtpInvalidOtpExpired
        '429':
          $ref: components.yaml#/components/responses/E429RateLimitedOtpLocked
        '500':
          $ref: components.yaml#/components/responses/E500InternalError
        '503':
          $ref: components.yaml#/components/responses/E503DependencyUnavailable
        '504':
          $ref: components.yaml#/components/responses/E504GatewayTimeout
  /api/v1/staff/support-tickets:
    get:
      operationId: listSupportTicketQueue
      summary: Очередь обращений оператора
      description: |-
        Общая очередь двух источников (покупатель и система): обращения в статусе `created`, старые выше. Фильтр `status` принимает `created`, `in_progress` (свои обращения оператор находит по `operatorId`). Значений ключей в очереди нет. Число обращений в статусах `created` и `in_progress` совпадает с метрикой очереди (US-7.2, сценарий 5).

        Матрица прав: OP-71. Истории: US-7.2.
      tags:
      - Обращения оператора
      x-matrix-id: OP-71
      x-stories:
      - US-7.2
      x-allowed-roles:
      - support-operator
      x-conditions:
      - U4
      x-sms-session: denied
      security:
      - bearerJwt:
