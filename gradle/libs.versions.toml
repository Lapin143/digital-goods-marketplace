# Каталог версий: единственное место, где задаются версии библиотек и плагинов Gradle.
# Библиотеки Spring получают версии из BOM (spring-boot-dependencies, spring-cloud-dependencies), явно здесь
# заданы только версии BOM и библиотек, которых в BOM нет. Решение: docs/05-architecture/adr/ADR-023-build-and-stack.md.
# Таблица версий всего стека: docs/09-operations/versions.md.

[versions]
spring-boot = "4.1.1"
spring-cloud = "2025.1.3"
archunit = "1.5.1"
# Покрытие кода (шаг 4 Ф4): 0.8.14 понимает файлы классов Java 25. Порог пока не блокирует сборку, замер в шаге 20.
jacoco = "0.8.14"
# Нижняя граница версии Tomcat: BOM Spring Boot 4.1.1 приносит 11.0.24, в ней найдены CVE-2026-65182 (обход ограничений доступа, CRITICAL) и ещё
# уязвимости HIGH, исправлены в 11.0.25 (Trivy, шаг 17 Ф3). Ограничение в dgm.boot-app-conventions можно убрать, когда BOM принесёт 11.0.25 или выше.
tomcat-security-floor = "11.0.25"
# Нижняя граница версии Jackson 3: BOM Spring Boot 4.1.1 приносит 3.1.5 с пятью уязвимостями HIGH (CVE-2026-89407, -89425, -91776, -91777, -68497),
# исправлены в 3.1.7 (Trivy, шаг 17 Ф3); 6 октября 2026 года граница поднята до 3.2.3 по запросу Dependabot после зелёного CI.
# Платформа подключается в dgm.boot-app-conventions; убрать, когда BOM Spring Boot принесёт эту версию или выше.
jackson-security-floor = "3.2.3"
# Нижняя граница версии lz4-java (приходит транзитивно с клиентом Kafka): версия 1.10.1 из BOM Spring Boot 4.1.1 попала под CVE-2026-106451 (HIGH), исправлено
# в 1.11.4 (Trivy нашёл её 11 октября 2026 года в образах шести сервисов, находка F4-1). Ограничение в dgm.boot-app-conventions убрать, когда BOM принесёт эту версию или выше.
lz4-security-floor = "1.11.4"

[libraries]
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson-security-floor" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
