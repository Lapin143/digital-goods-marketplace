# Автоматические запросы на обновление зависимостей (шаг 17 Ф3, цепочка поставок).
#
# Версии записаны в docs/09-operations/versions.md, а проверки docs сверяют с ним compose.yaml, Dockerfile и сборку Gradle. Поэтому запрос
# Dependabot без правки versions.md краснеет в задании docs: это защита, а не поломка. Запрос разбирается вручную: версия вносится в таблицу
# versions.md, затем CI проверяет остальное (теги образов в реестрах, сборка, тесты, стенд).
version: 2
updates:
  # Действия GitHub закреплены по хешу коммита: Dependabot обновляет хеш и комментарий с версией вместе
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    labels: [dependencies, ci]

  # Библиотеки сервисов: каталог версий gradle/libs.versions.toml и плагины сборки
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build"
    labels: [dependencies, java]

  # Базовые образы Dockerfile (docker/Dockerfile.*)
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build"
    labels: [dependencies, docker]

  # Образы сторонних контейнеров в compose.yaml (PostgreSQL, Redis, Kafka, Prometheus, Grafana и другие)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build"
    labels: [dependencies, docker]
    # Основную версию меняют отдельным решением (docs/09-operations/versions.md, раздел 5), поэтому такие запросы не нужны:
    #  - PostgreSQL: DDL Ф2 и проверки Ф3 выполнены на 16.15; другая основная версия требует повторной проверки DDL, сортировки и миграции тома
    #  - Tempo: версия 3 с новой архитектурой приёма данных на очереди для одного узла избыточна, одноузловой режим 3.x не проверялся
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: grafana/tempo
        update-types: ["version-update:semver-major"]
