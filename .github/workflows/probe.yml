name: probe
on:
  push:
    branches: ['probe/**']
permissions:
  contents: read
jobs:
  jars:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Сигнатуры классов
        run: bash tools/ci/probe_jars.sh 1
      - name: Классы и автонастройка
        run: bash tools/ci/probe_jars.sh 2
      - name: Ключи настроек
        run: bash tools/ci/probe_jars.sh 3
