name: ci

# Запуск: каждый push в main и в ветки ci/*, pull request в main, ручной запуск.
# Ветка ci/sandbox нужна для отладки CI: итерации идут в ней, а main остаётся зелёным (tools/ci/README.md).
on:
  push:
    branches: [main, 'ci/**', '!ci/wrapper']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  TRIVY_VERSION: 0.74.0
  MERMAID_CLI_VERSION: 11.16.0

jobs:
  # Проверки документов и контрактов Ф1–Ф2 и физической модели БД на настоящем PostgreSQL 16.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Зависимости Python
        run: tools/ci/diag.sh "Зависимости Python" python3 -m pip install --break-system-packages --user -r tools/docs-checks/requirements.txt

      - name: Mermaid CLI (проверка отрисовки диаграмм)
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: |
          tools/ci/diag.sh "Установка Mermaid CLI" sudo env PUPPETEER_SKIP_DOWNLOAD=1 npm install -g "@mermaid-js/mermaid-cli@${MERMAID_CLI_VERSION}"
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "Chrome: $chrome"
          printf '{"executablePath": "%s", "args": ["--no-sandbox", "--disable-setuid-sandbox"]}\n' "$chrome" > "$RUNNER_TEMP/puppeteer.json"
          echo "MMDC_PUPPETEER_CONFIG=$RUNNER_TEMP/puppeteer.json" >> "$GITHUB_ENV"

      - name: PostgreSQL 16 для проверок модели данных
        run: |
          PGBIN=/usr/lib/postgresql/16/bin
          if [ ! -x "$PGBIN/initdb" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16
          fi
          D="$RUNNER_TEMP/pg16data"
          "$PGBIN/initdb" -D "$D" -U postgres --auth=trust -E UTF8 >/dev/null
          "$PGBIN/pg_ctl" -D "$D" -o "-p 5433 -k /tmp -c listen_addresses= -c fsync=off" -l "$RUNNER_TEMP/pg16.log" -w start
          echo "$PGBIN" >> "$GITHUB_PATH"

      - name: Проверки документов, контрактов и модели данных
        env:
          DIAG_TAIL: "40"
        run: tools/ci/diag.sh "Проверки документов" bash tools/docs-checks/run_all.sh --db

      # Хеш каждого действия сверяется с тегом из комментария: комментарий версии не может врать (цепочка поставок)
      - name: Закрепление действий по хешу коммита
        run: tools/ci/diag.sh "Закрепление действий" python3 tools/docs-checks/check_workflows.py --online

      - name: Самопроверка контролей
        run: tools/ci/selftest.sh docs

  # Сборка Gradle, модульные тесты и архитектурные правила, образы сервисов. Интеграционные тесты каркаса и сервисов идут на стенде (задание kit).
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Проверка jar wrapper по официальной контрольной сумме
        run: |
          set -euo pipefail
          ver=$(sed -n 's/.*gradle-\(.*\)-bin\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties)
          want=$(curl -sSfL "https://services.gradle.org/distributions/gradle-${ver}-wrapper.jar.sha256")
          have=$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)
          echo "Gradle $ver, jar wrapper: $have"
          [ "$want" = "$have" ] || { echo "::error title=Gradle wrapper::контрольная сумма jar не совпала с официальной"; exit 1; }

      - name: Сборка и модульные тесты
        env:
          DIAG_FILTER: 'FAILED|error:|warning:|What went wrong|Could not|BUILD FAILED|Caused by|AssertionFailedError|Exception'
          DIAG_MAX: "40"
        run: tools/ci/diag.sh "Gradle build" ./gradlew --console=plain build

      - name: Сводка тестов
        run: python3 tools/ci/test_summary.py

      - name: Образы сервисов
        run: tools/ci/diag.sh "Сборка образов" make docker-images

      - name: Проверка образов (пользователь без прав, Java 25, только чтение; здоровье сервисов и шлюза проверяет стенд)
        run: |
          for s in catalog-service inventory-service order-service payment-service delivery-service platform-service api-gateway; do
            tools/ci/diag.sh "Образ $s" tools/ci/check-image.sh "dgm/$s:dev" 8443 static
          done

  # Каркас сервисов и сервисы (шаги 11 и 12 Ф3): интеграционные тесты на настоящих PostgreSQL и Kafka стенда: Outbox и потребитель событий каркаса,
  # затем сервисы каталога и заказов целиком (миграции с тестовыми данными, mTLS, токены, ограничение по владельцу).
  # Модульные тесты и архитектурные правила каркаса выполняет задание build. Стенд поднят набором dev-min с отладочными портами,
  # тесты подключаются к 127.0.0.1:15432 и 127.0.0.1:19093 по TLS с клиентским сертификатом сервиса, Docker на стенде у них не нужен.
  kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Версии Docker
        run: docker version --format 'Docker {{.Server.Version}}' && docker compose version

      - name: Подъём набора dev-min с отладочными портами
        env:
          DIAG_TAIL: "70"
        run: tools/ci/diag.sh "make up SET=dev-min DEBUG=1" make up SET=dev-min DEBUG=1

      - name: Миграции order-service и inventory-service
        run: tools/ci/diag.sh "Миграции для тестов каркаса" make db-migrate S="order-service inventory-service"

      - name: Интеграционные тесты каркаса и сервисов
        env:
          DGM_SECRETS_DIR: ${{ github.workspace }}/secrets
          DIAG_FILTER: 'FAILED|error:|warning:|What went wrong|Could not|BUILD FAILED|Caused by|AssertionFailedError|Exception'
          DIAG_MAX: "40"
        run: |
          tools/ci/diag.sh "Интеграционные тесты каркаса и сервисов" ./gradlew --console=plain --continue \
            :libs:service-kit:integrationTest :services:catalog-service:integrationTest :services:order-service:integrationTest

      - name: Зависимости Python
        run: tools/ci/diag.sh "Зависимости Python" python3 -m pip install --break-system-packages --user -r tools/docs-checks/requirements.txt

      - name: Контракт сервисов с OpenAPI
        run: tools/ci/diag.sh "Контракт сервисов с OpenAPI" python3 tools/stand-checks/check_contract.py

      - name: Сводка тестов
        if: always()
        run: python3 tools/ci/test_summary.py . "Интеграционные тесты каркаса и сервисов"

      - name: Журналы контейнеров при ошибке
        if: failure()
        run: |
          for s in postgres kafka; do
            echo "::group::$s"; docker compose --profile '*' logs --no-color --tail 40 "$s" || true; echo "::endgroup::"
            msg=$(docker compose --profile '*' logs --no-color --tail 12 "$s" 2>&1 | cut -c1-240 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning title=журнал $s::$msg"
          done

  # Контейнеры сервисов (шаг 12 Ф3): образы собираются из jar, сервисы стартуют на стенде в Compose с настоящими секретами, mTLS, лимитами
  # памяти и файловой системой только для чтения, миграции применяются при старте. Здесь проверяется то, что не видно из интеграционных
  # тестов в процессе Gradle: пользователь без прав, tmpfs, память, журнал JSON, порты.
  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Версии Docker
        run: docker version --format 'Docker {{.Server.Version}}' && docker compose version

      - name: Набор dev-purchase (сборка образов, пять сервисов)
        env:
          DIAG_TAIL: "70"
        run: tools/ci/diag.sh "make up SET=dev-purchase" make up SET=dev-purchase

      - name: Профиль platform (служебный сервис)
        env:
          DIAG_TAIL: "70"
        run: tools/ci/diag.sh "make up SET=dev-platform" make up SET=dev-platform

      - name: Проверка контейнеров сервисов
        env:
          DIAG_TAIL: "70"
        run: tools/ci/diag.sh "Проверка сервисов" make services-check

      - name: Состояние и память контейнеров
        if: always()
        run: |
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}' || true
          free -m | head -n 2
          # те же цифры заметкой задания: журнал запуска без входа в аккаунт недоступен, заметки читаются через API (замеры для бюджета памяти)
          msg=$(docker stats --no-stream --format '{{.Name}} {{.MemUsage}} ({{.MemPerc}})' 2>&1 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=память контейнеров::$msg"

      - name: Журналы сервисов при ошибке
        if: failure()
        run: |
          for s in catalog-service inventory-service order-service payment-service delivery-service platform-service; do
            echo "::group::$s"; docker compose --profile '*' logs --no-color --tail 40 "$s" || true; echo "::endgroup::"
            msg=$(docker compose --profile '*' logs --no-color --tail 12 "$s" 2>&1 | cut -c1-240 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning title=журнал $s::$msg"
          done

  # Шлюз (шаг 13 Ф3): единая точка входа на стенде с настоящими Keycloak, Redis и сервисами покупки. Проверяются маршруты и ошибки Problem,
  # подделки токенов (ST-03), области и второй фактор, размеры тел, лимиты частоты на Redis, вход через шлюз, порт управления по mTLS,
  # отказ открытым при остановке Redis и возврат лимитов после его запуска (gateway_checks.sh). Там же веб-интерфейс (шаг 14 Ф3):
  # контейнер web-app входит в профиль gateway, страницу получает только шлюз (webapp_checks.sh).
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Версии Docker
        run: docker version --format 'Docker {{.Server.Version}}' && docker compose version

      # Замеры памяти (шаг 18): docker stats раз в 3 секунды от запуска стенда до последней проверки, итог «пик против лимита» в конце задания
      - name: Замеры памяти, начало
        run: python3 tools/stand-checks/memory.py start "$RUNNER_TEMP/mem.jsonl"

      - name: Набор dev-auth (Keycloak и шлюз), отладочные порты
        env:
          DIAG_FILTER: 'ERROR:|failed to|not found|denied|unhealthy|dependency failed|COPY'
          DIAG_MAX: "12"
          DIAG_TAIL: "40"
        run: tools/ci/diag.sh "make up SET=dev-auth" make up SET=dev-auth DEBUG=1

      - name: Сервисы покупки за шлюзом
        env:
          DIAG_FILTER: 'ERROR:|failed to|not found|denied|unhealthy|dependency failed|COPY'
          DIAG_MAX: "12"
          DIAG_TAIL: "40"
        run: tools/ci/diag.sh "make up SET=dev-purchase" make up SET=dev-purchase DEBUG=1

      - name: Тестовые пользователи Keycloak
        run: tools/ci/diag.sh "Тестовые пользователи" make keycloak-users

      - name: Проверка шлюза
        env:
          DIAG_TAIL: "80"
          DIAG_MAX: "60"
        run: tools/ci/diag.sh "Проверка шлюза" make gateway-check

      - name: Проверка веб-интерфейса
        env:
          DIAG_TAIL: "60"
          DIAG_MAX: "40"
        run: tools/ci/diag.sh "Проверка веб-интерфейса" make web-check

      # NFT-1.3: два экземпляра order-service и catalog-service, второй order-service перезапускается посреди серии запросов
      - name: NFT-1.3, два экземпляра сервисов
        env:
          DIAG_FILTER: '^  - |ОШИБКА|^ +[|] '
          DIAG_TAIL: "50"
          DIAG_MAX: "30"
        run: tools/ci/diag.sh "NFT-1.3 два экземпляра" make stateless-check

      - name: Состояние и память контейнеров
        if: always()
        run: |
          python3 tools/stand-checks/memory.py stop "$RUNNER_TEMP/mem.jsonl" --label "шлюз и сервисы покупки, два экземпляра на время NFT-1.3" || true
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}' || true
          msg=$(docker stats --no-stream --format '{{.Name}} {{.MemUsage}} ({{.MemPerc}})' 2>&1 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=память контейнеров (шлюз)::$msg"

      - name: Диагностика шлюза и Redis при ошибке
        if: failure()
        run: tools/ci/diag-gateway.sh

      - name: Журналы шлюза при ошибке
        if: failure()
        run: |
          for s in api-gateway web-app keycloak; do
            echo "::group::$s"; docker compose --profile '*' logs --no-color --tail 60 "$s" || true; echo "::endgroup::"
            msg=$(docker compose --profile '*' logs --no-color --tail 25 "$s" 2>&1 | cut -c1-300 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning title=журнал $s::$msg"
          done

  # Образы стенда: теги из versions.md и базовый образ Java существуют в реестрах (versions.md, правило 6).
  # Стенд целиком (шаг 15 Ф3): «всё поднимается одной командой». Набор full (все профили R1, 16 контейнеров) поднимает make up, затем проверяются
  # состав и готовность, порты, сети, секреты и память (stand_checks.py up), а остановка оставляет чистое состояние: make down сохраняет тома,
  # make reset убирает всё (stand_checks.py down).
  stand:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Версии Docker
        run: docker version --format 'Docker {{.Server.Version}}' && docker compose version

      - name: Замеры памяти, начало
        run: python3 tools/stand-checks/memory.py start "$RUNNER_TEMP/mem.jsonl"

      - name: Набор full-obs одной командой
        env:
          DIAG_FILTER: 'ERROR:|failed to|not found|denied|unhealthy|dependency failed|COPY|не готов|ОШИБКА'
          DIAG_MAX: "14"
          DIAG_TAIL: "40"
        run: tools/ci/diag.sh "make up SET=full-obs" make up SET=full-obs DEBUG=1 WAIT_TIMEOUT=600

      - name: Проверка стенда целиком
        env:
          DIAG_FILTER: '^  - |ОШИБКА|^ +[|] '
          DIAG_MAX: "30"
        run: tools/ci/diag.sh "Проверка стенда" make stand-check SET=full-obs DEBUG=1

      - name: Проверка стека наблюдения
        env:
          DIAG_FILTER: '^  - |ОШИБКА|^ +[|] '
          DIAG_MAX: "40"
          DIAG_TAIL: "50"
        run: tools/ci/diag.sh "Проверка наблюдаемости" make obs-check DEBUG=1

      - name: Тестовые пользователи Keycloak
        run: tools/ci/diag.sh "Тестовые пользователи" make keycloak-users

      # Дымовой тест: вход, операции через шлюз, ST-03, mTLS, Outbox → Kafka, сквозной идентификатор в журналах и в Loki
      - name: Дымовой тест
        env:
          DIAG_FILTER: '^  - |ОШИБКА|^ +[|] '
          DIAG_TAIL: "60"
          DIAG_MAX: "40"
        run: tools/ci/diag.sh "Дымовой тест" make smoke

      # Проверка проверки: испорченный токен, область и сертификат вызывающего обязаны сделать дымовой тест красным
      - name: Дымовой тест краснеет от порчи токена, области и сертификата
        env:
          DIAG_FILTER: '^  - |ОШИБКА|^ +[|] '
          DIAG_TAIL: "40"
          DIAG_MAX: "20"
        run: tools/ci/diag.sh "Проверка проверки дымового теста" make smoke-sabotage

      # Короткая нагрузка (60 с): сервисы за работой, чтобы замер памяти видел заполненные пулы и сборки мусора, а не пустой стенд
      - name: Короткая нагрузка на сервисы
        env:
          DIAG_FILTER: '^  - |ОШИБКА|^ +[|] '
          DIAG_TAIL: "30"
          DIAG_MAX: "20"
        run: tools/ci/diag.sh "Короткая нагрузка" make load

      - name: Состояние и память контейнеров
        if: always()
        run: |
          python3 tools/stand-checks/memory.py stop "$RUNNER_TEMP/mem.jsonl" --label "набор full-obs" || true
          docker compose --profile '*' ps -a || true
          msg=$(docker stats --no-stream --format '{{.Name}} {{.MemUsage}} ({{.MemPerc}})' 2>&1 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=память контейнеров (набор full-obs)::$msg"

      - name: Журналы при ошибке
        if: failure()
        run: |
          for s in $(docker compose --profile '*' ps -a --format '{{.Service}}'); do
            st=$(docker compose --profile '*' ps -a --format '{{.Service}} {{.State}} {{.Health}}' | grep "^$s " | head -n1)
            case "$st" in *"running healthy"*|*"exited"*) continue;; esac
            echo "::group::$s ($st)"; docker compose --profile '*' logs --no-color --tail 40 "$s" || true; echo "::endgroup::"
            msg=$(docker compose --profile '*' logs --no-color --tail 12 "$s" 2>&1 | cut -c1-240 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning title=журнал $s ($st)::$msg"
          done

      - name: Диагностика стека наблюдения при ошибке
        if: failure()
        run: tools/ci/diag-obs.sh

      - name: Остановка и чистое состояние
        if: always()
        env:
          DIAG_FILTER: '^  - |ОШИБКА|^ +[|] '
        run: tools/ci/diag.sh "Остановка стенда" make stand-down-check DEBUG=1

  # Стенд, шаг 16: конфигурация стека наблюдения проверяется программами из образов (promtool, amtool, Loki, Tempo, Alloy), затем
  # поднимаются заглушки и стек без сервисов Java: приём журналов и трасс, Grafana, оповещение письмом. Полный набор с сервисами проверяет задание stand.
  obs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Версии Docker
        run: docker version --format 'Docker {{.Server.Version}}' && docker compose version

      - name: Конфигурация стека наблюдения
        env:
          DIAG_FILTER: '^  - |ОШИБКА|^ +[|] |rror|FAIL'
          DIAG_MAX: "30"
          DIAG_TAIL: "50"
        run: tools/ci/diag.sh "obs-validate" make obs-validate

      - name: Подъём заглушек и стека наблюдения с отладочными портами
        env:
          DIAG_TAIL: "60"
          DEBUG: "1"
        run: |
          tools/ci/diag.sh "make certs secrets" make certs secrets
          export DOCKER_GID=$(stat -L -c %g /var/run/docker.sock)
          export COMPOSE_PROFILES=stubs,obs
          tools/ci/diag.sh "compose up stubs,obs" docker compose -f compose.yaml -f compose.debug.yaml up -d --build
          tools/ci/diag.sh "ожидание stubs,obs" python3 tools/stand-checks/wait.py --profiles stubs,obs --timeout 240

      - name: Проверка стека наблюдения без сервисов Java
        env:
          DIAG_FILTER: '^  - |ОШИБКА|^ +[|] '
          DIAG_MAX: "40"
          DIAG_TAIL: "50"
        run: tools/ci/diag.sh "Проверка наблюдаемости (набор без сервисов)" python3 tools/stand-checks/obs_checks.py --light

      - name: Состояние и память контейнеров
        if: always()
        run: |
          docker compose --profile '*' ps -a || true
          msg=$(docker stats --no-stream --format '{{.Name}} {{.MemUsage}} ({{.MemPerc}})' 2>&1 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=память контейнеров (stubs и obs)::$msg"

      - name: Диагностика стека наблюдения при ошибке
        if: failure()
        run: tools/ci/diag-obs.sh

  # Образы сервисов проекта (шаг 17 Ф3, цепочка поставок): собираются из jar и сканируются Trivy на уязвимости и секреты. HIGH и CRITICAL с исправлением в
  # реестре блокируют: образ с известной дырой в зависимости не выпускается. Сторонние образы стенда только в отчёте (tools/ci/trivy-third-party.sh).
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Jar и образы сервисов
        env:
          DIAG_FILTER: 'ERROR:|FAILED|error:|not found|denied'
          DIAG_TAIL: "40"
        run: tools/ci/diag.sh "make images" make images IMAGE_TAG=ci

      - name: Trivy
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          cd "$RUNNER_TEMP"
          curl -sSfL -O "$base/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -O "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "trivy_${TRIVY_VERSION}_checksums.txt"
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          sudo install trivy /usr/local/bin/trivy
          trivy --version

      - name: Уязвимости и секреты в образах сервисов
        run: tools/ci/trivy-services.sh ci

      - name: Сторонние образы стенда, отчёт
        run: tools/ci/trivy-third-party.sh

  # Публикация образов сервисов в GHCR: только для push в main и только когда зелёные все остальные задания. Права на запись пакетов есть
  # только у этого задания. Образы получают теги: короткий хеш коммита и main.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docs, build, kit, services, gateway, stand, obs, scan, images, infra, storage, stubs, keycloak, pki, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Jar и образы сервисов
        env:
          DIAG_TAIL: "40"
        run: tools/ci/diag.sh "make images" make images IMAGE_TAG=ci IMAGE_SOURCE="https://github.com/${GITHUB_REPOSITORY}"

      - name: Вход в GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Публикация
        run: |
          set -euo pipefail
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          repo=$(echo "${GITHUB_REPOSITORY#*/}" | tr 'A-Z' 'a-z')
          for s in $(make -s --eval='_services: ; @echo $(SERVICES)' _services); do
            for tag in "${GITHUB_SHA::12}" main; do
              docker tag "dgm/$s:ci" "ghcr.io/$owner/$repo/$s:$tag"
              docker push -q "ghcr.io/$owner/$repo/$s:$tag"
            done
            echo "опубликован ghcr.io/$owner/$repo/$s:${GITHUB_SHA::12}"
          done
          echo "::notice title=GHCR::образы сервисов опубликованы: ghcr.io/$owner/$repo/<сервис>:${GITHUB_SHA::12} и :main"

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Зависимости Python
        run: tools/ci/diag.sh "Зависимости Python" python3 -m pip install --break-system-packages --user -r tools/docs-checks/requirements.txt

      - name: Теги образов в реестрах
        run: tools/ci/diag.sh "Теги образов" tools/ci/check-images.sh

  # Стенд, часть 1: профиль infra (PostgreSQL, Redis, Kafka с TLS и ACL) поднимается набором dev-min и проверяется на шифрование и права.
  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Версии Docker
        run: docker version --format 'Docker {{.Server.Version}}' && docker compose version

      - name: Конфигурация Compose корректна
        run: tools/ci/diag.sh "docker compose config" make compose-config

      - name: Подъём набора dev-min
        env:
          DIAG_TAIL: "70"
        run: tools/ci/diag.sh "make up SET=dev-min" make up SET=dev-min

      - name: Шифрование и права доступа PostgreSQL, Redis, Kafka
        env:
          DIAG_FILTER: '^  - |ОШИБКА|^ +[|] '
          DIAG_MAX: "60"
          DIAG_TAIL: "30"
        run: tools/ci/diag.sh "Проверки infra" tools/stand-checks/infra_security.sh

      - name: Миграции Flyway, права ролей PostgreSQL
        env:
          DIAG_FILTER: '^  - |ОШИБКА|^ +[|] '
          DIAG_MAX: "60"
          DIAG_TAIL: "30"
        run: tools/ci/diag.sh "Проверки миграций" tools/stand-checks/db_migrations.sh

      - name: Повторный подъём ничего не ломает (kafka-init пропускает готовое)
        run: |
          tools/ci/diag.sh "повторный make up" make up SET=dev-min
          docker compose --profile '*' logs --no-color kafka-init | tail -n 5

      - name: Память и состояние контейнеров
        if: always()
        run: |
          docker compose --profile '*' ps -a
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}'

      - name: Журналы контейнеров при ошибке
        if: failure()
        run: |
          for s in postgres redis kafka kafka-init; do
            echo "::group::$s"; docker compose --profile '*' logs --no-color --tail 40 "$s" || true; echo "::endgroup::"
            msg=$(docker compose --profile '*' logs --no-color --tail 12 "$s" 2>&1 | cut -c1-240 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning title=журнал $s::$msg"
          done

  # Объектное хранилище (ADR-024): запуск профиля storage, учётная запись на один бакет, подписанные ссылки, повторный init.
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Версии Docker и aws CLI
        run: docker version --format 'Docker {{.Server.Version}}' && docker compose version && aws --version

      - name: Подъём профиля storage с отладочным портом
        env:
          DIAG_TAIL: "70"
          DEBUG: "1"
        run: |
          tools/ci/diag.sh "make certs secrets" make certs secrets
          export COMPOSE_PROFILES=storage
          tools/ci/diag.sh "compose up storage" docker compose -f compose.yaml -f compose.debug.yaml up -d
          tools/ci/diag.sh "ожидание storage" python3 tools/stand-checks/wait.py --profiles storage

      - name: Хранилище объектов, шифрование и права доступа
        env:
          DIAG_FILTER: '^  - |ОШИБКА|^ +[|] '
          DIAG_MAX: "60"
          DIAG_TAIL: "30"
        run: tools/ci/diag.sh "Проверки storage" tools/stand-checks/storage_checks.sh

      - name: Память и состояние контейнеров
        if: always()
        run: |
          docker compose --profile '*' ps -a
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}'

      - name: Журналы контейнеров при ошибке
        if: failure()
        run: |
          for s in object-storage storage-init; do
            echo "::group::$s"; docker compose --profile '*' logs --no-color --tail 40 "$s" || true; echo "::endgroup::"
            msg=$(docker compose --profile '*' logs --no-color --tail 12 "$s" 2>&1 | cut -c1-240 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning title=журнал $s::$msg"
          done

  # Заглушки внешних систем (ADR-015): модульные тесты, сборка и запуск контейнера, TLS, ключи, SMTP, вебхуки настоящему получателю.
  stubs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Версии Docker
        run: docker version --format 'Docker {{.Server.Version}}' && docker compose version

      - name: Модульные и контрактные тесты заглушек (Node из образа стенда)
        env:
          DIAG_FILTER: '✖|^ℹ (tests|pass|fail)|AssertionError|expected|actual|error:'
          DIAG_MAX: "40"
          DIAG_TAIL: "30"
          DIAG_LOG: /tmp/stubs-tests.log
        run: |
          tools/ci/diag.sh "Модульные тесты заглушек" make stubs-test
          echo "::notice title=Модульные тесты заглушек::$(grep -E '^ℹ (tests|pass|fail|cancelled)' /tmp/stubs-tests.log | tr '\n' ' ')"

      - name: Подъём профиля stubs с отладочными портами
        env:
          DIAG_TAIL: "70"
          DEBUG: "1"
        run: |
          tools/ci/diag.sh "make certs secrets" make certs secrets
          export COMPOSE_PROFILES=stubs
          tools/ci/diag.sh "compose up stubs" docker compose -f compose.yaml -f compose.debug.yaml up -d --build
          tools/ci/diag.sh "ожидание stubs" python3 tools/stand-checks/wait.py --profiles stubs

      - name: Контейнер заглушек, шифрование, ключи, SMTP, вебхуки
        env:
          DIAG_FILTER: '^  - |ОШИБКА|^ +[|] '
          DIAG_MAX: "60"
          DIAG_TAIL: "30"
        run: tools/ci/diag.sh "Проверки stubs" tools/stand-checks/stubs_checks.sh

      - name: Память и состояние контейнеров
        if: always()
        run: |
          docker compose --profile '*' ps -a
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}'

      - name: Журналы контейнеров при ошибке
        if: failure()
        run: |
          for s in external-stubs; do
            echo "::group::$s"; docker compose --profile '*' logs --no-color --tail 40 "$s" || true; echo "::endgroup::"
            msg=$(docker compose --profile '*' logs --no-color --tail 12 "$s" 2>&1 | cut -c1-240 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning title=журнал $s::$msg"
          done
          docker logs dgm-check-receiver 2>&1 | tail -n 10 || true

  # Keycloak (шаг 10 Ф3): образ с расширением SMS собирается Compose, realm применяется из файла, вход по ролям, второй фактор,
  # сроки, ротация refresh, блокировка после пяти неудач, VK ID через заглушку, Argon2 в таблице credential, память.
  keycloak:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Версии Docker
        run: docker version --format 'Docker {{.Server.Version}}' && docker compose version

      - name: Модульные тесты клиента входа
        env:
          DIAG_FILTER: 'FAIL|ERROR|Error|^Ran '
          DIAG_MAX: "30"
        run: tools/ci/diag.sh "Тесты клиента входа" make keycloak-test

      - name: Подъём профилей infra, stubs, auth с отладочными портами
        env:
          DIAG_TAIL: "80"
          DIAG_MAX: "60"
          DEBUG: "1"
        run: |
          tools/ci/diag.sh "make certs secrets" make certs secrets
          export COMPOSE_PROFILES=infra,stubs,auth
          DIAG_FILTER='ERROR|[Ee]rror|[Ff]ailed|not found|cannot|denied' tools/ci/diag.sh "compose up keycloak" docker compose --progress plain -f compose.yaml -f compose.debug.yaml up -d --build
          tools/ci/diag.sh "ожидание infra,stubs,auth" python3 tools/stand-checks/wait.py --profiles infra,stubs,auth --timeout 420

      - name: Контейнер, шифрование, вход по ролям, второй фактор, Argon2 в базе
        env:
          DIAG_FILTER: '^  - |ОШИБКА|^ +[|] '
          DIAG_MAX: "60"
          DIAG_TAIL: "40"
        run: tools/ci/diag.sh "Проверки Keycloak" tools/stand-checks/keycloak_checks.sh

      - name: Повторный запуск Keycloak не ломает realm (импорт пропускается)
        run: |
          docker compose --profile '*' restart keycloak
          tools/ci/diag.sh "ожидание после перезапуска" python3 tools/stand-checks/wait.py --profiles infra,stubs,auth --timeout 240
          docker compose --profile '*' logs --no-color keycloak | grep -iE "Realm 'dgm' already exists|import" | tail -n 5 || true

      - name: Память и состояние контейнеров
        if: always()
        run: |
          docker compose --profile '*' ps -a
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}'

      - name: Журналы контейнеров при ошибке
        if: failure()
        run: |
          for s in keycloak postgres external-stubs; do
            echo "::group::$s"; docker compose --profile '*' logs --no-color --tail 80 "$s" || true; echo "::endgroup::"
            msg=$(docker compose --profile '*' logs --no-color --tail 14 "$s" 2>&1 | cut -c1-240 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning title=журнал $s::$msg"
          done

  # Центр сертификации и секреты (ADR-022): тесты скрипта и полный выпуск с проверкой, как на стенде.
  pki:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Тесты скрипта выпуска
        run: tools/ci/diag.sh "Тесты PKI" python3 -m unittest infra/pki/test_pki.py -v

      - name: Выпуск и проверка сертификатов и секретов
        run: |
          tools/ci/diag.sh "make certs" make certs
          tools/ci/diag.sh "make secrets" make secrets
          tools/ci/diag.sh "make pki-verify" make pki-verify
          make pki-status

  # ST-14: поиск секретов и уязвимостей. Бинарные файлы проверяются по контрольным суммам из выпуска.
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          cd "$RUNNER_TEMP"
          curl -sSfL -O "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Поиск секретов в истории и в файлах
        run: |
          tools/ci/diag.sh "Gitleaks история" gitleaks git . --no-banner --redact --config .gitleaks.toml
          tools/ci/diag.sh "Gitleaks файлы" gitleaks dir . --no-banner --redact --config .gitleaks.toml

      - name: Самопроверка поиска секретов
        run: tools/ci/selftest.sh security

      - name: В Git нет ключей, сертификатов и каталогов секретов
        run: tools/ci/diag.sh "Файлы секретов в Git" tools/ci/check-no-secrets-in-git.sh

      - name: Trivy
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          cd "$RUNNER_TEMP"
          curl -sSfL -O "$base/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -O "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "trivy_${TRIVY_VERSION}_checksums.txt"
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          sudo install trivy /usr/local/bin/trivy
          trivy --version

      - name: Уязвимости, секреты и конфигурации в файлах репозитория
        run: |
          tools/ci/diag.sh "Trivy файлы" trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --no-progress .
