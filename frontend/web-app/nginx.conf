# Веб-интерфейс стенда (шаг 14 Ф3): nginx отдаёт статические файлы по HTTPS, один рабочий процесс. Запуск без прав root, корневая файловая
# система только для чтения: pid-файл и временные каталоги лежат в /tmp (tmpfs). Сертификат и ключ приходят секретами Compose.
# На порт 8443 пускается только шлюз: клиентский сертификат нашего центра с именем api-gateway (ADR-022). Браузер ходит к шлюзу,
# шлюз к nginx: один вход и один сертификат на виду у пользователя.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css text/javascript application/javascript text/plain;   # text/html входит всегда
    server_tokens off;

    sendfile on;
    keepalive_timeout 15s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    client_max_body_size 1k;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Журнал в JSON, как у сервисов (поля logstash); строка запроса без параметров: в параметрах могут быть данные пользователя
    log_format json escape=json '{"@timestamp":"$time_iso8601","@version":"1","message":"$request_method $uri $status",'
                                '"logger_name":"nginx.access","level":"INFO","method":"$request_method","path":"$uri",'
                                '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
                                '"correlation_id":"$http_x_correlation_id","client":"$http_x_forwarded_for"}';
    access_log /dev/stdout json;

    # Допускается только шлюз: имя в сертификате клиента, цепочку до нашего центра проверяет сам nginx (ssl_verify_client)
    map $ssl_client_s_dn $client_is_gateway {
        default 0;
        "~(^|,)CN=api-gateway(,|$)" 1;
    }

    # Файлы в /assets/ собирает Vite с хешем содержимого в имени: их можно кэшировать надолго. Страница не кэшируется (в ней ссылки на текущие
    # файлы). Адреса клиентского маршрутизатора отдают ту же страницу (после возврата на /index.html внутренним переходом $uri уже её адрес).
    map $uri $cache_control {
        default "public, max-age=3600";
        "~^/assets/" "public, max-age=31536000, immutable";
        "~^/(index\.html)?$" "no-cache";
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /run/secrets/tls_web-app.crt;
        ssl_certificate_key /run/secrets/tls_web-app.key;
        ssl_client_certificate /run/secrets/tls_ca.crt;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;

        # Заголовки безопасности. Шлюз добавляет HSTS и недостающие из этого же набора; здесь строгая политика содержимого:
        # скрипты, стили и запросы только со своего адреса, без встраивания в чужие страницы
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control $cache_control always;

        if ($client_is_gateway = 0) {
            return 403;
        }
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # Файлы с расширением: нет файла, значит 404 (а не страница, иначе пропавший скрипт выглядел бы как «страница вместо скрипта»)
        location ~* \.[a-z0-9]+$ {
            try_files $uri =404;
        }

        # Остальное это адреса клиентского маршрутизатора (/seller/products, /oidc/callback/staff): отдаём страницу, дальше решает React
        location / {
            try_files $uri /index.html;
        }
    }

    # Проверка готовности для Docker: только на 127.0.0.1 внутри контейнера, без TLS и без журнала
    server {
        listen 127.0.0.1:8081;
        access_log off;

        location = /health {
            default_type text/plain;
            return 200 "UP\n";
        }
        location / {
            return 404;
        }
    }
}
