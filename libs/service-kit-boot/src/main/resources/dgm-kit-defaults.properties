# Значения каркаса по умолчанию: ниже по приоритету, чем application.yml сервиса и переменные окружения.
# Порты по c4-deployment.md: 8443 mTLS (прикладной интерфейс), 8444 mTLS (метрики и здоровье). TLS и взаимная проверка включены
# всегда, в том числе на ноутбуке (ADR-022). Сертификат сервиса, его ключ и центр сертификации берутся из каталога секретов.
dgm.service=${spring.application.name}

spring.main.banner-mode=off
spring.web.resources.add-mappings=false

server.port=8443
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.threads.max=32
server.tomcat.accesslog.enabled=false
server.max-http-request-header-size=16KB
server.error.include-message=never
server.error.include-stacktrace=never

spring.ssl.bundle.pem.dgm.keystore.certificate=file:${dgm.secrets.dir:/run/secrets}/tls_${dgm.service}.crt
spring.ssl.bundle.pem.dgm.keystore.private-key=file:${dgm.secrets.dir:/run/secrets}/tls_${dgm.service}.key
spring.ssl.bundle.pem.dgm.truststore.certificate=file:${dgm.secrets.dir:/run/secrets}/tls_ca.crt
spring.ssl.bundle.pem.dgm.reload-on-update=true
server.ssl.bundle=dgm
server.ssl.client-auth=need

management.server.port=8444
management.server.ssl.bundle=dgm
management.server.ssl.client-auth=need
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${dgm.service}

# Журнал одной строкой JSON; идентификаторы запроса (traceId, spanId, correlationId) берутся из MDC
logging.structured.format.console=logstash
