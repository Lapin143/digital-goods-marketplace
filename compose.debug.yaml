# Отладочные порты на хост, только на 127.0.0.1 (c4-deployment.md, раздел 4.3). Подключается ключом DEBUG=1: make up SET=dev-min DEBUG=1.
# На сервере файл не используется. Сеть data закрыта для выхода наружу (internal), поэтому контейнерам добавляется сеть debug.
services:
  postgres:
    ports: ["127.0.0.1:15432:5432"]
    networks: [debug]
  kafka:
    ports: ["127.0.0.1:19093:19093"]
    networks: [debug]
  redis:
    ports: ["127.0.0.1:16379:6379"]
    networks: [debug]
  object-storage:
    ports: ["127.0.0.1:19000:9000"]
    networks: [debug]
  keycloak:
    ports: ["127.0.0.1:18445:8443"]
    environment:
      # Консоль администратора в браузере. Без этого Keycloak перенаправляет /auth/admin на публичный адрес шлюза (KC_HOSTNAME),
      # где консоль закрыта намеренно (ADR-021), и браузер получает 404 от шлюза. Запросы к Admin API и проверки на порт не влияют
      KC_HOSTNAME_ADMIN: https://localhost:18445/auth
  api-gateway:
    ports: ["127.0.0.1:18446:8444"]    # порт управления (метрики и здоровье, mTLS): проверки шлюза читают метрики отказа открытым
  web-app:
    ports: ["127.0.0.1:18447:8443"]    # страница по mTLS: проверки веб-интерфейса идут с клиентским сертификатом шлюза
  external-stubs:
    ports: ["127.0.0.1:18443:8443", "127.0.0.1:18444:8444", "127.0.0.1:11025:1025"]
  # Профиль obs: сеть obs закрыта, поэтому, как у баз данных, добавляется сеть debug
  grafana:
    ports: ["127.0.0.1:3000:3000"]
    networks: [debug]
  prometheus:
    ports: ["127.0.0.1:9090:9090"]
    networks: [debug]
  alertmanager:
    ports: ["127.0.0.1:19094:9093"]
  loki:
    ports: ["127.0.0.1:13100:3100"]
    networks: [debug]
  tempo:
    ports: ["127.0.0.1:13200:3200"]
    networks: [debug]
  alloy:
    ports: ["127.0.0.1:14318:4318"]     # приём OTLP по HTTP, взаимный TLS: проверка трасс делает запрос с сертификатом из каталога секретов
    networks: [debug]

networks:
  debug: {}
