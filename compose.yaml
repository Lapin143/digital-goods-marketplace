# Стенд: Docker Compose. Состав контейнеров, профили, сети, лимиты памяти и секреты взяты из документов Ф2 и сверяются с ними
# скриптом tools/docs-checks/check_compose.py (c4-deployment.md, memory-budget.md, versions.md, infra/pki/inventory.json).
#
# Запуск наборов профилей: make up SET=dev-min (список наборов в Makefile и в c4-deployment.md, раздел 3).
# Секреты и сертификаты создаются заранее: make certs secrets (make up делает это сам).
name: dgm

# Общие настройки контейнеров. Правила: без лишних прав, файловая система только для чтения, записи только в tmpfs и тома.
x-common: &common
  restart: ${DGM_RESTART:-no}
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

# Общие значения окружения сервисов Java: адреса соседей и издатель токена. Секреты сюда не входят, они приходят файлами (NFT-3.2).
x-service-env: &service-env
  DGM_PG_HOST: postgres
  DGM_KAFKA_BOOTSTRAP: kafka:9093
  DGM_JWT_ISSUER: ${DGM_PUBLIC_ORIGIN:-https://localhost:8443}/auth/realms/dgm
  DGM_JWKS_URI: https://keycloak:8443/auth/realms/dgm/protocol/openid-connect/certs

# Проверка готовности сервиса Java: порт 8081 на 127.0.0.1 внутри контейнера (ReadinessProbe каркаса). В образе нет curl и openssl,
# вторая JVM для проверки не помещается в лимит памяти, поэтому запрос идёт средствами bash.
x-service-health: &service-health
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

services:
  # ------------------------------------------------------------------ профиль infra
  postgres:
    <<: *common
    image: postgres:16.15-trixie
    profiles: [infra]
    user: "999:999"
    entrypoint: ["/bin/bash", "/etc/dgm/postgres/entrypoint.sh"]
    command: []
    stop_signal: SIGINT          # быстрая остановка: не ждать закрытия клиентских соединений
    mem_limit: 512m
    memswap_limit: 512m
    networks: [data]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/etc/dgm/postgres:ro
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro   # базы и роли при первом запуске пустого тома (make db-roles повторяет)
    tmpfs:
      - /run/dgm:uid=999,gid=999,mode=0700,size=1m
      - /var/run/postgresql:uid=999,gid=999,mode=2775,size=1m
      - /tmp:uid=999,gid=999,mode=1777,size=32m
    secrets:
      - tls_ca.crt
      - tls_postgres.key
      - tls_postgres.crt
      - db_postgres_admin
      - db_migrator_catalog
      - db_migrator_inventory
      - db_migrator_order
      - db_migrator_payment
      - db_migrator_delivery
      - db_migrator_platform
      - db_app_seller_onboarding
      - db_app_catalog
      - db_app_inventory
      - db_app_orders
      - db_app_payments
      - db_app_delivery
      - db_app_identity
      - db_app_support
      - db_app_notification
      - db_app_audit_admin
      - db_app_audit_writer
      - db_keycloak
    healthcheck:
      # Проверка по TCP: на время инициализации сервер слушает только сокет, поэтому готовым считается только настоящий сервер
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    <<: *common
    image: redis:8.10.2-alpine
    profiles: [infra]
    user: "999:1000"
    entrypoint: ["/bin/sh", "/etc/dgm/redis/entrypoint.sh"]
    command: []
    mem_limit: 96m
    memswap_limit: 96m
    networks: [data]
    volumes:
      - ./infra/redis:/etc/dgm/redis:ro
    tmpfs:
      - /run/dgm:uid=999,gid=1000,mode=0700,size=1m
      - /data:uid=999,gid=1000,mode=0700,size=4m
    secrets:
      - tls_ca.crt
      - tls_redis.key
      - tls_redis.crt
      - redis_admin
      - redis_catalog
      - redis_inventory
      - redis_platform
      - redis_gateway
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_admin)\" redis-cli --tls --cacert /run/secrets/tls_ca.crt --user admin -h localhost ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 2s

  kafka:
    <<: *common
    image: apache/kafka:4.3.1
    profiles: [infra]
    user: "1000:1000"
    entrypoint: ["/bin/bash", "/etc/dgm/kafka/entrypoint.sh"]
    command: []
    mem_limit: 480m
    memswap_limit: 480m
    networks: [data]
    volumes:
      - kafkadata:/var/lib/kafka/data
      - ./infra/kafka:/etc/dgm/kafka:ro
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777,size=64m
    secrets:
      - tls_ca.crt
      - tls_kafka.key
      - tls_kafka.crt
    healthcheck:
      # Рукопожатие TLS на порту клиентов: слушатель начинает отвечать, когда брокер завершил запуск. JVM в проверке не запускается
      test: ["CMD-SHELL", "timeout 5 openssl s_client -connect localhost:9093 -verify_hostname localhost -verify_return_error -CAfile /run/secrets/tls_ca.crt -cert /run/secrets/tls_kafka.crt -key /run/secrets/tls_kafka.key </dev/null 2>&1 | grep -q 'Verify return code: 0'"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 15s

  kafka-init:
    <<: *common
    image: apache/kafka:4.3.1
    profiles: [infra]
    user: "1000:1000"
    entrypoint: ["/bin/bash", "/etc/dgm/kafka/init.sh"]
    command: []
    restart: "no"
    mem_limit: 128m
    memswap_limit: 128m
    networks: [data]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka:/etc/dgm/kafka:ro
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777,size=16m
    secrets:
      - tls_ca.crt
      - tls_kafka-init.key
      - tls_kafka-init.crt

  # ------------------------------------------------------------------ профиль stubs
  external-stubs:
    <<: *common
    image: dgm/external-stubs:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile.stubs
      args:
        NODE_IMAGE: node:24.21.0-alpine3.24
    profiles: [stubs]
    user: "10001:10001"
    mem_limit: 128m
    memswap_limit: 128m
    networks: [app]
    environment:
      STUBS_PUBLIC_URL: https://external-stubs:8443
      STUBS_TLS_CERT_FILE: /run/secrets/tls_external-stubs.crt
      STUBS_TLS_KEY_FILE: /run/secrets/tls_external-stubs.key
      STUBS_TLS_CA_FILE: /run/secrets/tls_ca.crt
      PAYMENT_GATEWAY_KEY_FILE: /run/secrets/payment_gateway_key
      PAYMENT_WEBHOOK_SECRET_FILE: /run/secrets/payment_webhook_secret
      DELIVERY_EMAIL_KEY_FILE: /run/secrets/delivery_email_key
      DELIVERY_WEBHOOK_SECRET_FILE: /run/secrets/delivery_webhook_secret
      PLATFORM_EMAIL_KEY_FILE: /run/secrets/platform_email_key
      PLATFORM_SMS_KEY_FILE: /run/secrets/platform_sms_key
      PLATFORM_WEBHOOK_SECRET_FILE: /run/secrets/platform_webhook_secret
      # Вебхуки идут на публичный вход платформы, как у настоящих провайдеров (пути из OpenAPI, сверяет check_stub_contract.py)
      STUBS_PAYMENT_WEBHOOK_URL: https://api-gateway:8443/api/v1/webhooks/payment-gateway
      STUBS_DELIVERY_EMAIL_WEBHOOK_URL: https://api-gateway:8443/api/v1/webhooks/email-provider-keys
      STUBS_PLATFORM_EMAIL_WEBHOOK_URL: https://api-gateway:8443/api/v1/webhooks/email-provider
      STUBS_PLATFORM_SMS_WEBHOOK_URL: https://api-gateway:8443/api/v1/webhooks/sms-provider
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=8m
    secrets:
      - tls_ca.crt
      - tls_external-stubs.key
      - tls_external-stubs.crt
      - payment_gateway_key
      - payment_webhook_secret
      - delivery_email_key
      - delivery_webhook_secret
      - platform_email_key
      - platform_sms_key
      - platform_webhook_secret
    healthcheck:
      # busybox wget не проверяет цепочку (ключа --ca-certificate нет), поэтому здесь проверяется только готовность;
      # цепочку проверяют tools/stand-checks/stubs_checks.sh (curl с --cacert на отладочном порту)
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1:8443/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 2s

  # ------------------------------------------------------------------ профиль auth
  keycloak:
    <<: *common
    image: dgm/keycloak:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile.keycloak
      args:
        KEYCLOAK_IMAGE: quay.io/keycloak/keycloak:26.8.0
        JDK_IMAGE: eclipse-temurin:25-jdk-noble
        UBI_IMAGE: registry.access.redhat.com/ubi9:9.8
    profiles: [auth]
    user: "1000:0"
    entrypoint: ["/bin/bash", "/etc/dgm/keycloak/entrypoint.sh"]
    command: []
    mem_limit: 672m
    memswap_limit: 672m
    networks: [app, data]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Адрес для браузера: тот, по которому клиент заходит на шлюз (в токене он станет издателем iss). Внутри сети Keycloak
      # отвечает и по своему имени, адрес для запросов между контейнерами подбирается из запроса (KC_HOSTNAME_BACKCHANNEL_DYNAMIC)
      DGM_PUBLIC_ORIGIN: ${DGM_PUBLIC_ORIGIN:-https://localhost:8443}
      KC_HOSTNAME: ${DGM_PUBLIC_ORIGIN:-https://localhost:8443}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_PORT: "8443"
      KC_HTTPS_CERTIFICATE_FILE: /run/secrets/tls_keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /run/secrets/tls_keycloak.key
      KC_HTTPS_PROTOCOLS: TLSv1.3,TLSv1.2
      KC_TRUSTSTORE_PATHS: /run/secrets/tls_ca.crt
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db?sslmode=verify-full&sslrootcert=/run/secrets/tls_ca.crt
      KC_DB_USERNAME: keycloak
      KC_DB_POOL_INITIAL_SIZE: "2"
      KC_DB_POOL_MIN_SIZE: "2"
      KC_DB_POOL_MAX_SIZE: "10"
      # Куча 384 МБ из 672 МБ лимита: остальное метаданные, стеки потоков, прямая память и кэш кода (memory-budget.md)
      JAVA_OPTS_KC_HEAP: -Xms64m -Xmx384m
      JAVA_OPTS_APPEND: -Xss512k -XX:MaxMetaspaceSize=192m -XX:MaxDirectMemorySize=64m -XX:ReservedCodeCacheSize=64m
    volumes:
      - ./infra/keycloak:/etc/dgm/keycloak:ro
    tmpfs:
      - /opt/keycloak/data:uid=1000,gid=0,mode=0770,size=16m   # каталог импорта realm и временные файлы
      - /tmp:uid=1000,gid=0,mode=1777,size=32m
    secrets:
      - tls_ca.crt
      - tls_keycloak.key
      - tls_keycloak.crt
      - db_keycloak
      - keycloak_admin
      - keycloak_client_platform
      - keycloak_vkid_client
    healthcheck:
      # Готовность по TLS с проверкой цепочки: порт управления 9000 отвечает UP, когда импорт realm закончен и база доступна
      test: ["CMD-SHELL", "curl -fsS --cacert /run/secrets/tls_ca.crt https://localhost:9000/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # ------------------------------------------------------------------ профиль storage
  object-storage:
    <<: *common
    image: rustfs/rustfs:1.0.1
    profiles: [storage]
    user: "10001:10001"
    entrypoint: ["/bin/sh", "/etc/dgm/storage/entrypoint.sh"]
    command: []
    mem_limit: 192m
    memswap_limit: 192m
    networks: [data]
    volumes:
      - objectdata:/data
      - ./infra/storage:/etc/dgm/storage:ro
    tmpfs:
      - /run/dgm:uid=10001,gid=10001,mode=0700,size=1m
      - /logs:uid=10001,gid=10001,mode=0755,size=16m
      - /tmp:uid=10001,gid=10001,mode=1777,size=32m
    secrets:
      - tls_ca.crt
      - tls_object-storage.key
      - tls_object-storage.crt
      - storage_admin
    healthcheck:
      # Запрос /health по TLS с проверкой цепочки: сервер отвечает, когда готов принимать S3-запросы
      test: ["CMD-SHELL", "curl -fsS --cacert /run/secrets/tls_ca.crt https://localhost:9000/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 3s

  storage-init:
    <<: *common
    image: rustfs/rc:v0.1.36
    profiles: [storage]
    user: "100:101"
    entrypoint: ["/bin/sh", "/etc/dgm/storage/init.sh"]
    command: []
    restart: "no"
    mem_limit: 32m
    memswap_limit: 32m
    networks: [data]
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      HOME: /tmp
    volumes:
      - ./infra/storage:/etc/dgm/storage:ro
    tmpfs:
      - /tmp:uid=100,gid=101,mode=1777,size=8m
    secrets:
      - tls_ca.crt
      - storage_admin
      - storage_catalog

# Сети (c4-deployment.md, раздел 4.2). edge и app подключаются у контейнеров следующих профилей.
# data и obs закрыты для выхода в интернет. Порты на хост здесь не публикуются: отладочные порты в compose.debug.yaml.

  # ------------------------------------------------------------------ профиль purchase
  catalog-service:
    <<: *common
    image: dgm/catalog-service:${IMAGE_TAG:-dev}
    profiles: [purchase]
    user: "10001:10001"
    mem_limit: 352m
    memswap_limit: 352m
    networks: [app, data, obs]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *service-env
      # Тестовые данные ходячего скелета (миграции db/testdata). На сервере переменная пустая: DGM_SPRING_PROFILES=
      SPRING_PROFILES_ACTIVE: ${DGM_SPRING_PROFILES-testdata}
      # Куча 192 МБ из лимита 352 МБ: под нагрузкой пик занимал 85-90% прежних 320 МБ (memory-measurements.md)
      JAVA_TOOL_OPTIONS: -Xmx192m -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=48m
    secrets:
      - tls_ca.crt
      - tls_catalog-service.key
      - tls_catalog-service.crt
      - db_app_catalog
      - db_app_seller_onboarding
      - db_migrator_catalog
      - redis_catalog
      - storage_catalog
    healthcheck:
      <<: *service-health

  inventory-service:
    <<: *common
    image: dgm/inventory-service:${IMAGE_TAG:-dev}
    profiles: [purchase]
    user: "10001:10001"
    mem_limit: 320m
    memswap_limit: 320m
    networks: [app, data, obs]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *service-env
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=48m
    secrets:
      - tls_ca.crt
      - tls_inventory-service.key
      - tls_inventory-service.crt
      - db_app_inventory
      - db_migrator_inventory
      - inventory_hmac
      - inventory_kek
      - redis_inventory
    healthcheck:
      <<: *service-health

  order-service:
    <<: *common
    image: dgm/order-service:${IMAGE_TAG:-dev}
    profiles: [purchase]
    user: "10001:10001"
    mem_limit: 352m
    memswap_limit: 352m
    networks: [app, data, obs]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *service-env
      # Тестовые данные ходячего скелета (миграции db/testdata). На сервере переменная пустая: DGM_SPRING_PROFILES=
      SPRING_PROFILES_ACTIVE: ${DGM_SPRING_PROFILES-testdata}
      # Куча 192 МБ из лимита 352 МБ: под нагрузкой пик занимал 85-90% прежних 320 МБ (memory-measurements.md)
      JAVA_TOOL_OPTIONS: -Xmx192m -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=48m
    secrets:
      - tls_ca.crt
      - tls_order-service.key
      - tls_order-service.crt
      - db_app_orders
      - db_migrator_order
    healthcheck:
      <<: *service-health

  payment-service:
    <<: *common
    image: dgm/payment-service:${IMAGE_TAG:-dev}
    profiles: [purchase]
    user: "10001:10001"
    mem_limit: 320m
    memswap_limit: 320m
    networks: [app, data, obs]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *service-env
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=48m
    secrets:
      - tls_ca.crt
      - tls_payment-service.key
      - tls_payment-service.crt
      - db_app_payments
      - db_migrator_payment
      - payment_gateway_key
      - payment_webhook_secret
    healthcheck:
      <<: *service-health

  delivery-service:
    <<: *common
    image: dgm/delivery-service:${IMAGE_TAG:-dev}
    profiles: [purchase]
    user: "10001:10001"
    mem_limit: 320m
    memswap_limit: 320m
    networks: [app, data, obs]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *service-env
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=48m
    secrets:
      - tls_ca.crt
      - tls_delivery-service.key
      - tls_delivery-service.crt
      - db_app_delivery
      - db_migrator_delivery
      - delivery_email_key
      - delivery_webhook_secret
    healthcheck:
      <<: *service-health

  # ------------------------------------------------------------------ профиль platform
  platform-service:
    <<: *common
    image: dgm/platform-service:${IMAGE_TAG:-dev}
    profiles: [platform]
    user: "10001:10001"
    mem_limit: 352m
    memswap_limit: 352m
    networks: [app, data, obs]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *service-env
      # Куча 192 МБ из лимита 352 МБ (memory-budget.md)
      JAVA_TOOL_OPTIONS: -Xmx192m -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=48m
    secrets:
      - tls_ca.crt
      - tls_platform-service.key
      - tls_platform-service.crt
      - db_app_audit_admin
      - db_app_audit_writer
      - db_app_identity
      - db_app_notification
      - db_app_support
      - db_migrator_platform
      - keycloak_client_platform
      - platform_audit_hmac
      - platform_email_key
      - platform_otp_pepper
      - platform_sms_key
      - platform_webhook_secret
      - redis_platform
    healthcheck:
      <<: *service-health

  # ------------------------------------------------------------------ профиль gateway
  # Единая точка входа (ADR-021): TLS 1.2 и выше без клиентского сертификата (браузеры), к сервисам по mTLS, к Redis по TLS как пользователь gateway.
  # Единственный контейнер в сети edge и единственный с портом на хосте (8443 на ноутбуке, 443 на сервере). Keycloak при старте не нужен:
  # ключи токенов запрашиваются лениво. Redis тоже не обязателен для работы (отказ открытым), но при старте шлюз ждёт его для полного набора.
  api-gateway:
    <<: *common
    image: dgm/api-gateway:${IMAGE_TAG:-dev}
    profiles: [gateway]
    user: "10001:10001"
    mem_limit: 352m
    memswap_limit: 352m
    networks: [edge, app, data, obs]
    ports:
      - "8443:8443"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DGM_JWT_ISSUER: ${DGM_PUBLIC_ORIGIN:-https://localhost:8443}/auth/realms/dgm
      DGM_JWKS_URI: https://keycloak:8443/auth/realms/dgm/protocol/openid-connect/certs
      DGM_REDIS_HOST: redis
      # Куча 192 МБ из лимита 352 МБ: пик 274 МБ при проверках лимитов частоты и отказов занимал 86% прежних 320 МБ (memory-measurements.md)
      JAVA_TOOL_OPTIONS: -Xmx192m -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=48m
    secrets:
      - tls_ca.crt
      - tls_api-gateway.key
      - tls_api-gateway.crt
      - redis_gateway
    healthcheck:
      <<: *service-health

  # Веб-интерфейс (шаг 14 Ф3): заглушка на nginx, настоящий интерфейс React появится в Ф4. Доступен только шлюзу (mTLS, сертификат
  # api-gateway), на хост не публикуется: браузер ходит на 8443 шлюза, шлюз за страницей к web-app.
  web-app:
    <<: *common
    image: dgm/web-app:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NGINX_IMAGE: nginx:1.30.5-alpine3.24
    profiles: [gateway]
    user: "10001:10001"
    mem_limit: 64m
    memswap_limit: 64m
    networks: [app]
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=8m
    secrets:
      - tls_ca.crt
      - tls_web-app.key
      - tls_web-app.crt
    healthcheck:
      # Порт готовности 8081 слушает только 127.0.0.1 внутри контейнера, без TLS (в образе есть busybox wget, curl нет)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  # ------------------------------------------------------------------ профиль obs (шаг 16 Ф3, c4-deployment.md раздел 5)
  # Конфигурация как код: infra/obs/**. Сеть obs закрыта (internal), поэтому наружу компоненты выходят только через отладочный файл.
  # Лимит памяти Go-процессов продублирован в GOMEMLIMIT (около 85% лимита контейнера): сборщик мусора работает чаще, а контейнер
  # не убивается по памяти.
  prometheus:
    <<: *common
    image: prom/prometheus:v3.14.0
    profiles: [obs]
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=:9090
      - --log.format=json
    mem_limit: 192m
    memswap_limit: 192m
    networks: [obs]
    environment:
      GOMEMLIMIT: 160MiB
    volumes:
      - promdata:/prometheus
      - ./infra/obs/prometheus:/etc/prometheus:ro
    tmpfs:
      - /tmp:uid=65534,gid=65534,mode=1777,size=8m
    secrets:
      - tls_ca.crt
      - tls_prometheus.key
      - tls_prometheus.crt
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

  alertmanager:
    <<: *common
    image: prom/alertmanager:v0.34.1
    profiles: [obs]
    user: "65534:65534"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
      - --cluster.listen-address=
      - --log.format=json
    mem_limit: 32m
    memswap_limit: 32m
    # В app нужен для почты: SMTP на стенде идёт к external-stubs, на сервере к почтовому сервису в интернете
    networks: [obs, app]
    environment:
      GOMEMLIMIT: 26MiB
    volumes:
      - ./infra/obs/alertmanager:/etc/alertmanager:ro
    tmpfs:
      - /alertmanager:uid=65534,gid=65534,mode=0700,size=8m
      - /tmp:uid=65534,gid=65534,mode=1777,size=4m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 3s

  grafana:
    <<: *common
    image: grafana/grafana:13.2.3
    profiles: [obs]
    user: "472:0"
    mem_limit: 384m
    memswap_limit: 384m
    networks: [obs]
    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin
      GF_SECURITY_SECRET_KEY__FILE: /run/secrets/grafana_secret_key
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_LIVE_MAX_CONNECTIONS: "0"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GOMEMLIMIT: 320MiB
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/obs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/obs/grafana/dashboards:/etc/dgm/grafana/dashboards:ro
    tmpfs:
      - /tmp:uid=472,gid=0,mode=1777,size=16m
    secrets:
      - grafana_admin
      - grafana_secret_key
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 15s

  # В образах Loki и Tempo нет оболочки и wget (distroless): проверка готовности Docker невозможна, готовность этих двух
  # контейнеров проверяет make obs-check по /ready и по состоянию целей Prometheus (check_compose.py: NO_HEALTHCHECK)
  loki:
    <<: *common
    image: grafana/loki:3.7.8
    profiles: [obs]
    user: "10001:10001"
    command:
      - -config.file=/etc/loki/loki.yaml
    mem_limit: 256m
    memswap_limit: 256m
    networks: [obs]
    environment:
      GOMEMLIMIT: 215MiB
    volumes:
      - lokidata:/loki
      - ./infra/obs/loki:/etc/loki:ro
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=8m

  tempo:
    <<: *common
    image: grafana/tempo:2.10.8
    profiles: [obs]
    user: "10001:10001"
    command:
      - -config.file=/etc/tempo/tempo.yaml
    mem_limit: 256m
    memswap_limit: 256m
    networks: [obs]
    environment:
      GOMEMLIMIT: 215MiB
    volumes:
      - tempodata:/var/tempo
      - ./infra/obs/tempo:/etc/tempo:ro
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=8m

  alloy:
    <<: *common
    image: grafana/alloy:v1.20.1
    profiles: [obs]
    user: "473:473"
    # Сокет Docker принадлежит группе docker хоста: её номер подставляет make up (DOCKER_GID). В Docker Desktop сокет принадлежит root:
    # задайте DOCKER_GID=0
    group_add:
      - "${DOCKER_GID:-0}"
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    mem_limit: 128m
    memswap_limit: 128m
    networks: [obs]
    environment:
      GOMEMLIMIT: 100MiB
    volumes:
      - ./infra/obs/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /var/lib/alloy/data:uid=473,gid=473,mode=0770,size=16m
      - /tmp:uid=473,gid=473,mode=1777,size=4m
    secrets:
      - tls_ca.crt
      - tls_alloy.key
      - tls_alloy.crt
    healthcheck:
      # В образе нет curl и wget, есть bash
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  edge: {}
  app: {}
  data:
