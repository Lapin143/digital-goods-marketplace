# Стенд: Docker Compose. Состав контейнеров, профили, сети, лимиты памяти и секреты взяты из документов Ф2 и сверяются с ними
# скриптом tools/docs-checks/check_compose.py (c4-deployment.md, memory-budget.md, versions.md, infra/pki/inventory.json).
#
# Запуск наборов профилей: make up SET=dev-min (список наборов в Makefile и в c4-deployment.md, раздел 3).
# Секреты и сертификаты создаются заранее: make certs secrets (make up делает это сам).
name: dgm

# Общие настройки контейнеров. Правила: без лишних прав, файловая система только для чтения, записи только в tmpfs и тома.
x-common: &common
  restart: ${DGM_RESTART:-no}
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  # ------------------------------------------------------------------ профиль infra
  postgres:
    <<: *common
    image: postgres:16.15-trixie
    profiles: [infra]
    user: "999:999"
    entrypoint: ["/bin/bash", "/etc/dgm/postgres/entrypoint.sh"]
    command: []
    stop_signal: SIGINT          # быстрая остановка: не ждать закрытия клиентских соединений
    mem_limit: 512m
    memswap_limit: 512m
    networks: [data]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/etc/dgm/postgres:ro
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro   # базы и роли при первом запуске пустого тома (make db-roles повторяет)
    tmpfs:
      - /run/dgm:uid=999,gid=999,mode=0700,size=1m
      - /var/run/postgresql:uid=999,gid=999,mode=2775,size=1m
      - /tmp:uid=999,gid=999,mode=1777,size=32m
    secrets:
      - tls_ca.crt
      - tls_postgres.key
      - tls_postgres.crt
      - db_postgres_admin
      - db_migrator_catalog
      - db_migrator_inventory
      - db_migrator_order
      - db_migrator_payment
      - db_migrator_delivery
      - db_migrator_platform
      - db_app_seller_onboarding
      - db_app_catalog
      - db_app_inventory
      - db_app_orders
      - db_app_payments
      - db_app_delivery
      - db_app_identity
      - db_app_support
      - db_app_notification
      - db_app_audit_admin
      - db_app_audit_writer
      - db_keycloak
    healthcheck:
      # Проверка по TCP: на время инициализации сервер слушает только сокет, поэтому готовым считается только настоящий сервер
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    <<: *common
    image: redis:8.2.10-alpine
    profiles: [infra]
    user: "999:1000"
    entrypoint: ["/bin/sh", "/etc/dgm/redis/entrypoint.sh"]
    command: []
    mem_limit: 96m
    memswap_limit: 96m
    networks: [data]
    volumes:
      - ./infra/redis:/etc/dgm/redis:ro
    tmpfs:
      - /run/dgm:uid=999,gid=1000,mode=0700,size=1m
      - /data:uid=999,gid=1000,mode=0700,size=4m
    secrets:
      - tls_ca.crt
      - tls_redis.key
      - tls_redis.crt
      - redis_admin
      - redis_catalog
      - redis_inventory
      - redis_platform
      - redis_gateway
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_admin)\" redis-cli --tls --cacert /run/secrets/tls_ca.crt --user admin -h localhost ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 2s

  kafka:
    <<: *common
    image: apache/kafka:4.3.1
    profiles: [infra]
    user: "1000:1000"
    entrypoint: ["/bin/bash", "/etc/dgm/kafka/entrypoint.sh"]
    command: []
    mem_limit: 448m
    memswap_limit: 448m
    networks: [data]
    volumes:
      - kafkadata:/var/lib/kafka/data
      - ./infra/kafka:/etc/dgm/kafka:ro
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777,size=64m
    secrets:
      - tls_ca.crt
      - tls_kafka.key
      - tls_kafka.crt
    healthcheck:
      # Рукопожатие TLS на порту клиентов: слушатель начинает отвечать, когда брокер завершил запуск. JVM в проверке не запускается
      test: ["CMD-SHELL", "timeout 5 openssl s_client -connect localhost:9093 -verify_hostname localhost -verify_return_error -CAfile /run/secrets/tls_ca.crt -cert /run/secrets/tls_kafka.crt -key /run/secrets/tls_kafka.key </dev/null 2>&1 | grep -q 'Verify return code: 0'"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 15s

  kafka-init:
    <<: *common
    image: apache/kafka:4.3.1
    profiles: [infra]
    user: "1000:1000"
    entrypoint: ["/bin/bash", "/etc/dgm/kafka/init.sh"]
    command: []
    restart: "no"
    mem_limit: 128m
    memswap_limit: 128m
    networks: [data]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka:/etc/dgm/kafka:ro
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777,size=16m
    secrets:
      - tls_ca.crt
      - tls_kafka-init.key
      - tls_kafka-init.crt

  # ------------------------------------------------------------------ профиль storage
  object-storage:
    <<: *common
    image: rustfs/rustfs:1.0.1
    profiles: [storage]
    user: "10001:10001"
    entrypoint: ["/bin/sh", "/etc/dgm/storage/entrypoint.sh"]
    command: []
    mem_limit: 192m
    memswap_limit: 192m
    networks: [data]
    volumes:
      - objectdata:/data
      - ./infra/storage:/etc/dgm/storage:ro
    tmpfs:
      - /run/dgm:uid=10001,gid=10001,mode=0700,size=1m
      - /logs:uid=10001,gid=10001,mode=0755,size=16m
      - /tmp:uid=10001,gid=10001,mode=1777,size=32m
    secrets:
      - tls_ca.crt
      - tls_object-storage.key
      - tls_object-storage.crt
      - storage_admin
    healthcheck:
      # Запрос /health по TLS с проверкой цепочки: сервер отвечает, когда готов принимать S3-запросы
      test: ["CMD-SHELL", "curl -fsS --cacert /run/secrets/tls_ca.crt https://localhost:9000/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 3s

  storage-init:
    <<: *common
    image: rustfs/rc:v0.1.36
    profiles: [storage]
    user: "100:101"
    entrypoint: ["/bin/sh", "/etc/dgm/storage/init.sh"]
    command: []
    restart: "no"
    mem_limit: 32m
    memswap_limit: 32m
    networks: [data]
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      HOME: /tmp
    volumes:
      - ./infra/storage:/etc/dgm/storage:ro
    tmpfs:
      - /tmp:uid=100,gid=101,mode=1777,size=8m
    secrets:
      - tls_ca.crt
      - storage_admin
      - storage_catalog

# Сети (c4-deployment.md, раздел 4.2). edge и app подключаются у контейнеров следующих профилей.
# data и obs закрыты для выхода в интернет. Порты на хост здесь не публикуются: отладочные порты в compose.debug.yaml.
networks:
  edge: {}
  app: {}
  data:
    internal: true
  obs:
    internal: true

volumes:
  pgdata: {}
  kafkadata: {}
  objectdata: {}

